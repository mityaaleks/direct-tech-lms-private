/* Тема по брендбуку ПОРУБЛЮ 2026: палитра стр. 35–37, типографика стр. 39–46, «ценник» стр. 48, стилеобразующий элемент стр. 49–53, иконографика стр. 55. Адаптация под интерфейс. */
:root{
  --blue:#4BC8FF;--blue-80:#A5E3FF;--blue-60:#D2F1FF;--blue-40:#EDF9FF;
  --red:#FF3C00;--red-80:#FF6142;--red-20:#FFE6E1;--red-10:#FFF2F1;
  --black:#000;--g70:#4D4D4D;--g40:#BFBFBF;--g20:#E5E5E5;--g10:#F2F2F2;--g05:#FAFAFA;
  --white:#fff;--canvas:#F3F7F9;
  --font:"Golos Text",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;--r-sm:12px;--side:288px;--top:64px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 16px)}
body{margin:0;background:var(--canvas);color:var(--black);font:400 16px/1.3 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-weight:700;line-height:1.1;margin:0}
h1{font-size:32px;letter-spacing:-.04em}
h2{font-size:22px;letter-spacing:-.02em}
h3{font-size:18px;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--black);outline-offset:2px;border-radius:8px}
[tabindex="-1"]:focus{outline:none}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor}

/* ---------- каркас ---------- */
.top{position:sticky;top:0;z-index:30;height:var(--top);background:var(--white);border-bottom:1px solid var(--g20);display:flex;align-items:center;gap:16px;padding:0 24px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;flex:none}
.brand img{height:22px;display:block}
.brand .kb{font-weight:600;font-size:14px;padding-left:14px;border-left:1px solid var(--g40);line-height:1.2}
.search{flex:1;max-width:560px;margin:0 auto;position:relative}
.search input{width:100%;height:44px;border:1.5px solid var(--g20);border-radius:var(--r-sm);background:var(--g05);padding:0 40px 0 44px;font-size:16px}
.search input:focus{border-color:var(--black);background:var(--white);outline:none}
.search>svg{position:absolute;left:14px;top:11px}
.search .clear{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center}
.search .clear:hover{background:var(--g10)}
.mini{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;flex:none;text-decoration:none;padding:6px 10px;border-radius:var(--r-sm)}
.mini:hover{background:var(--blue-40)}
.ring{width:34px;height:34px}
.menu-btn{display:none;width:44px;height:44px;border:0;background:none;border-radius:var(--r-sm);place-items:center;flex:none}
.menu-btn:hover{background:var(--g10)}

.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:calc(100vh - var(--top))}
.side{background:var(--white);border-right:1px solid var(--g20);padding:20px 14px 32px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto}
.side .grp{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:18px 12px 8px}
.side .grp:first-child{padding-top:4px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:10px 12px;border:0;background:none;border-radius:var(--r-sm);text-align:left;text-decoration:none;font-size:15px;line-height:1.25}
.nav:hover{background:var(--blue-40)}
.nav[aria-current=page]{background:var(--blue-60);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600}
.tree{margin:2px 0 4px 22px;padding-left:12px;border-left:1.5px solid var(--g20)}
.tree .nav{font-size:14px;min-height:40px;padding:8px 10px;gap:10px}
.st{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--black);flex:none;display:grid;place-items:center;font-size:11px;font-weight:700}
.st.prog{background:linear-gradient(90deg,var(--blue) 50%,transparent 50%)}
.st.done{background:var(--blue);border-color:var(--blue)}
.st.done svg{width:14px;height:14px;stroke-width:3}
.tw{display:flex;align-items:center}
.tw .nav{flex:1}
.caret{width:36px;height:36px;border:0;background:none;border-radius:10px;display:grid;place-items:center;flex:none}
.caret:hover{background:var(--g10)}
.caret svg{transition:transform .2s}
.caret[aria-expanded=false] svg{transform:rotate(-90deg)}

main{min-width:0;padding:32px clamp(16px,3.2vw,48px) 64px}
.page{max-width:1120px;margin:0 auto}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;margin-bottom:16px}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.lead{font-size:16px;line-height:1.4;max-width:680px;margin-top:10px}
.foot{font-size:12px;line-height:1.4;margin-top:40px;padding-top:16px;border-top:1px solid var(--g20);max-width:1120px;margin-inline:auto}

/* ---------- элементы ---------- */
.tag{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;background:var(--black);color:var(--white);font-size:12px;font-weight:600;border-radius:0 5px 5px 5px;white-space:nowrap}
.tag.lite{background:var(--white);color:var(--black);box-shadow:inset 0 0 0 1.5px var(--black)}
.tag.red{background:var(--red);color:var(--black)}
.tag.blue{background:var(--blue);color:var(--black)}
.price{display:inline-block;background:var(--black);color:var(--white);padding:10px 16px 12px;border-radius:0 9px 9px 9px;font-weight:700;line-height:1.1;transform:rotate(-4deg);font-size:15px}
.price b{display:block;font-size:24px;letter-spacing:-.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 20px;border-radius:var(--r-sm);border:1.5px solid var(--black);background:var(--white);font-size:16px;font-weight:600;text-decoration:none;line-height:1.2;text-align:center}
.btn:hover{background:var(--blue-40)}
.btn.pri{background:var(--black);color:var(--white)}
.btn.pri:hover{background:var(--g70);border-color:var(--g70)}
.btn.ghost{border-color:transparent}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r-sm);flex:none}
.icon-btn:hover{background:var(--blue-40)}
.icon-btn[aria-pressed=true] svg{fill:var(--red);stroke:var(--red)}
.bar{height:8px;border-radius:8px;background:var(--blue-60);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--black);border-radius:8px;transition:width .3s}
.card{background:var(--white);border-radius:var(--r);border:1px solid var(--g20)}
.pad{padding:24px}
.row-gap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;align-items:center}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg.i{width:18px;height:18px}

/* ---------- обложки (стилеобразующий элемент) ---------- */
.cover{background:var(--blue);position:relative;overflow:hidden}
.cover svg.el{position:absolute;inset:0;width:100%;height:100%}
.thumb{width:56px;height:56px;border-radius:12px;flex:none;position:relative;overflow:hidden;background:var(--blue)}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.thumb.test{background:var(--black)}

/* ---------- главная / курс ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);border-radius:24px;overflow:hidden;background:var(--blue);min-height:300px}
.hero .txt{padding:32px;display:flex;flex-direction:column;gap:16px;position:relative;z-index:1}
.hero h1,.hero h2{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.05em;line-height:1.05}
.hero .bar{background:var(--white)}
.hero .art{position:relative;min-height:220px}
.hero .art .price{position:absolute;left:8%;bottom:14%;z-index:2}
.hero .btn,.hero .tag,.course-head .tag{align-self:flex-start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:24px 0}
.stat{padding:20px}
.stat .k{font-size:14px;font-weight:600;display:flex;gap:8px;align-items:center}
.stat .v{font-size:32px;font-weight:700;letter-spacing:-.04em;margin-top:12px;line-height:1}
.stat .s{font-size:13px;margin-top:8px;line-height:1.35}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:32px 0 14px;flex-wrap:wrap}

.list{background:var(--white);border:1px solid var(--g20);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:16px;padding:14px 16px;border-top:1px solid var(--g20);min-height:84px}
.item:first-child{border-top:0}
.item.link{cursor:pointer}
.item.link:hover{background:var(--blue-40)}
.item .body{flex:1;min-width:0}
.item .t{font-weight:600;font-size:16px;line-height:1.25}
.item .d{font-size:14px;line-height:1.35;margin-top:4px}
.item .meta{margin-top:6px;font-size:13px}
.item .end{display:flex;align-items:center;gap:8px;flex:none}
.num{width:36px;height:36px;border-radius:0 8px 8px 8px;background:var(--black);color:var(--white);font-weight:700;display:grid;place-items:center;flex:none;font-size:15px}
.num.done{background:var(--blue);color:var(--black)}
.status{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.status::before{content:"";width:10px;height:10px;border-radius:50%;border:1.5px solid var(--black)}
.status.prog::before{background:linear-gradient(90deg,var(--blue) 50%,transparent 50%);border-color:var(--black)}
.status.done::before{background:var(--blue);border-color:var(--blue)}

.course-head{border-radius:24px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 300px;background:var(--blue)}
.course-head .txt{padding:32px;display:flex;flex-direction:column;gap:14px}
.course-head .art{position:relative;min-height:220px}
.course-grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;margin-top:24px;align-items:start}
.aside-card{position:sticky;top:calc(var(--top) + 24px)}
.aside-card h3{margin-bottom:12px}
.checklist{list-style:none;padding:0;margin:0;display:grid;gap:10px;font-size:14px;line-height:1.35}
.checklist li{display:flex;gap:10px;align-items:flex-start}

/* ---------- урок ---------- */
.lesson{display:grid;grid-template-columns:minmax(0,760px) 240px;gap:40px;justify-content:center}
.lesson-top{background:var(--white);border:1px solid var(--g20);border-radius:var(--r);padding:16px 20px;display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.lesson-top .bar{flex:1;min-width:120px}
.doc{background:var(--white);border:1px solid var(--g20);border-radius:var(--r);padding:clamp(20px,4vw,48px)}
.doc h1{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.05em;margin:14px 0 14px}
.doc .disc{margin:24px 0 8px;padding:14px 16px;background:var(--blue-40);border-radius:0 12px 12px 12px;font-size:14px;line-height:1.4}
.doc h2.sec{margin:40px 0 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;scroll-margin-top:calc(var(--top) + 20px)}
.doc h3{margin:24px 0 10px}
.doc p,.doc li{font-size:17px;line-height:1.5;overflow-wrap:anywhere}
.doc p+p{margin-top:12px}
.doc ol.steps{margin:12px 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.doc ol.steps li{counter-increment:s;display:flex;gap:14px;align-items:center;padding:12px 14px;border:1.5px solid var(--g20);border-radius:12px;font-weight:600}
.doc ol.steps li::before{content:counter(s);width:32px;height:32px;flex:none;border-radius:0 7px 7px 7px;background:var(--black);color:var(--white);display:grid;place-items:center;font-size:14px}
.flow{margin:16px 0;padding:16px;background:var(--canvas);border-radius:14px}
.flow .lbl{font-size:13px;font-weight:600;margin-bottom:10px}
.flow ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.flow li{display:flex;align-items:center;gap:8px;font-size:15px!important;line-height:1.25!important}
.flow li span{background:var(--white);border:1.5px solid var(--black);border-radius:0 8px 8px 8px;padding:8px 12px;font-weight:600}
.flow li+li::before{content:"→";font-weight:700}
.sms{margin:14px 0;display:grid;gap:8px}
.sms .if{font-size:14px;font-weight:600;line-height:1.35}
.sms .bubble{background:var(--blue-60);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:15px;line-height:1.45;max-width:560px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--g10);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.callout{margin:16px 0;padding:16px 18px;border-left:4px solid var(--red);background:var(--red-10);border-radius:0 12px 12px 0;font-size:15px;line-height:1.45}
.callout b{display:block;margin-bottom:4px}
.quiz fieldset{border:1.5px solid var(--g20);border-radius:14px;padding:18px;margin:14px 0;min-width:0}
.quiz legend{font-weight:600;font-size:16px;line-height:1.35;padding:0 6px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1.5px solid var(--g20);margin-top:8px;cursor:pointer;font-size:15px;line-height:1.4}
.opt:hover{background:var(--blue-40)}
.opt:has(input:checked){border-color:var(--black);background:var(--blue-60)}
.opt input{accent-color:var(--black);width:18px;height:18px;margin:1px 0 0;flex:none}
.opt.ok{border-color:var(--blue);background:var(--blue-60)}
.opt.bad{border-color:var(--red);background:var(--red-20)}
.fb{margin-top:10px;font-size:14px;line-height:1.45;padding:10px 12px;border-radius:10px;background:var(--g05)}
.fb b{font-weight:700}
.complete{margin-top:40px;padding:24px;border-radius:var(--r);background:var(--blue);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.complete .tx{max-width:420px;font-size:15px;line-height:1.4}
.complete .tx b{display:block;font-size:20px;margin-bottom:4px;letter-spacing:-.02em}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.pager a{display:flex;flex-direction:column;gap:4px;padding:16px;border:1.5px solid var(--g20);border-radius:var(--r);text-decoration:none;background:var(--white);min-height:76px}
.pager a:hover{border-color:var(--black)}
.pager a.nx{text-align:right;align-items:flex-end}
.pager small{font-size:12px;font-weight:600}
.pager span{font-weight:600;line-height:1.25}
.toc{position:sticky;top:calc(var(--top) + 24px);font-size:14px}
.toc h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:10px}
.toc a{display:block;padding:7px 10px;border-left:2px solid var(--g20);text-decoration:none;line-height:1.3}
.toc a:hover{border-color:var(--black)}
.toc a.on{border-color:var(--red);font-weight:600}

/* ---------- тест ---------- */
.test-wrap{max-width:820px;margin:0 auto}
.qnav{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.qnav button{width:40px;height:40px;border-radius:0 8px 8px 8px;border:1.5px solid var(--g40);background:var(--white);font-weight:600;font-size:14px}
.qnav button.ans{background:var(--blue-60);border-color:var(--blue)}
.qnav button[aria-current=step]{border-color:var(--black);background:var(--black);color:var(--white)}
.qcard{padding:clamp(20px,4vw,40px)}
.qcard h2{font-size:clamp(20px,2.6vw,26px);line-height:1.2;margin:12px 0 20px}
.qfoot{display:flex;justify-content:space-between;gap:12px;margin-top:24px;flex-wrap:wrap}
.score{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
.big{font-size:64px;font-weight:700;letter-spacing:-.05em;line-height:1}
.mods{display:grid;gap:10px;margin-top:16px}
.mods .m{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.mods .m .bar{grid-column:1/-1}
.rv{padding:16px 18px;border-radius:12px;border-left:4px solid var(--blue);background:var(--blue-40);margin:12px 0;font-size:15px;line-height:1.45}
.rv.bad{border-color:var(--red);background:var(--red-10)}
.rv h3{font-size:16px;margin-bottom:6px;line-height:1.3}
.rv p+p{margin-top:4px}
.err{color:var(--black);background:var(--red-20);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:600;margin-top:12px}

/* ---------- справочник ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:0 10px 10px 10px;border:1.5px solid var(--g40);background:var(--white);font-size:14px;font-weight:600}
.chip[aria-pressed=true]{background:var(--black);color:var(--white);border-color:var(--black)}
.chip:hover:not([aria-pressed=true]){border-color:var(--black)}
mark{background:var(--blue-80);color:inherit;border-radius:3px;padding:0 1px}
.snip{font-size:14px;line-height:1.4;margin-top:6px}
.pending{margin-top:32px}
.pending summary{cursor:pointer;font-weight:600;padding:16px 20px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.pending summary::-webkit-details-marker{display:none}
.pending ul{margin:0;padding:0 20px 16px;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 20px}
.pending li{font-size:14px;line-height:1.35;padding:8px 0;border-top:1px solid var(--g20);display:flex;gap:10px;align-items:flex-start}
.pending li svg{width:18px;height:18px;margin-top:1px}
.empty{padding:40px 24px;text-align:center;font-size:15px;line-height:1.4}

/* ---------- прогресс ---------- */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.two>.card{min-width:0;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-top:1px solid var(--g20);vertical-align:top}
th{font-weight:600;border-top:0;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.notes{font-size:14px;line-height:1.45}
.notes li+li{margin-top:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--black);color:var(--white);padding:12px 18px;border-radius:0 12px 12px 12px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100vw - 32px)}

/* ---------- нижняя навигация ---------- */
.tabs{display:none}
.scrim{display:none}

@media (max-width:1279px){.lesson{grid-template-columns:minmax(0,760px)}.toc{display:none}}
@media (max-width:1100px){.course-grid{grid-template-columns:1fr}.aside-card{position:static}}
@media (max-width:1023px){
  .menu-btn{display:grid}
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;height:100%;width:min(320px,86vw);z-index:50;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 0 1px var(--g20)}
  .side.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:45}
  .scrim[hidden]{display:none}
  .top{padding:0 12px;gap:8px}
  .mini .lbl{display:none}
  main{padding-bottom:110px}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--g20);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;text-decoration:none;padding:6px 2px;border-radius:10px;min-height:52px;justify-content:center}
  .tabs a[aria-current=page]{background:var(--blue-60)}
  .tabs a[aria-current=page] svg{stroke-width:2.6}
}
@media (max-width:760px){
  h1{font-size:28px}
  .brand .kb{display:none}
  .brand img{height:18px}
  .hero,.course-head{grid-template-columns:1fr;border-radius:20px}
  .hero .art,.course-head .art{min-height:150px;order:-1}
  .hero .txt,.course-head .txt{padding:22px}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.stat{padding:12px}.stat .v{font-size:24px;margin-top:8px}.stat .s{display:none}.stat .k{font-size:12px;gap:4px}.stat .k svg{display:none}
  .two{grid-template-columns:1fr}
  .item{align-items:flex-start;padding:14px}
  .item .thumb{width:44px;height:44px}
  .item .end .status{display:none}
  .doc p,.doc li{font-size:16px}
  .pager{grid-template-columns:1fr}
  .pager a.nx{text-align:left;align-items:flex-start}
  .score{grid-template-columns:1fr;gap:12px}
  .big{font-size:52px}
  .search input{font-size:16px;height:42px}
  .mini{display:none}
  .complete{padding:20px}
  .complete .btn{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{.top,.side,.tabs,.complete,.pager,.toc{display:none!important}.shell{display:block}.doc{border:0}}
</style>
</head>
<body>

<script type="application/json" id="content">{"modules": [{"id": "overview", "title": "Этапы подключения нового партнёра", "source": "Этапы подключения нового партнера.pdf, стр. 1", "text": "Новый партнёр\n1. Определение условий\nФорма сотрудничества: офлайн, онлайн или смешанная схема.\nУсловия взаиморасчётов.\n2. Регистрация партнёра\n3. Обучение агентов\n4. Сопровождение партнёра", "limit": "Подробные действия, сроки и ответственные в исходной схеме не указаны. Регистрация — второй этап, а не завершение всей схемы.", "summary": "Общая схема из четырёх этапов: условия, регистрация, обучение агентов, сопровождение."}, {"id": "conditions", "title": "Работа с партнёром", "source": "Работа с партнером.pdf, стр. 1–2", "text": "СТРАНИЦА 1. Стандартные Условия (Партнёр работает по оферте)\nРегистрация партнёра → Согласование ДЗБ → Регистрация партнёра в ДК → Аккредитация → Обучение Агентов → Старт продаж.\nНесколько вариантов условий (магазинов) для партнеров, файл «Продукты ДК_Ритейл» (обновляется ежемесячно).\nДК Ритейл (высокодоходный кабинет). Рассрочки субсидированные.\nДК Ритейл Лайт (ставки ниже ДК Ритейл 1) +ОД.\nДК Универсальный (низкодоходные продукты) +ОД.\nДК Выгодный (услуга по подбору кредитных продуктов) — партнёрам, которые готовы делать скидку, но не оформляют доп.услуги.\nМТС Франчайзи.\nКАБИНЕТ 1 и 2 (для партнёров с Инд.условиями).\nПредусмотрено стандартное АВ для агентов, работающих с оплатой. Изменения не предусмотрены.\nДействует автоматическая настройка Доп. Услуг. Изменения не предусмотрены.\nОговорка источника: «В исключительных возможны изменения АВ и изменения тарифа ДУ с согласования ДЦРБ».\nСТРАНИЦА 2. Индивидуальные условия (С Партнёром заключается соглашение/агентский договор)\nМенеджер регистрирует партнёра, прикладывая Инд. Договор вместо Оферты.\nОбрыв извлечения: «Либо Партнёр регистрируется самостоятельно и далее МРБ». Продолжение не додумывается.\nОтправка вводных и согласования на partner_support@dc2b.ru для подготовки договора.\nВ карточку ТО вносятся изменения согласно уведомлению Договора.\nБлоки процесса: Обсуждение ИУ с партнёром → Расчет Фин. Модели РРРБ → Отправка вводных и согласования на partner_support@dc2b.ru для подготовки договора → Согласование договора в СБИС → Подписание партнёром 2 экз.\nЕсть возможность подписания по ЭДО.\nСкан в тот же день на partner_support@dc2b.ru.\nОригинал в течение 3 дней отправляется в ЦО (для удалённых партнёров необходимо заказать курьера).\nПри ИУ возможно изменение Продуктовой линейки и оплата расчетного КВ в пользу ЮЛ.\nПродукты, ставки, скидки и КВ указываются в уведомлении.\nПри изменении продуктов, коммерции уведомление меняется на стороне ДК и отправляется партнёру для ознакомления.", "limit": "Актуальная продуктовая матрица не установлена. Тип дней, точка отсчёта срока и связь ЭДО с бумажными оригиналами явно не уточнены. Сокращения не расшифровываются предположением. «КАБИНЕТ 1 и 2» на странице стандартных условий подписан как вариант для ИУ.", "summary": "Стандартные условия по оферте, варианты кабинетов, индивидуальные условия и порядок подготовки договора."}, {"id": "registration", "title": "Регистрация партнёра", "source": "Регистрация партнера (ссылка google).pdf, стр. 1–2", "text": "СТРАНИЦА 1. Регистрация партнёра\nЛичный кабинет МРБ: https://dc2b.ru/\nВ извлечении подписи «презентация» и «видео»: https://dc2b.ru/files/mrb.mp4\nМенеджер регистрирует партнёра в своём кабинете. Распечатывает формы Оферты и СОПД, подписывает с партнёром и загружает в Личный кабинет. Информация передаётся для проверки ДЗБ.\nЛичный кабинет партнёра: https://dc2b.ru/files/LK_partner.pdf\nПартнёр самостоятельно регистрируется по ссылке, полученной от МРБ, подписывает документы ЭЦП. Информация передаётся для проверки ДЗБ.\nДля отправки партнёру ссылки для регистрации используется вкладка «Пригласить партнера».\nНа площадках Google Play и App Store можно скачать мобильное приложение портала.\nGoogle Play: https://play.google.com/store/apps/details?id=ru.dc2b.lk\nApp Store: https://apps.apple.com/ru/app/%D0%B4%D0%BA%D1%86/id6473836779\nПри регистрации ЮЛ вносится ФИО и телефон агента. После чего Агенту приходит СМС со ссылкой для регистрации. Рядом в извлечении указан адрес https://dc2b.ru/files/LK_UBL.pdf\nСТРАНИЦА 2. СМС-напоминания\nЕсли партнёр начал регистрацию и не завершил её: «Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли в данных ошибка в регистрации ГД, ДЗБ направит партнёра «На доработку»: «Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли УБЛ была направлена ссылка, но регистрация не начата: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Заполните анкету по ссылке, чтобы начать продавать ссылка».\nЕсли УБЛ начал регистрацию и не завершил её: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЕсли ДЗБ нашёл замечания в регистрации УБЛ и отправил его «На доработку»: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЧастота отправки напоминаний:\nНе закончил регистрацию, не начал регистрацию: СМС отправляется на следующий день, через 3 дня, раз в неделю 3 недели.\nОтправлен на доработку: сразу после выставления статуса «На доработке», на следующий день, через 3 дня, раз в неделю 3 недели.", "limit": "Ссылки и приложения не проверены. PDF LK_UBL не выдаётся за фактическую ссылку регистрации из СМС. Имя, телефон и ООО «КОМОДИНИ» — элементы шаблонов, не проверенные контакты. Расписание передано буквально. Для описанной регистрации менеджером на ИУ предыдущий документ указывает Инд. Договор вместо Офер /* ---------- стилеобразующий элемент (стр. 49–53): круг из 4 частей, сечение 2–8 % высоты ---------- */
function element(seed, w = 400, h = 260, opt = {}) {
  const v = [[300,135,170,-18,74],[290,150,160,8,112],[310,120,180,-34,62],[280,140,150,22,98]][seed % 4];
  const [cx, cy, r, a1, a2] = v, sx = w / 400, sy = h / 260;
  const k = opt.k || 1, gap = Math.max(6, h * 0.06);
  const line = a => { const t = a * Math.PI / 180, L = 900; return `M${cx - Math.cos(t) * L} ${cy - Math.sin(t) * L}L${cx + Math.cos(t) * L} ${cy + Math.sin(t) * L}`; };
  return `<svg class="el" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><g transform="translate(${opt.dx || 0} ${opt.dy || 0}) scale(${k})"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${opt.fill || '#FF3C00'}"/><path d="${line(a1)}M0 0${line(a2)}" stroke="${opt.bg || '#4BC8FF'}" stroke-width="${gap / Math.min(sx, sy) / k}" fill="none"/></g></svg>`;
}
const thumb = (i, test) => test ? `<span class="thumb test">${element(3, 56, 56, {k: .9, dx: -150, dy: -10, fill: '#4BC8FF', bg: '#000'})}</span>` : `<span class="thumb">${element(i, 56, 56, {k: .9, dx: -150, dy: -10})}</span>`;

let state = {}, lms = {quiz: {}, attempts: [], last: null}, warn = '';
const okRes = r => r && r.version === 1 && Number.isInteger(r.score) && r.score >= 0 && r.score <= TOTAL_Q && r.total === TOTAL_Q && !isNaN(Date.parse(r.date));

  const s = JSON.parse(localStorage.getItem(KEY) || 'null');

  else { const old = JSON.parse(localStorage.getItem('dt-first-module-v1') || 'null'); if (old) state.overview = old; }
  const l = JSON.parse(localStorage.getItem(LKEY) || 'null');
  if (l && typeof l === 'object') lms = {quiz: l.quiz && typeof l.quiz === 'object' ? l.quiz : {}, attempts: Array.isArray(l.attempts) ? l.attempts.filter(okRes) : [], last: typeof l.last === 'string' ? l.last : null};
  const t = JSON.parse(localStorage.getItem(TKEY) || 'null');

function save() { put(KEY, state); put(LKEY, lms); }

const doneN = () => M.filter(m => state[m.id].done).length;

    }
    if ((x = t.match(/^(Если .+?):\s*«(.+)»\.?$/))) {
      out.push(`<div class="sms"><div class="if">${inline(x[1])}</div><div class="bubble">${inline(x[2])}</div></div>`); return;
    }
    if ((x = t.match(/^(Оговорка источника|Обрыв извлечения):\s*(.*)$/))) {
      out.push(`<div class="callout"><b>${esc(x[1])}</b>${inline(x[2])}</div>`); return;
    }

}

  const score = Q.filter((q, n) => test.draft[n] === q.c).length;
  const r = {version: 1, total: TOTAL_Q, score, date: new Date().toISOString(), answers: test.draft.slice()};
  lms.attempts.push(r); lms.attempts = lms.attempts.slice(-20); put(TKEY, {version: 1, total: TOTAL_Q, score, date: r.date}); save();
  test.done = r; render(true);
};
window.tRetry = () => { test = {draft: Array(TOTAL_Q).fill(null), cur: 0, done: null}; render(true); };
function result() {
  const r = test.done, a = r.answers;
  return `<div class="page test-wrap">
  <nav class="crumbs" aria-label="Навигация"><a href="#/">Моё обучение</a>${ic('right')}<a href="#/course">${esc(COURSE.title)}</a>${ic('right')}<span>Результат</span></nav>
  <section class="course-head" style="grid-template-columns:minmax(0,1fr) 220px"><div class="txt"><span class="tag">Результат попытки</span>
    <div class="score"><div class="big">${r.score}/${r.total}</div><div><h1 style="font-size:28px">${pct(r.score, r.total)}% верных ответов</h1><p style="margin-top:8px;font-size:15px;line-height:1.4">Самопроверка, не аттестация. Порог не задан. Отметки изучения не изменены.</p></div></div>
    <div class="row-gap"><button class="btn pri" onclick="tRetry()">Новая попытка</button><a class="btn" href="#/course">К программе курса</a></div></div><div class="art cover">${element(2)}</div></section>
  <div class="card pad" style="margin-top:24px"><h2>По урокам</h2><div class="mods">${M.map((m, i) => { const ids = Q.map((q, n) => q.m === i ? n : -1).filter(n => n >= 0), ok = ids.filter(n => a[n] === Q[n].c).length; return `<div class="m"><a href="#/lesson/${m.id}">${i + 1}. ${esc(m.title)}</a><strong>${ok} из ${ids.length}</strong><div class="bar"><span style="width:${pct(ok, ids.length)}%"></span></div></div>`; }).join('')}</div></div>
  <h2 style="margin:32px 0 8px">Разбор ответов</h2>
  ${Q.map((q, n) => `<div class="rv ${a[n] === q.c ? '' : 'bad'}"><h3>${n + 1}. ${esc(q.t)}</h3><p><b>${a[n] === q.c ? 'Верно.' : 'Ошибка.'}</b> Твой ответ: ${esc(q.a[a[n]])}</p>${a[n] === q.c ? '' : `<p>Правильный ответ: ${esc(q.a[q.c])}</p>`}<p>${esc(q.e)}</p><p style="font-size:13px">Источник: ${esc(q.source)}</p></div>`).join('')}
  </div>`;
}

/* ---------- справочник и поиск ---------- */
function snippet(m, q) {
  const t = (m.title + '\n' + m.text + '\n' + m.limit).replace(/\n/g, ' · '), i = t.toLocaleLowerCase('ru').indexOf(q);
  if (i < 0) return null;
  const s = Math.max(0, i - 70), e = Math.min(t.length, i + q.length + 110);
  return (s ? '…' : '') + esc(t.slice(s, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length, e)) + (e < t.length ? '…' : '');
}
function library(favOnly) {
  const f = favOnly ? 'fav' : libFilter;
  const list = M.filter(m => f === 'all' || (f === 'fav' && state[m.id].fav) || (f === 'todo' && !state[m.id].done) || (f === 'done' && state[m.id].done));
  return `<div class="page"><div class="head"><div><h1>${favOnly ? 'Избранное' : 'Все материалы'}</h1><p class="lead">${favOnly ? 'Материалы, отмеченные звёздочкой. Быстрый доступ без прохождения курса.' : 'Рабочий справочник: открывай нужный документ сразу, без прохождения курса. Поиск — в строке сверху.'}</p></div></div>
  ${favOnly ? '' : `<div class="chips" role="group" aria-label="Фильтр">${[['all', 'Все'], ['todo', 'Не изучено'], ['done', 'Изучено'], ['fav', 'Избранное']].map(([k, t]) => `<button class="chip" aria-pressed="${libFilter === k}" onclick="setFilter('${k}')">${t}</button>`).join('')}</div>`}
  <div class="list" style="margin-top:16px">${list.length ? list.map(m => lessonRow(m, M.indexOf(m))).join('') : `<div class="empty">${favOnly ? 'В избранном пока пусто. Нажми звёздочку у материала, чтобы он появился здесь.' : 'Нет материалов с таким статусом.'}</div>`}</div>
  ${favOnly ? '' : `<details class="card pending"><summary><span>Ещё в базе «${esc(C.collection)}» — не перенесены в портал</span><span class="tag lite">${C.pending.length}</span></summary>
    <ul>${C.pending.map(p => `<li>${ic('lock')}<span>${esc(p)}</span></li>`).join('')}</ul>
    <p style="padding:0 20px 18px;font-size:13px;line-height:1.4">Список названий файлов из папки проекта. Содержимое этих документов в портал ещё не добавлено и не проверено.</p></details>`}
  </div>`;
}
window.setFilter = k => { libFilter = k; render(); };
function search() {
  const q = (route.q || '').trim().toLocaleLowerCase('ru');
  if (!q) return `<div class="page"><h1>Поиск</h1><div class="list" style="margin-top:20px"><div class="empty">Введи запрос в строке сверху: название, сокращение (например, ДЗБ, СОПД) или фразу из документа.</div></div></div>`;
  const res = M.map(m => ({m, s: snippet(m, q)})).filter(x => x.s);
  const qs = Q.map((x, n) => ({x, n})).filter(({x}) => (x.t + ' ' + x.a.join(' ') + ' ' + x.e).toLocaleLowerCase('ru').includes(q));
  return `<div class="page"><div class="head"><div><h1>Поиск: «${esc(route.q)}»</h1><p class="lead">Найдено материалов: ${res.length}. Поиск идёт по полному тексту уроков и пояснений.</p></div></div>
  <div class="list">${res.length ? res.map(({m, s}) => lessonRow(m, M.indexOf(m), {snip: s})).join('') : `<div class="empty">Ничего не найдено. Проверь написание или попробуй сокращение. Часть документов ещё не перенесена — <a href="#/library">см. справочник</a>.</div>`}</div>
  ${qs.length ? `<p style="margin-top:16px;font-size:14px">Совпадения есть и в ${qs.length} вопр. итогового теста.</p>` : ''}</div>`;
}

/* ---------- прогресс ---------- */
function progress() {
  const n = doneN(), b = bestTest(), at = lms.attempts.slice().sort((x, y) => Date.parse(y.date) - Date.parse(x.date));
  return `<div class="page"><div class="head"><div><h1>Мой прогресс</h1><p class="lead">Данные хранятся только в этом браузере на этом устройстве. Синхронизации между устройствами нет — для переноса используй резервную копию.</p></div></div>
  <div class="stats" style="margin-top:0">
    <div class="card stat"><div class="k">${ic('course')}Курс</div><div class="v">${pct(n, M.length)}%</div><div class="s">изучено ${n} из ${M.length} уроков</div></div>
    <div class="card stat"><div class="k">${ic('test')}Лучший тест</div><div class="v">${b ? b.score + '/' + b.total : '—'}</div><div class="s">${b ? pct(b.score, b.total) + '% · ' + fmtDate(b.date) : 'попыток нет'}</div></div>
    <div class="card stat"><div class="k">${ic('pie')}Попыток теста</div><div class="v">${lms.attempts.length}</div><div class="s">хранятся последние 20</div></div></div>
  <div class="two"><div class="card pad"><h2 style="margin-bottom:12px">Уроки</h2><table><thead><tr><th>Урок</th><th>Статус</th><th>Самопроверка</th></tr></thead><tbody>
    ${M.map((m, i) => `<tr><td><a href="#/lesson/${m.id}">${i + 1}. ${esc(m.title)}</a></td><td><span class="status ${stat(m.id)}">${statTxt(m.id)}</span></td><td>${lms.quiz[m.id] ? lms.quiz[m.id].score + ' из ' + lms.quiz[m.id].total : '—'}</td></tr>`).join('')}</tbody></table></div>
  <div class="card pad"><h2 style="margin-bottom:12px">Попытки теста</h2>${at.length ? `<table><thead><tr><th>Дата</th><th>Результат</th></tr></thead><tbody>${at.slice(0, 8).map(x => `<tr><td>${fmtDate(x.date)}</td><td><strong>${x.score} из ${x.total}</strong> · ${pct(x.score, x.total)}%</td></tr>`).join('')}</tbody></table>` : '<p style="font-size:15px">Пока нет завершённых попыток. <a href="#/test">Пройти тест</a></p>'}</div></div>
  <div class="card pad" style="margin-top:16px"><h2>Резервная копия</h2><p style="margin:8px 0 16px;font-size:15px;line-height:1.4">Сохрани файл с отметками и результатами, чтобы перенести их в другой браузер или на другое устройство.</p>
    <div class="row-gap"><button class="btn" onclick="exportData()">${ic('dl')}Скачать копию</button><label class="btn" tabindex="0" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.querySelector('input').click()}">${ic('ul')}Загрузить копию<input type="file" accept="application/json,.json" class="sr" onchange="importData(this)"></label><button class="btn ghost" onclick="resetData()">Сбросить прогресс</button></div></div>
  <details class="card pad" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">О портале и ограничениях</summary><ul class="notes" style="margin-top:12px;padding-left:18px">
    <li>Внутренние материалы. Внешних подключений и автоматической передачи данных нет. Адреса из источников сохранены текстом, ссылки не проверены.</li>
    <li>Полнота уроков — по доступным текстовым извлечениям PDF, без визуальной сверки. Актуальность редакций не подтверждена.</li>
    <li>Оформление — адаптация брендбука ПОРУБЛЮ 2026 под интерфейс: палитра (стр. 35–37), Golos Text (стр. 39–43), «ценник» (стр. 48), стилеобразующий элемент (стр. 49–53), иконографика (стр. 55). Логотип — контуры из брендбука без перерисовки.</li>
    <li>Фон #F3F7F9 взят по HEX: в таблице брендбука для него напечатан RGB 247, 247, 249 — расхождение источника.</li>
    <li>Шрифт Golos Text встроен в файл (лицензия SIL Open Font License 1.1).</li>
    <li>HTML-портал, не PWA и не установочное приложение.</li></ul></details></div>`;
}
window.exportData = () => {
  const blob = new Blob([JSON.stringify({app: 'dt-lms', version: 2, exported: new Date().toISOString(), state, lms}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dt-lms-progress-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.append(a); a.click(); a.remove(); toast('Копия сохранена');
};
window.importData = inp => {
  const f = inp.files[0]; if (!f) return; const rd = new FileReader();
  rd.onload = () => { try { const d = JSON.parse(rd.result); if (d.app !== 'dt-lms' || !d.state) throw 0;
    M.forEach(m => { const s = d.state[m.id] || {}; state[m.id] = {started: s.started === true, done: s.done === true, fav: s.fav === true}; });
    const l = d.lms || {}; lms = {quiz: l.quiz && typeof l.quiz === 'object' ? l.quiz : {}, attempts: Array.isArray(l.attempts) ? l.attempts.filter(okRes) : [], last: l.last || null};
    save(); toast('Прогресс загружен'); render(); } catch (e) { toast('Файл не подходит: нужна копия из этого портала'); } };
  rd.readAsText(f);
};
window.resetData = () => { if (!confirm('Сбросить отметки, избранное, самопроверки и попытки теста?')) return; M.forEach(m => state[m.id] = {started: false, done: false, fav: false}); lms = {quiz: {}, attempts: [], last: null}; save(); try { localStorage.removeItem(TKEY); } catch (e) {} test.done = null; toast('Прогресс сброшен'); render(); };

/* ---------- запуск ---------- */
window.go = go;
let sT;
$('#q').addEventListener('input', e => { clearTimeout(sT); const v = e.target.value; $('#qClear').hidden = !v; sT = setTimeout(() => { query = v; if (v.trim()) { history.replaceState(null, '', '#/search/' + encodeURIComponent(v)); route = parse(); render(); } else if (route.v === 'search') go('#/library'); }, 180); });
$('#qClear').onclick = () => { $('#q').value = ''; $('#qClear').hidden = true; if (route.v === 'search') go('#/library'); $('#q').focus(); };
$('#menuBtn').onclick = () => drawer(!$('#side').classList.contains('open'));
$('#scrim').onclick = () => drawer(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false); if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); } });
route = parse();
if (route.v === 'search' && route.q) { $('#q').value = route.q; $('#qClear').hidden = false; }
render();
</script>
</body>
</html>
