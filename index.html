ржки:<\/b><\/p><ul><li><a href=\"tel:+74957770001\">8 (495) 777-0-001<\/a><\/li><li><a href=\"tel:+78002500520\">8 (800) 250-0-520<\/a><\/li><\/ul><p><a href=\"https://www.mtsbank.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Сайт организации ↗<\/a><\/p><\/div><\/details><\/div>", "product-settings": "<p class=\"lead\">Изменения настроек партнёра: финансовая модель, согласования и письмо с нужными вложениями.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"product-settings-panel-services\" aria-selected=\"true\" data-group=\"product-settings\" data-tab=\"services\" id=\"product-settings-tab-services\" role=\"tab\" tabindex=\"0\" type=\"button\">Дополнительные услуги<\/button><button aria-controls=\"product-settings-panel-same\" aria-selected=\"false\" data-group=\"product-settings\" data-tab=\"same\" id=\"product-settings-tab-same\" role=\"tab\" tabindex=\"-1\" type=\"button\">Настройки САМЕ<\/button><\/div><section aria-labelledby=\"product-settings-tab-services\" id=\"product-settings-panel-services\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Согласование дополнительных продуктов<\/h2><ol><li>Подготовь финансовую модель по партнёру с указанием корректировок.<\/li><li>Направь ФМ непосредственно своему руководителю — РРРБ / РРБ.<\/li><li>Для настроек дополнительных продуктов требуется предварительное согласование с ДЦРБ.<\/li><li>РРРБ и РРБ направляют ФМ на согласование в partner_support@dc2b.ru.<\/li><\/ol><\/section><section><h2>Подключение<\/h2><button data-copy-id=\"product-add\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"product-add\" tabindex=\"0\">Кому: partner_support@dc2b.ru\nТема: [Наименование партнёра] / [ИНН]\n\nДобрый день, коллеги!\nПрошу подключить дополнительную услугу: [наименование продукта и стоимость].\nФМ во вложении.<\/pre><\/section><section><h2>Отключение<\/h2><button data-copy-id=\"product-remove\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"product-remove\" tabindex=\"0\">Кому: partner_support@dc2b.ru\nТема: [Наименование партнёра] / [ИНН]\n\nДобрый день, коллеги!\nПрошу отключить дополнительную услугу: [наименование продукта и стоимость].\nФМ во вложении.<\/pre><\/section><section><h2>Изменение стоимости<\/h2><button data-copy-id=\"product-cost\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"product-cost\" tabindex=\"0\">Кому: partner_support@dc2b.ru\nТема: [Наименование партнёра] / [ИНН]\n\nДобрый день, коллеги!\nПрошу скорректировать стоимость дополнительной услуги:\nс [наименование продукта и стоимость]\nна [наименование продукта и стоимость].\nФМ во вложении.<\/pre><\/section><\/section><section aria-labelledby=\"product-settings-tab-same\" hidden=\"\" id=\"product-settings-panel-same\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Подготовка запроса<\/h2><ol><li>Подготовь финансовую модель по партнёру с корректировками и направь своему руководителю — РРРБ / РРБ.<\/li><li>Дальнейшее направление ФМ в partner_support@dc2b.ru выполняют РРРБ и РРБ.<\/li><li>Для письма по изменению или отключению САМА в примере предусмотрено вложение с согласованием ДЦРБ.<\/li><\/ol><\/section><section><h2>Изменение приоритетности банков<\/h2><p>Укажи необходимую последовательность приоритетности по банкам. Приоритеты не подставлены автоматически.<\/p><button data-copy-id=\"same-change\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"same-change\" tabindex=\"0\">Кому: partner_support@dc2b.ru\nТема: [Наименование партнёра] / [ИНН]\n\nДобрый день, коллеги!\nПрошу скорректировать настройки САМА.\nНиже указываю необходимую последовательность приоритетности по банкам:\n1. [банк]\n2. [банк]\n[продолжить при необходимости]\nВо вложении согласование с ДЦРБ.<\/pre><\/section><section><h2>Отключение настроек<\/h2><button data-copy-id=\"same-remove\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"same-remove\" tabindex=\"0\">Кому: partner_support@dc2b.ru\nТема: [Наименование партнёра] / [ИНН]\n\nДобрый день, коллеги!\nПрошу отключить настройки САМА.\nВо вложении согласование с ДЦРБ.<\/pre><\/section><\/section><section><h2>Связанные материалы<\/h2><p class=\"links\"><a class=\"go\" href=\"#/article/financial-model\">ИУ и финансовая модель →<\/a><a class=\"go\" href=\"#/article/operations\">Операционное сопровождение →<\/a><\/p><\/section>", "pos-market": "<p class=\"lead\">Кто работает с локальными и региональными сетями и чем отличается.<\/p><dl class=\"defs\"><dt>ОТП Банк<\/dt><dd>Классический POS-банк с венгерскими акционерами. Представлен менеджерами и кредитными специалистами. В платформе только ОТП. Развивает онлайн-направление с СМС-подписанием. В 2026 году запустил «Бенефит», аналог специальной рассрочки.<\/dd><dt>Всегда.Да<\/dt><dd>Брокер на базе ХКФ Банка, принадлежащий Совкомбанку. Представлен силами КАМ, работает преимущественно с крупными партнёрами. Основное преимущество — специальная рассрочка на базе продукта Совкомбанка.<\/dd><dt>POSCREDIT<\/dt><dd>Классический брокер со всеми банками в стандартном предложении, кроме ХКФ. Представлен по всей стране. Сотрудники работают как самозанятые. Интеграции с 1С и другими CRM. Оформление через телефонный КЦ, онлайн и QR.<\/dd><dt>FINBOX<\/dt><dd>Классический брокер, один из первых на рынке. Принадлежит Совкомбанку, как и Всегда.Да. Представлен по всей стране. Агенты могут работать как самозанятые. Основное преимущество — специальная рассрочка Совкомбанка.<\/dd><dt>Т-Банк<\/dt><dd>Брокер на базе Тинькофф Банка. Создан для расширения продуктов в B2B, затем стал отдельным направлением. Сильное онлайн-решение и широкие интеграции. Самая короткая анкета на рынке: оформление по QR по 5 полям со 100% СМС-подписанием.<\/dd><dt>Smart Finance<\/dt><dd>Брокер, ранее «Фин Сервис». Наполнение по банкам идентично. Представлен по всей стране. МРБ может работать в штате или по ГПХ.<\/dd><dt>Ренессанс Банк<\/dt><dd>Банк, представлен менеджерами и кредитными специалистами. В платформе нет других решений, кроме Ренессанс Банка.<\/dd><dt>Inpocket<\/dt><dd>Брокер преимущественно в сегменте «Медицина/Стоматология». КВ партнёрам могут выплачивать наличными. Слабо представлен в регионах.<\/dd><dt>Халва — Совкомбанк<\/dt><dd>Единственная карта рассрочки на рынке. Гибкие условия: компенсация потери партнёру по рассрочке для нового клиента, только эквайринг. Развитая CRM-поддержка и совместные маркетинговые активности.<\/dd><\/dl><p class=\"hint\">Описание участников — по документу; дата актуальности в нём не указана.<\/p>", "direction-goals": "<p class=\"lead\">Ориентиры регионального бизнеса: доходность, объём и условия эффективной работы.<\/p><section><h2>Доходность<\/h2><ul><li>Оценка персональных рисков.<\/li><li>ДК ПЭЙ.<\/li><li>Страхование.<\/li><li>СМС.<\/li><\/ul><\/section><section><h2>Объём<\/h2><ul><li>Новый бизнес.<\/li><li>Количество активных ТО.<\/li><li>Количество новых ТО.<\/li><\/ul><\/section><section><h2>Что поддерживает работу направления<\/h2><ul class=\"kv\"><li><strong>Постоянное улучшение ПО<\/strong><\/li><li><strong>Передача кредитных досье и договоров<\/strong><\/li><li><strong>Гибкие условия по АВ, КВ и продуктам<\/strong><\/li><li><strong>Противодействие мошенничеству<\/strong><\/li><li><strong>Эффективное сопровождение<\/strong><\/li><li><strong>Достойная мотивация<\/strong><\/li><li><strong>Необходимые ресурсы<\/strong><\/li><li><strong>Вовлеченность МРБ/РРБ/РРС<\/strong><\/li><\/ul><\/section><div class=\"note\"><p>Числовые планы, целевые уровни KPI и формулы расчёта в этом материале не указаны. Перечень целей не заменяет индивидуальный план сотрудника.<\/p><\/div><section><h2>Перейти к рабочим материалам<\/h2><p class=\"links\"><a class=\"go\" href=\"#/article/power-bi\">Работа с Power BI →<\/a><a class=\"go\" href=\"#/article/saby-plans\">План работ в СБИС →<\/a><a class=\"go\" href=\"#/article/credit-dossiers\">Отправка кредитных досье →<\/a><a class=\"go\" href=\"#/article/financial-model\">ИУ и финансовая модель →<\/a><\/p><\/section>", "business-structure": "<p class=\"lead\">Роли, перечисленные в структуре регионального бизнеса, и памятка по составу обращения.<\/p><section><h2>Роли в структуре<\/h2><ul class=\"kv\"><li><strong>Директор центра развития регионального бизнеса<\/strong><\/li><li><strong>Руководитель по развитию регионального бизнеса<\/strong><\/li><li><strong>Руководитель по развитию региональных сетей<\/strong><\/li><li><strong>Менеджер по развитию бизнеса<\/strong><\/li><li><strong>ЛПР<\/strong><\/li><li><strong>Агент<\/strong><\/li><\/ul><p class=\"hint\">Это перечень ролей, не схема подчинённости и не описание должностных обязанностей.<\/p><\/section><section><h2>Что указать в обращении<\/h2><ul><li>Партнёра или ТТ.<\/li><li>Суть вопроса.<\/li><li>Номер заявки / документа.<\/li><li>Нужный срок ответа.<\/li><\/ul><button data-copy-id=\"business-request-template\" type=\"button\">Скопировать заготовку обращения<\/button><pre class=\"mail-template\" id=\"business-request-template\" tabindex=\"0\">Партнёр или ТТ: [указать]\nСуть вопроса: [указать]\nНомер заявки / документа: [указать]\nНужный срок ответа: [указать]<\/pre><div class=\"note\"><p>Нужный срок ответа — часть обращения, а не обещание отдела выполнить запрос к этой дате.<\/p><\/div><\/section><section><h2>Адреса из памятки<\/h2><p>В памятке «Сопровождение деятельности менеджера по развитию бизнеса» перечислены адреса — без описания, какой адрес для чего:<\/p><ul class=\"mails\"><li><a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru<\/a><\/li><li><a href=\"mailto:npnominal@dc2b.ru\">npnominal@dc2b.ru<\/a><\/li><li><a href=\"mailto:dogovor@dc2b.ru\">dogovor@dc2b.ru<\/a><\/li><li><a href=\"mailto:pravo@dc2b.ru\">pravo@dc2b.ru<\/a><\/li><li><a href=\"mailto:fot@dc2b.ru\">fot@dc2b.ru<\/a><\/li><li><a href=\"mailto:dsb_partners@dc2b.ru\">dsb_partners@dc2b.ru<\/a><\/li><li><a href=\"mailto:servicedesk@dc2b.ru\">servicedesk@dc2b.ru<\/a><\/li><li><a href=\"mailto:buh_doc@dc2b.ru\">buh_doc@dc2b.ru<\/a><\/li><li><a href=\"mailto:sverka@dc2b.ru\">sverka@dc2b.ru<\/a><\/li><\/ul><p class=\"hint\">Назначение адресов смотри в справочнике. Для dogovor@, fot@ и buh_doc@ назначение в материалах не указано.<\/p><p class=\"links\"><a class=\"go\" href=\"#/article/contact-directory\">Куда обращаться →<\/a> <a class=\"go\" href=\"#/article/operations\">Операционное сопровождение →<\/a><\/p><\/section>", "motivation-mrb": "<p class=\"lead\">Базовая ежемесячная премия для работников ООО «ДИРЕКТ ТЕХ» в должностях «Менеджер по развитию бизнеса» и «Руководитель по развитию региона» складывается из суммы показателей.<\/p>\n<h2>Показатели премии<\/h2>\n<div class=\"tbl\"><table><thead><tr><th>№<\/th><th>Показатель<\/th><th>Расчёт / размер<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td>Объём продаж кредитов/займов банков-партнёров<sup>*<\/sup><\/td><td>Кредитный оборот ТТ × коэффициент выплат (шкала ниже)<\/td><\/tr>\n<tr><td>2<\/td><td>СМС, оформленные с кредитом/займом банков-партнёров<sup>***<\/sup><\/td><td>Сумма договоров × 0,2% — за продажу от ДИРЕКТ ТЕХ<\/td><\/tr>\n<tr><td>3<\/td><td>Объём продаж ООО МКК «ДК Пэй» и сервиса рассрочки ООО «ПО РУБЛЮ»<sup>****<\/sup><\/td><td>Кредитный оборот ТТ × коэффициент выплат (та же шкала)<\/td><\/tr>\n<tr><td>4<\/td><td>СМС, оформленные с займом ДК Пэй и сервисом рассрочки ПО РУБЛЮ<sup>*****<\/sup><\/td><td>Сумма договоров × 0,2% — за продажу от ДИРЕКТ ТЕХ<\/td><\/tr>\n<tr><td>5<\/td><td>Продажа услуг страхования<sup>******<\/sup><\/td><td>Сумма страхового полиса × 5%<\/td><\/tr>\n<tr><td>6<\/td><td>Продажа полиса страхования<sup>*******<\/sup><\/td><td>Сумма страхового полиса × 5%<\/td><\/tr>\n<tr><td>7<\/td><td>Объём продаж «Новый бизнес»<sup>********<\/sup><\/td><td>от 1 000 000 — 0,5%; от 3 000 000 — 0,8%<\/td><\/tr>\n<tr><td>8<\/td><td>Базовое вознаграждение (от количества отработанных дней)<\/td><td>3 700 руб.<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>Шкала коэффициента для показателей 1 и 3<\/h3>\n<div class=\"tbl\"><table><thead><tr><th>Кредитный оборот ТТ, руб.<\/th><th>Коэффициент выплат<\/th><\/tr><\/thead><tbody>\n<tr><td>от 1 000 000<\/td><td>0,20%<\/td><\/tr><tr><td>от 2 000 000<\/td><td>0,30%<\/td><\/tr><tr><td>от 5 000 000<\/td><td>0,5%<\/td><\/tr><tr><td>от 7 000 000<\/td><td>0,65%<sup>**<\/sup><\/td><\/tr><tr><td>от 10 000 000<\/td><td>0,80%<sup>**<\/sup><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h2>Сноски<\/h2>\n<dl class=\"fn\">\n<dt>*<\/dt><dd>Кредитный оборот ТТ — общая сумма выданных кредитов по всем привлечённым ТТ в расчётном месяце, оформленных с кредитом/займом банков-партнёров. Коэффициент выплат — процент от объёма продаж, выплачиваемый сотруднику. В расчёт основного вознаграждения 1 не включаются займы ООО МКК «ДК Пэй».<\/dd>\n<dt>**<\/dt><dd>При условии выполнения плана по стоимости дополнительных услуг (полис ДМС, страхование жизни и здоровья, страхование от потери работы/дохода, СМС-информирование) — 8% от кредитного оборота ТТ. Не включаются: кредиты/займы, где клиент отказался от СМС-информирования в течение 2 дней с даты покупки; страховые продукты, по которым услуга не была предоставлена (в т. ч. отмена авторизации или возврат полиса в «период охлаждения»).<\/dd>\n<dt>***<\/dt><dd>Бонус выплачивается при выполнении таргета 90%. Не включаются: кредиты/займы с отказом от СМС-информирования в течение 2 дней; СМС и страхование, оформленные с сервисом рассрочки ООО «ПО РУБЛЮ» и займом ООО МКК «ДК Пэй».<\/dd>\n<dt>****<\/dt><dd>Кредитный оборот ТТ — сумма товаров/услуг, оформленных через сервис рассрочки ООО «ПО РУБЛЮ», и сумма займов ООО МКК «ДК Пэй». Бонус начисляется по итогам отчётного месяца во втором календарном месяце после него, если клиент оформил заём/рассрочку для оплаты товаров и в течение 40 календарных дней полностью оплатил первый ежемесячный платёж. Не включаются договоры, по которым клиенту не был предоставлен товар, и договоры без полной оплаты первого платежа в течение 40 дней.<\/dd>\n<dt>*****<\/dt><dd>Не включаются: СМС с отказом клиента в течение 2 дней; СМС, оформленные с кредитом/займом банков-партнёров; СМС по займам ДК Пэй и рассрочке ПО РУБЛЮ без полной оплаты первого платежа в течение 40 дней.<\/dd>\n<dt>******<\/dt><dd>Не включаются «Страхование жизни и здоровья» и «Страхование от потери постоянной работы/дохода», если услуга не была предоставлена (отмена авторизации, возврат в «период охлаждения»). Страховки с неистёкшим «периодом охлаждения» входят в премию следующего расчётного периода.<\/dd>\n<dt>*******<\/dt><dd>Бонус выплачивается при выполнении таргета 10% по продуктам «Страхование жизни и здоровья» и «Страхование от потери постоянной работы/дохода». Не включаются полисы, по которым услуга не была предоставлена; с неистёкшим «периодом охлаждения» — в следующий период.<\/dd>\n<dt>********<\/dt><dd>Бонус рассчитывается в течение 3 календарных месяцев с месяца первой продажи. Учитываются ТТ, где одновременно: ТО зарегистрирована на Портале и согласована ДЗБ ООО «ДИРЕКТ ТЕХ»; дата создания ТО — с 01.03.2026.<\/dd>\n<\/dl>\n<h2>Дополнительные условия выплаты<\/h2>\n<ul><li>При бумажном подписании договор оплачивается после предоставления корректного пакета документов в течение 90 календарных дней с даты оформления.<\/li><li>Договор не должен быть оформлен доказанным мошенническим способом.<\/li><\/ul>\n<h2>Сетка эффективности МРБ<\/h2>\n<p>При отставании от сетки эффективности применяется ПК.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>№<\/th><th>1 группа: шаг 500 тыс.<\/th><th>2 группа: шаг 700 тыс.<\/th><th>3 группа: шаг 1 млн<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td>300 000<\/td><td>1 000 000<\/td><td>1 000 000<\/td><\/tr><tr><td>2<\/td><td>900 000<\/td><td>1 500 000<\/td><td>2 000 000<\/td><\/tr><tr><td>3<\/td><td>1 500 000<\/td><td>2 000 000<\/td><td>3 000 000<\/td><\/tr><tr><td>4<\/td><td>2 000 000<\/td><td>2 500 000<\/td><td>4 000 000<\/td><\/tr><tr><td>5<\/td><td>2 500 000<\/td><td>3 200 000<\/td><td>5 000 000<\/td><\/tr><tr><td>6<\/td><td>3 200 000<\/td><td>3 900 000<\/td><td>6 000 000<\/td><\/tr><tr><td>7<\/td><td>3 700 000<\/td><td>4 600 000<\/td><td>7 000 000<\/td><\/tr><tr><td>8<\/td><td>4 300 000<\/td><td>5 300 000<\/td><td>8 000 000<\/td><\/tr><tr><td>9<\/td><td>4 800 000<\/td><td>6 100 000<\/td><td>9 000 000<\/td><\/tr><tr><td>10<\/td><td>5 300 000<\/td><td>6 800 000<\/td><td>10 000 000<\/td><\/tr><tr><td>11<\/td><td>5 800 000<\/td><td>7 500 000<\/td><td>12 000 000<\/td><\/tr><tr><td>12<\/td><td>6 500 000<\/td><td>8 200 000<\/td><td>13 000 000<\/td><\/tr><\/tbody><\/table><\/div>\n<p class=\"hint\">Что означает № строки (месяц работы или ступень), как определяется группа и размер ПК, в материалах не указано. Шаги в заголовках не везде совпадают с разницей между строками — значения сохранены как в источнике.<\/p>", "motivation-agent": "<p class=\"lead\">Мотивация агента и даты выплат.<\/p>\n<h2>Размер мотивации<\/h2>\n<ul class=\"kv\">\n<li><strong>2%<\/strong> — от суммы кредита (без учёта стоимости дополнительных услуг).<\/li>\n<li><strong>30%<\/strong> — от стоимости страховой премии.<\/li>\n<li><strong>20%<\/strong> — от стоимости бокса.<\/li>\n<li><strong>250 руб.<\/strong> — за продажу СМС-сервиса.<\/li>\n<\/ul>\n<h2>Когда выплачивается<\/h2>\n<p>Ежемесячно, 16–24 числа — за предыдущий месяц.<\/p>\n<h2>Условия получения<\/h2>\n<ol>\n<li>Страхование оплачивается только по СК ВСК / Ренессанс, если не было возврата в течение 14 дней.<\/li>\n<li>СМС-пакет оплачивается только за сервис PushSMS, если не было возврата в течение 2 дней.<\/li>\n<li>Договор оформлен без ошибок и инкассирован.<\/li>\n<li>Договор не оформлен доказанным мошенническим способом.<\/li>\n<\/ol>\n<div class=\"note\"><p>Файл называется «Агентская мотивация 2026», но на слайдах указано «Директ Кредит | апрель 2023». Актуальность условий не подтверждена.<\/p><\/div>\n<p class=\"links\"><a class=\"go\" href=\"#/article/payout-agent\">Порядок выплат агенту →<\/a><\/p>", "candidate-hiring": "<p class=\"lead\">Подбор МРБ: варианты поиска, собеседования и условие для верхней части окладной вилки.<\/p><section><h2>Способы поиска и этапы собеседования<\/h2><ul class=\"kv\"><li><strong>Самостоятельно РРБ<\/strong> — Поиск МРБ. После получения согласия кандидата руководитель самостоятельно проводит первичное собеседование.<\/li><li><strong>Отдел подбора персонала<\/strong> — Анкету кандидата направляют на согласование. После согласования рекрутеры связываются с кандидатом и приглашают его на вторичное собеседование.<\/li><li><strong>При помощи HR<\/strong> — Рекрутер сразу направляет кандидата на вторичное собеседование.<\/li><\/ul><p class=\"hint\">Это три варианта из документа, а не три обязательных последовательных этапа.<\/p><\/section><section><h2>Вторичное собеседование<\/h2><p>На вторичном собеседовании присутствуют:<\/p><ul><li>ДЦР.<\/li><li>РРРБ.<\/li><li>HR.<\/li><\/ul><\/section><section><h2>Верхняя часть окладной вилки<\/h2><p>Если кандидат хочет верхнюю часть окладной вилки, необходимо подготовить ДЗ с планом развития территории.<\/p><div class=\"note\"><p>Размер окладной вилки, требования к оформлению ДЗ, сроки и адрес отправки анкеты в предоставленных материалах не указаны.<\/p><\/div><\/section><section><h2>Связанные материалы<\/h2><p class=\"links\"><a class=\"go\" href=\"#/article/business-structure\">Структура регионального бизнеса →<\/a><a class=\"go\" href=\"#/article/direction-goals\">Основные цели направления →<\/a><\/p><\/section>"}}</script>
<script>'use strict';
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C=JSON.parse($('#content').textContent),STORE='dt-two-modules-v1',TREE='dt-navigation-ui-v1';
let state={},tree={},storageOK=true;const tabState={};
try{const x=JSON.parse(localStorage.getItem(STORE)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))state=x}catch{storageOK=false}
try{const x=JSON.parse(localStorage.getItem(TREE)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))tree=x}catch{}
C.modules.forEach(m=>state[m.id]={fav:state[m.id]?.fav===true});
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>el.hidden=true,2500)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state));storageOK=true}catch{storageOK=false;toast('Избранное сохранится только до закрытия страницы')}}
function route(){const a=location.hash.replace(/^#\/?/,'').split('/');let id='';try{id=decodeURIComponent(a.slice(1).join('/'))}catch{}return{v:a[0]||'library',id}}
const inSection=id=>C.modules.filter(m=>m.section===id),sectionOf=m=>C.sections.find(s=>s.id===m.section);
const plural=(n,a,b,c)=>n%100>=11&&n%100<=14?c:n%10===1?a:n%10>=2&&n%10<=4?b:c;
const favBtn=(m,short)=>`<button type="button" class="fav" data-fav="${m.id}" aria-pressed="${state[m.id].fav}" aria-label="${state[m.id].fav?'Убрать из избранного':'В избранное'}: ${E(m.title)}">${state[m.id].fav?'★':'☆'}${short?'':state[m.id].fav?' В избранном':' В избранное'}</button>`;
function list(ms){return ms.length?'<ul class="list">'+ms.map(m=>`<li><a href="#/article/${m.id}"><b>${E(m.title)}</b><span>${E(m.summary)}</span></a>${favBtn(m,true)}</li>`).join('')+'</ul>':'<p class="hint">Здесь пока пусто. <a href="#/library">Открыть базу знаний</a></p>'}
function home(){return '<div class="page"><h1>База знаний</h1><p class="lead">Инструкции, процессы и контакты для работы в Direct Tech.</p></div><div class="topic-grid">'+C.sections.map(s=>{const n=inSection(s.id).length;return `<a class="topic-tile" href="#/section/${s.id}"><h2><span aria-hidden="true">${E(s.icon)}</span>${E(s.title)}</h2><p>${E(s.summary)}</p><small>${n} ${plural(n,'материал','материала','материалов')}</small></a>`}).join('')+'</div>'}
function article(m){const s=sectionOf(m),ms=inSection(m.section),i=ms.findIndex(x=>x.id===m.id),p=ms[i-1],n=ms[i+1];
 return `<article class="doc"><div class="crumb"><a href="#/library">База знаний</a> / <a href="#/section/${s.id}">${E(s.title)}</a></div><div class="titlebar"><h1>${E(m.title)}</h1>${favBtn(m)}</div>${C.bodies[m.id]}<nav class="pager" aria-label="Соседние материалы">${p?`<a href="#/article/${p.id}"><small>Назад</small>← ${E(p.title)}</a>`:''}${n?`<a class="next" href="#/article/${n.id}"><small>Далее</small>${E(n.title)} →</a>`:`<a class="next" href="#/section/${s.id}"><small>Раздел</small>${E(s.title)} →</a>`}</nav></article>`}
function sidebar(r,m){const cur=r.v==='article'&&m?m.section:r.v==='section'?r.id:'';
 return `<div class="top"><a href="#/library" ${r.v==='library'?'aria-current="page"':''}>Все разделы</a><a href="#/favorites" ${r.v==='favorites'?'aria-current="page"':''}>Избранное</a></div>`+C.sections.map(g=>{const open=Object.prototype.hasOwnProperty.call(tree,g.id)?tree[g.id]:g.id===cur;return `<details data-sec="${g.id}" data-dt-current="${g.id===cur}" ${open||g.id===cur&&r.v==='article'?'open':''}><summary>${E(g.title)}</summary><nav aria-label="${E(g.title)}">${inSection(g.id).map(x=>`<a href="#/article/${x.id}" ${m?.id===x.id&&r.v==='article'?'aria-current="page"':''}>${E(x.title)}</a>`).join('')}</nav></details>`}).join('')}
function norm(s){return s.toLocaleLowerCase('ru').replace(/ё/g,'е')}
function render(){const r=route();if(['learning','course','lesson','test','progress'].includes(r.v)){location.replace('#/library');return}
 const m=C.modules.find(x=>x.id===r.id),s=C.sections.find(x=>x.id===r.id),side=$('#side'),pos=side.scrollTop;
 side.innerHTML=sidebar(r,m);side.scrollTop=pos;
 side.querySelectorAll('details').forEach(d=>d.addEventListener('toggle',()=>{tree[d.dataset.sec]=d.open;try{localStorage.setItem(TREE,JSON.stringify(tree))}catch{}}));
 $('#searchInput').value=r.v==='search'?r.id:'';let body;
 if(r.v==='library')body=home();
 else if(r.v==='section')body=s?`<div class="page"><div class="crumb"><a href="#/library">База знаний</a></div><h1>${E(s.title)}</h1><p class="lead">${E(s.summary)}</p>${list(inSection(s.id))}</div>`:'<h1>Раздел не найден</h1><a href="#/library">Открыть базу знаний</a>';
 else if(r.v==='article')body=m?article(m):'<h1>Материал не найден</h1><a href="#/library">Открыть базу знаний</a>';
 else if(r.v==='favorites')body='<div class="page"><h1>Избранное</h1>'+list(C.modules.filter(x=>state[x.id].fav))+'</div>';
 else if(r.v==='search'){const q=norm(r.id.trim()),ms=q?C.modules.filter(x=>norm(x.title+' '+x.summary+' '+x.text).includes(q)):[];body=`<div class="page"><h1>Поиск</h1><p class="result-count" role="status">${q?'«'+E(r.id)+'» — '+ms.length+' '+plural(ms.length,'материал','материала','материалов'):'Введи название, сокращение или адрес в строке сверху.'}</p>${q?list(ms):''}</div>`}
 else body='<h1>Страница не найдена</h1><a href="#/library">Открыть базу знаний</a>';
 $('#main').innerHTML=body;document.title=($('#main h1')?.textContent||'База знаний')+' — Direct Tech';bind();syncMenu()}
function bind(){
 document.querySelectorAll('[data-fav]').forEach(btn=>btn.onclick=()=>{const id=btn.dataset.fav,y=scrollY;state[id].fav=!state[id].fav;save();render();scrollTo(0,y);document.querySelector(`main [data-fav="${id}"]`)?.focus({preventScroll:true});if(storageOK)toast(state[id].fav?'Добавлено в избранное':'Убрано из избранного')});
 const groups=[...new Set([...document.querySelectorAll('[data-group]')].map(t=>t.dataset.group))];
 groups.forEach(group=>{const ts=[...document.querySelectorAll(`[data-group="${group}"]`)];const select=(key,focus=false)=>{tabState[group]=key;ts.forEach(t=>{const on=t.dataset.tab===key;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on;if(on&&focus)t.focus({preventScroll:true})})};
  ts.forEach((t,i)=>{t.onclick=()=>select(t.dataset.tab);t.onkeydown=e=>{let j;if(e.key==='ArrowRight')j=(i+1)%ts.length;else if(e.key==='ArrowLeft')j=(i+ts.length-1)%ts.length;else if(e.key==='Home')j=0;else if(e.key==='End')j=ts.length-1;if(j!==undefined){e.preventDefault();select(ts[j].dataset.tab,true)}}});
  select(ts.some(t=>t.dataset.tab===tabState[group])?tabState[group]:ts[0].dataset.tab)});
 document.querySelectorAll('[data-copy-id]').forEach(btn=>btn.onclick=async()=>{const pre=document.getElementById(btn.dataset.copyId);try{await navigator.clipboard.writeText(pre.textContent);toast('Скопировано')}catch{pre.focus();const rg=document.createRange();rg.selectNodeContents(pre);const sel=getSelection();sel.removeAllRanges();sel.addRange(rg);toast('Текст выделен — скопируй через меню')}});
 document.querySelectorAll('main a[target="_blank"]').forEach(a=>a.rel='noopener noreferrer')}
const mq=matchMedia('(max-width:760px)');
function syncMenu(){const open=document.body.classList.contains('menu')&&mq.matches;$('#main').inert=open;$('#searchForm').inert=open;$('#menu').setAttribute('aria-expanded',String(open));$('#menu').setAttribute('aria-label',open?'Закрыть разделы':'Открыть разделы')}
function closeMenu(){document.body.classList.remove('menu');syncMenu()}
function measure(){if(mq.matches)document.documentElement.style.setProperty('--hh',$('header').getBoundingClientRect().height+'px');else document.documentElement.style.removeProperty('--hh')}
$('#searchForm').onsubmit=e=>{e.preventDefault();const h='#/search/'+encodeURIComponent($('#searchInput').value.trim());if(location.hash===h)render();else location.hash=h;$('#searchInput').blur();closeMenu()};
$('#menu').onclick=()=>{document.body.classList.toggle('menu');syncMenu();if(document.body.classList.contains('menu'))$('#side a')?.focus()};
$('#dt-menu-backdrop').onclick=()=>{closeMenu();$('#menu').focus()};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('menu')){closeMenu();$('#menu').focus()}});
mq.addEventListener('change',()=>{closeMenu();measure()});addEventListener('resize',measure);
$('.skip').onclick=e=>{e.preventDefault();$('#main').focus()};
addEventListener('hashchange',()=>{closeMenu();render();scrollTo(0,0);$('#main').focus({preventScroll:true})});
measure();render();
</script></body></html>
