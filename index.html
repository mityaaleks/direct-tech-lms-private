ions\">Условия сотрудничества →<\/a><\/li><li><h3>Регистрация партнёра<\/h3><p>Второй этап подключения, а не завершение всей схемы.<\/p><a class=\"go\" href=\"#/article/registration\">Инструкция по регистрации →<\/a><\/li><li><h3>Обучение агентов<\/h3><p>Подробный порядок действий в предоставленном материале не указан.<\/p><\/li><li><h3>Сопровождение партнёра<\/h3><p>Подробный порядок действий в предоставленном материале не указан.<\/p><\/li><\/ol>", "conditions": "<p class=\"lead\">Выбери условия сотрудничества: по оферте или по соглашению / агентскому договору.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"conditions-panel-standard\" aria-selected=\"true\" data-group=\"conditions\" data-tab=\"standard\" id=\"conditions-tab-standard\" role=\"tab\" tabindex=\"0\" type=\"button\">Стандартные условия<\/button><button aria-controls=\"conditions-panel-individual\" aria-selected=\"false\" data-group=\"conditions\" data-tab=\"individual\" id=\"conditions-tab-individual\" role=\"tab\" tabindex=\"-1\" type=\"button\">Индивидуальные условия<\/button><\/div><section aria-labelledby=\"conditions-tab-standard\" id=\"conditions-panel-standard\" role=\"tabpanel\" tabindex=\"0\"><section><h3>Партнёр работает по оферте<\/h3><ol><li>Регистрация партнёра<\/li><li>Согласование ДЗБ<\/li><li>Регистрация партнёра в ДК<\/li><li>Аккредитация<\/li><li>Обучение Агентов<\/li><li>Старт продаж<\/li><\/ol><\/section><section><h3>Варианты условий и кабинетов<\/h3><p>Файл «Продукты ДК_Ритейл» обновляется ежемесячно. К PDF приложена матрица «Ритейл Сентябрь 2026.xlsx» — 17 листов: ДК Ритейл, МТС ФР, ДК Ритейл_Универсал, ДК Ритейл_Лайт, ДК Ритейл 1, ДК Ритейл_Промо, Рабочий, Выгодный, Стандарт, Ритейл_ИК, Ритейл_ИК1, Оптимальный, Оптимальный_Лайт, ДК Ритейл_Партнер, Travelata Франчи, Ритейл_Образование, Постех Почта Лайт.<\/p><p class=\"hint\">Ставки и продукты из матрицы сюда не перенесены: она меняется каждый месяц, смотри актуальный файл.<\/p><ul class=\"kv\"><li><strong>ДК Ритейл<\/strong> — Высокодоходный кабинет. Рассрочки субсидированные.<\/li><li><strong>ДК Ритейл Лайт<\/strong> — Ставки ниже ДК Ритейл 1. +ОД.<\/li><li><strong>ДК Универсальный<\/strong> — Низкодоходные продукты. +ОД.<\/li><li><strong>ДК Выгодный<\/strong> — Услуга по подбору кредитных продуктов. Для партнёров, которые готовы делать скидку, но не оформляют доп.услуги.<\/li><li><strong>МТС Франчайзи<\/strong> — В источнике перечислен без описания.<\/li><li><strong>КАБИНЕТ 1 и 2<\/strong> — Для партнёров с Инд.условиями. Так подписано на странице стандартных условий.<\/li><\/ul><\/section><section><h3>АВ, дополнительные услуги и исключения<\/h3><p>Предусмотрено стандартное АВ для агентов, работающих с оплатой. Изменения не предусмотрены.<\/p><p>Действует автоматическая настройка Доп. Услуг. Изменения не предусмотрены.<\/p><div class=\"note\">Оговорка источника: «В исключительных возможны изменения АВ и изменения тарифа ДУ с согласования ДЦРБ».<\/div><\/section><\/section><section aria-labelledby=\"conditions-tab-individual\" hidden=\"\" id=\"conditions-panel-individual\" role=\"tabpanel\" tabindex=\"0\"><section><h3>Соглашение / агентский договор<\/h3><p>Менеджер регистрирует партнёра, прикладывая Инд. Договор вместо Оферты.<\/p><ol><li>Обсуждение ИУ с партнёром<\/li><li>Расчет Фин. Модели РРРБ<\/li><li>Отправка вводных и согласования на partner_support@dc2b.ru для подготовки договора<\/li><li>Согласование договора в СБИС<\/li><li>Подписание партнёром 2 экз.<\/li><\/ol><p>Есть возможность подписания по ЭДО.<\/p><\/section><section><h3>После подписания<\/h3><ul class=\"kv\"><li><strong>В тот же день<\/strong> — Скан на <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru<\/a> .<\/li><li><strong>В течение 3 дней<\/strong> — Оригинал отправляется в ЦО. Для удалённых партнёров необходимо заказать курьера.<\/li><\/ul><\/section><section><h3>Продукты, коммерция и уведомление<\/h3><p>При ИУ возможно изменение Продуктовой линейки и оплата расчетного КВ в пользу ЮЛ.<\/p><p>Продукты, ставки, скидки и КВ указываются в уведомлении.<\/p><p>В карточку ТО вносятся изменения согласно уведомлению Договора.<\/p><p>При изменении продуктов, коммерции уведомление меняется на стороне ДК и отправляется партнёру для ознакомления.<\/p><\/section><p><a class=\"go\" href=\"#/article/commerce\">Подготовить письмо на согласование →<\/a><\/p><\/section>", "registration": "<p class=\"lead\">Регистрация партнёра, данные агента и напоминания — отдельно по каждой задаче.<\/p><section><h2>1. Регистрация партнёра<\/h2><section><h3>Регистрирует менеджер<\/h3><ol><li>Открой личный кабинет МРБ и зарегистрируй партнёра.<\/li><li>Распечатай формы Оферты и СОПД.<\/li><li>Подпиши документы с партнёром и загрузи их в Личный кабинет.<\/li><li>Информация передаётся для проверки ДЗБ.<\/li><\/ol><p class=\"links\"><a class=\"go\" href=\"https://dc2b.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Личный кабинет МРБ<\/a><a class=\"go\" href=\"https://dc2b.ru/files/mrb.mp4\" rel=\"noopener noreferrer\" target=\"_blank\">Видео для МРБ<\/a><\/p><\/section><section><h3>Партнёр регистрируется самостоятельно<\/h3><ol><li>Во вкладке «Пригласить партнера» отправь партнёру ссылку.<\/li><li>Партнёр самостоятельно регистрируется по полученной от МРБ ссылке.<\/li><li>Партнёр подписывает документы ЭЦП.<\/li><li>Информация передаётся для проверки ДЗБ.<\/li><\/ol><p class=\"links\"><a class=\"go\" href=\"https://dc2b.ru/files/LK_partner.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Личный кабинет партнёра · PDF<\/a><\/p><\/section><\/section><section><h2>2. Данные агента при регистрации ЮЛ<\/h2><ol><li>При регистрации ЮЛ внеси ФИО и телефон агента.<\/li><li>После этого агенту приходит СМС со ссылкой для регистрации.<\/li><\/ol><p class=\"links\"><a class=\"go\" href=\"https://dc2b.ru/files/LK_UBL.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Материал по УБЛ · PDF<\/a><\/p><\/section><section><h2>3. СМС-напоминания<\/h2><p class=\"caption\">Тексты примеров: имя, телефон и ООО «КОМОДИНИ» не являются действующими контактами для обращения.<\/p><section class=\"reg-sms-group\"><h3>Партнёр<\/h3><div class=\"reg-sms\"><h4>Регистрация не завершена<\/h4><blockquote>Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11<\/blockquote><\/div><div class=\"reg-sms\"><h4>Ошибки в регистрации ГД — возврат на доработку<\/h4><blockquote>Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11<\/blockquote><\/div><\/section><section class=\"reg-sms-group\"><h3>УБЛ<\/h3><div class=\"reg-sms\"><h4>Ссылка отправлена, регистрация не начата<\/h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Заполните анкету по ссылке, чтобы начать продавать ссылка<\/blockquote><\/div><div class=\"reg-sms\"><h4>Регистрация не завершена<\/h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка<\/blockquote><\/div><div class=\"reg-sms\"><h4>Замечания ДЗБ — возврат на доработку<\/h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка<\/blockquote><\/div><\/section><h3>Когда отправляются напоминания<\/h3><section><h4>Не начал / не закончил регистрацию<\/h4><ul><li>На следующий день.<\/li><li>Через 3 дня.<\/li><li>Раз в неделю 3 недели.<\/li><\/ul><\/section><section><h4>Отправлен на доработку<\/h4><ul><li>Сразу после выставления статуса «На доработке».<\/li><li>На следующий день.<\/li><li>Через 3 дня.<\/li><li>Раз в неделю 3 недели.<\/li><\/ul><\/section><\/section><section><h2>4. Мобильное приложение портала<\/h2><p class=\"links\"><a class=\"go\" href=\"https://play.google.com/store/apps/details?id=ru.dc2b.lk\" rel=\"noopener noreferrer\" target=\"_blank\">Google Play<\/a><a class=\"go\" href=\"https://apps.apple.com/ru/app/%D0%B4%D0%BA%D1%86/id6473836779\" rel=\"noopener noreferrer\" target=\"_blank\">App Store<\/a><\/p><\/section>", "partner-check": "<p class=\"lead\">Три проверки перед подключением партнёра.<\/p>\n<ol class=\"steps\">\n<li><h3>Блокировка счетов<\/h3><p>Проверь действующие приостановления операций по счетам партнёра. БИК — девять нулей: <code>000000000<\/code>.<\/p><p class=\"hint\">Применимость этого значения к текущей форме не подтверждена: сервис запрашивает БИК банка, выполняющего запрос.<\/p><p><a class=\"go\" href=\"https://service.nalog.ru/bi.do\" target=\"_blank\" rel=\"noopener noreferrer\">БАНКИНФОРМ ↗<\/a><\/p><\/li>\n<li><h3>Предстоящее исключение из ЕГРЮЛ<\/h3><p>Проверь, есть ли решение о предстоящем исключении ЮЛ из ЕГРЮЛ.<\/p><p><a class=\"go\" href=\"https://pb.nalog.ru/search.html#\" target=\"_blank\" rel=\"noopener noreferrer\">Прозрачный бизнес ↗<\/a><\/p><\/li>\n<li><h3>Выписка из ЕГРЮЛ<\/h3><p>Скачай выписку по ЮЛ — в инструкции указан сервис выставить-счет.рф.<\/p><p><a class=\"go\" href=\"https://xn----7sbfbqq4deedd2d1bu.xn--p1ai/vipiska-egrul/\" target=\"_blank\" rel=\"noopener noreferrer\">выставить-счет.рф ↗<\/a><\/p><p class=\"hint\">Это сторонний сервис, а не сайт ФНС. Официальный сервис выписки ФНС — <a class=\"go\" href=\"https://egrul.nalog.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">egrul.nalog.ru ↗<\/a> (добавлено не из инструкции).<\/p><\/li>\n<\/ol>", "commerce": "<p class=\"lead\">Подготовь письмо с коммерческими условиями и приложи актуальную финансовую модель.<\/p><section><h2>1. Основа письма<\/h2><ul class=\"kv\"><li><strong>Тема<\/strong> — Согласование ИУ → полное наименование ЮЛ → ИНН → название сети, если применимо.<\/li><li><strong>Вложение<\/strong> — Актуальная финансовая модель.<\/li><\/ul><\/section><section><h2>2. Данные партнёра и продукты<\/h2><p>Укажи сегмент и список юридических лиц с ИНН.<\/p><div class=\"sub\"><h3>Рассрочка<\/h3><ul><li>0-0-6 — скидка, %<\/li><li>0-0-10 — скидка, %<\/li><li>0-0-12 — скидка, %<\/li><li>0-0-18 — скидка, %<\/li><li>0-0-24 — скидка, %<\/li><\/ul><\/div><p><strong>Кредит с переплатой.<\/strong> Укажи ставку, %.<\/p><\/section><section><h2>3. КВ и период выплат<\/h2><p>Укажи даты начала и окончания выплаты КВ.<\/p><p>Варианты КВ на выбор:<\/p><ul><li>За объём — %, без дополнительных услуг.<\/li><li>За СМС — %.<\/li><li>За страхование — %.<\/li><li>За бокс — %.<\/li><li>Единая ставка КВ — %.<\/li><\/ul><\/section><section><h2>4. Дополнительные услуги<\/h2><ul class=\"kv\"><li><strong>СМС<\/strong> — Проникновение, %. Автоматическая подстановка или партнёр выдерживает самостоятельно. Тариф: ежемесячно / фиксированный, сумма в рублях.<\/li><li><strong>Страхование<\/strong> — Проникновение, %. Автоматическая подстановка или партнёр выдерживает самостоятельно. В шаблоне приведены тарифы 0,5% / 1,2%. Их актуальность не подтверждена — не подставляй автоматически.<\/li><li><strong>Бокс<\/strong> — Автоматическая подстановка или партнёр выдерживает самостоятельно. Тариф — сумма в рублях.<\/li><\/ul><\/section><section><h2>5. Агентское вознаграждение и комментарии<\/h2><p>Выбери: стандартное / нет / ИУ. Для ИУ укажи условия.<\/p><p>В комментариях зафиксируй особенности: например, выплату на одно ЮЛ с указанием этого ЮЛ или выплату КВ без привязки к дополнительным услугам.<\/p><\/section><section><h2>Шаблон письма<\/h2><p>Замени поля в квадратных скобках и оставь нужные варианты условий.<\/p><button data-copy-id=\"commerce-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"commerce-template\" tabindex=\"0\">Тема: Согласование ИУ [полное наименование ЮЛ] [ИНН] [название сети, если применимо]\n\nВложение: актуальная финансовая модель\nСегмент: [указать]\nСписок юридических лиц с ИНН: [указать]\n\nРассрочка:\n0-0-6 — скидка [ ]%\n0-0-10 — скидка [ ]%\n0-0-12 — скидка [ ]%\n0-0-18 — скидка [ ]%\n0-0-24 — скидка [ ]%\nКредит с переплатой — ставка [ ]%\n\nПериод выплаты КВ: с [дата] по [дата]\nКВ — указать выбранные варианты:\nЗа объём (без дополнительных услуг): [ ]%\nЗа СМС: [ ]%\nЗа страхование: [ ]%\nЗа бокс: [ ]%\nЕдиная ставка КВ: [ ]%\n\nДополнительные услуги:\nСМС — проникновение [ ]%; обеспечение: [автоматическая подстановка / партнёр выдерживает самостоятельно]; тариф: [ежемесячно / фиксированный], [ ] руб.\nСтрахование — проникновение [ ]%; обеспечение: [автоматическая подстановка / партнёр выдерживает самостоятельно]; тариф: [указать].\nБокс — обеспечение: [автоматическая подстановка / партнёр выдерживает самостоятельно]; тариф [ ] руб.\n\nАгентское вознаграждение: [стандартное / нет / ИУ]\nУсловия ИУ по агентскому вознаграждению: [если применимо]\nДополнительные комментарии: [указать особенности выплат и другие условия]<\/pre><\/section><section><h2>Перед отправкой<\/h2><ul><li>Тема содержит ЮЛ, ИНН и название сети, если применимо.<\/li><li>Финансовая модель приложена.<\/li><li>Данные партнёра и коммерческие условия заполнены.<\/li><li>Период выплаты и варианты КВ указаны.<\/li><li>Дополнительные услуги, АВ и особенности выплат описаны.<\/li><\/ul><\/section><section><h2>Дальнейшие действия<\/h2><p>Подготовка вводных, согласование документов и отдельные сценарии по ЮЛ и агенту.<\/p><a class=\"go\" href=\"#/article/financial-model\">К согласованию ИУ и финансовой модели →<\/a><\/section>", "requests": "<p class=\"lead\">Выбери задачу: проверка агента, отправка фото или изменение настроек ТТ и агента.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"requests-panel-paper\" aria-selected=\"true\" data-group=\"requests\" data-tab=\"paper\" id=\"requests-tab-paper\" role=\"tab\" tabindex=\"0\" type=\"button\">Проверка агента<\/button><button aria-controls=\"requests-panel-photo\" aria-selected=\"false\" data-group=\"requests\" data-tab=\"photo\" id=\"requests-tab-photo\" role=\"tab\" tabindex=\"-1\" type=\"button\">Фото + чек-лист<\/button><button aria-controls=\"requests-panel-changes\" aria-selected=\"false\" data-group=\"requests\" data-tab=\"changes\" id=\"requests-tab-changes\" role=\"tab\" tabindex=\"-1\" type=\"button\">Настройки и изменения<\/button><\/div><section aria-labelledby=\"requests-tab-paper\" id=\"requests-panel-paper\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Отправка агента на проверку<\/h2><p>Для проверки бумажным комплектом отправь письмо на <a href=\"mailto:npnominal@dc2b.ru\">npnominal@dc2b.ru<\/a>.<\/p><p><strong>Тема письма.<\/strong> ИП ФИО ИНН<\/p><\/section><section><h2>Готовые реквизиты письма<\/h2><button data-copy-id=\"paper-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"paper-template\" tabindex=\"0\">Кому: npnominal@dc2b.ru\nТема: ИП [ФИО] [ИНН]<\/pre><\/section><\/section><section aria-labelledby=\"requests-tab-photo\" hidden=\"\" id=\"requests-panel-photo\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Фото + чек-лист<\/h2><p>Этот сценарий — для партнёра, зарегистрированного на портале.<\/p><p>Отправь фото и чек-лист на <a href=\"mailto:npnominal@dc2b.ru\">npnominal@dc2b.ru<\/a>.<\/p><p><strong>Тема письма.<\/strong> ТП - ИП ФИО ИНН<\/p><div class=\"note\"><h3>Не убирай пометку «ТП»<\/h3><p>По пометке письма распределяются разным сотрудникам. Фото без «ТП» не проходят проверку и постановку партнёра на оплату.<\/p><\/div><\/section><section><h2>Что должно быть на фото<\/h2><p>Не более 6 фотографий. Чётко покажи название сети ТО и адрес.<\/p><ul><li>Общий вид ТТ и вход.<\/li><li>Магазин с четырёх ракурсов / четыре стены.<\/li><li>Ассортимент.<\/li><li>Кассовая зона.<\/li><\/ul><\/section><section><h2>Готовые реквизиты письма<\/h2><button data-copy-id=\"photo-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"photo-template\" tabindex=\"0\">Кому: npnominal@dc2b.ru\nТема: ТП - ИП [ФИО] [ИНН]\nВложения: фото ТТ (не более 6) + чек-лист<\/pre><\/section><\/section><section aria-labelledby=\"requests-tab-changes\" hidden=\"\" id=\"requests-panel-changes\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Настройка, привязка и другие изменения<\/h2><p>Для запросов на настройку, привязку, удаление, добавление и другие действия укажи данные ИП и агента.<\/p><ul class=\"kv\"><li><strong>ИП<\/strong> — ФИО и ID.<\/li><li><strong>Агент<\/strong> — ФИО и логин.<\/li><\/ul><\/section><section><h2>Где взять идентификаторы<\/h2><p>ID и логин возьми из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ».<\/p><\/section><section><h2>Шаблон запроса<\/h2><p>Заполни реквизиты и опиши нужное действие.<\/p><button data-copy-id=\"request-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"request-template\" tabindex=\"0\">ИП [ФИО]\nID [ID из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ»]\nАгент [ФИО]\nлогин [логин из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ»]\n\nЗапрос: [описать требуемое действие]<\/pre><\/section><\/section>", "financial-model": "<p class=\"lead\">Подготовь данные для расчёта и выбери дальнейший сценарий: юридическое лицо или агент.<\/p><section><h2>1. Собери вводные для расчёта<\/h2><ul class=\"kv\"><li><strong>Условия конкурентов<\/strong> — Предложения конкурентов.<\/li><li><strong>Средний чек<\/strong> — Значение для расчёта.<\/li><li><strong>Планируемый оборот<\/strong> — Ожидаемый оборот.<\/li><li><strong>Условия<\/strong> — КВ агенту / КВ ЮЛ / ставки.<\/li><li><strong>Страхование<\/strong> — Уровень проникновения и стоимость.<\/li><li><strong>СМС<\/strong> — Уровень проникновения и стоимость.<\/li><\/ul><section><button data-copy-id=\"finance-inputs-template\" type=\"button\">Скопировать список вводных<\/button><pre class=\"mail-template\" id=\"finance-inputs-template\" tabindex=\"0\">Вводные данные для расчёта финансовой модели:\n1. Условия конкурентов: [указать]\n2. Средний чек: [указать]\n3. Планируемый оборот: [указать]\n4. Условия — КВ агенту / КВ ЮЛ / ставки: [указать]\n5. Уровень проникновения страхования и стоимость страхования: [указать]\n6. Уровень проникновения СМС и стоимость СМС: [указать]<\/pre><\/section><\/section><section><h2>2. Передай документы на согласование<\/h2><p>Если нужно согласовать договор, дополнительное соглашение или уведомление на изменение — направь документ руководителю.<\/p><\/section><section><h2>3. Выбери сценарий<\/h2><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"finance-panel-company\" aria-selected=\"true\" data-group=\"finance\" data-tab=\"company\" id=\"finance-tab-company\" role=\"tab\" tabindex=\"0\" type=\"button\">ЮЛ<\/button><button aria-controls=\"finance-panel-agent\" aria-selected=\"false\" data-group=\"finance\" data-tab=\"agent\" id=\"finance-tab-agent\" role=\"tab\" tabindex=\"-1\" type=\"button\">Агент<\/button><\/div><section aria-labelledby=\"finance-tab-company\" id=\"finance-panel-company\" role=\"tabpanel\" tabindex=\"0\"><section><h2>После согласования результата с партнёром<\/h2><ol><li>Отправь письмо с реквизитами партнёра на <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru<\/a>.<\/li><li>Укажи кредитный продукт — рассрочка / кредит, сроки кредита / рассрочки, скидки по продуктам и КВ/АВ.<\/li><\/ol><button data-copy-id=\"finance-company-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"finance-company-template\" tabindex=\"0\">Кому: partner_support@dc2b.ru\n\nРеквизиты партнёра: [указать]\nКредитный продукт: [рассрочка / кредит]\nСроки кредита / рассрочки: [указать]\nСкидки по продуктам: [указать]\nКВ/АВ: [указать]<\/pre><p><a class=\"go\" href=\"#/article/commerce\">Состав письма по коммерции →<\/a><\/p><\/section><section><h2>Договор и подписание<\/h2><ol><li>После согласования ответным письмом направляют договор с номером для подписи партнёром.<\/li><li>При необходимости направляют уведомление для ознакомления партнёра.<\/li><li>Подпиши договор в течение 3 дней и отправь скан обратным письмом.<\/li><li>В этот же день закажи курьера через Bitrix — задачей.<\/li><li>Отправь оригиналы в течение 3 дней.<\/li><\/ol><\/section><section><h2>Сроки отправки документов<\/h2><div class=\"note\"><h3>Не смешивай два описания порядка отправки<\/h3><p>В сценарии финансовой модели: подписание в течение 3 дней → скан обратным письмом → заказ курьера через Bitrix в этот же день → оригиналы в течение 3 дней.<\/p><p>В общей инструкции «Работа с партнёром»: скан в тот же день, оригинал в течение 3 дней; для удалённых партнёров заказывается курьер.<\/p><p>Единая точка отсчёта и тип дней не установлены. Применимый порядок нужно уточнить, а не складывать эти сроки в один график.<\/p><\/div><\/section><\/section><section aria-labelledby=\"finance-tab-agent\" hidden=\"\" id=\"finance-panel-agent\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Подпиши договор и отправь комплект<\/h2><p>После согласования полученного результата с Агентом подпиши с ним договор и в тот же день отправь письмо.<\/p><div class=\"note\"><h3>Формулировка срока<\/h3><p>Рядом с согласованием результата с Агентом указано «не более 3 дней». Точная точка отсчёта не уточнена — её нужно подтвердить.<\/p><\/div><ul class=\"kv\"><li><strong>Кому<\/strong> — <a href=\"mailto:npnominal@dc2b.ru\">npnominal@dc2b.ru<\/a><\/li><li><strong>Копия<\/strong> — <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru<\/a><\/li><\/ul><\/section><section><h2>Тема и вложения<\/h2><p><strong>Тема письма.<\/strong> ИУ ДОГОВОР АГЕНТ ГПХ ФИО<\/p><ul><li>ИУ договор Агента ГПХ.<\/li><li>Паспорт: страницы 2–3 и прописка.<\/li><li>ИНН.<\/li><li>СНИЛС.<\/li><\/ul><\/section><section><h2>Просьба в письме<\/h2><p>Принять в работу и перевести Агента в статус «Агент Без Оплаты ДКЦ».<\/p><button data-copy-id=\"finance-agent-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"finance-agent-template\" tabindex=\"0\">Кому: npnominal@dc2b.ru\nКопия: partner_support@dc2b.ru\nТема: ИУ ДОГОВОР АГЕНТ ГПХ [ФИО]\n\nВо вложении ИУ договор Агента ГПХ, паспорт 2–3 страница и прописка, ИНН и СНИЛС. Прошу принять в работу. Прошу перевести Агента в Статус \"Агент Без Оплаты ДКЦ\"<\/pre><\/section><\/section><\/section>", "partner-attraction": "<p class=\"lead\">Где искать партнёров, как действовать при пересечении переговоров и когда партнёра передают другому МРБ.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"attraction-panel-recruit\" aria-selected=\"true\" data-group=\"attraction\" data-tab=\"recruit\" id=\"attraction-tab-recruit\" role=\"tab\" tabindex=\"0\" type=\"button\">Привлечение<\/button><button aria-controls=\"attraction-panel-transfer\" aria-selected=\"false\" data-group=\"attraction\" data-tab=\"transfer\" id=\"attraction-tab-transfer\" role=\"tab\" tabindex=\"-1\" type=\"button\">Перезакрепление<\/button><\/div><section aria-labelledby=\"attraction-tab-recruit\" id=\"attraction-panel-recruit\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Поиск партнёров — без территориальных ограничений<\/h2><p>Менеджер может приводить партнёра с любой территории без согласования.<\/p><\/section><section><h2>Если партнёр уже ведёт переговоры с другим МРБ<\/h2><p>Предварительно договоритесь между собой, чтобы избежать разногласий в индивидуальных предложениях.<\/p><ul class=\"kv\"><li><strong>Партнёр другого региона<\/strong> — Между собой договариваются РРБ.<\/li><li><strong>Партнёр одного региона<\/strong> — Между собой договариваются МРБ.<\/li><\/ul><div class=\"note\"><h3>Не путай поиск и пересечение переговоров<\/h3><p>Свободный поиск на любой территории не отменяет предварительной договорённости, если партнёр уже в переговорах с МРБ другого региона / территории.<\/p><\/div><\/section><\/section><section aria-labelledby=\"attraction-tab-transfer\" hidden=\"\" id=\"attraction-panel-transfer\" role=\"tabpanel\" tabindex=\"0\"><section><section><h2>Нет продаж более 3 месяцев<\/h2><p>Партнёра передают другому МРБ.<\/p><\/section><\/section><section><section><h2>Есть продажи, но ниже потенциала<\/h2><p>Партнёр не является первым приоритетом. Ситуация подтверждена письмом партнёра по e-mail с долей продаж.<\/p><ol><li>Партнёра передают другому МРБ, если у него есть инструмент / связи для активации партнёра.<\/li><li>По истечении 2 месяцев проводят срез результатов.<\/li><li>Если прироста нет — партнёра возвращают обратно.<\/li><\/ol><\/section><\/section><\/section>", "online-stores": "<p class=\"lead\">Способы работы с онлайн-магазинами, технические материалы и инструкции по онлайн-заказам.<\/p><section><h2>Способы работы<\/h2><ul class=\"kv\"><li><strong>Интеграция на сайте партнёра<\/strong> — Интеграция выполняется самостоятельно партнёром. <a class=\"go\" href=\"https://docs.google.com/presentation/d/1hczL0p-HGdH_bjwQhI_J7IMjaZiN6HKW/edit\" rel=\"noopener noreferrer\" target=\"_blank\">Материал по интеграции ↗<\/a><\/li><li><strong>QR-код / ссылка<\/strong> — Работа без интеграции.<\/li><li><strong>Через КЦ<\/strong> — Ещё один способ работы с онлайн-магазинами.<\/li><\/ul><\/section><section><h2>Технические материалы<\/h2><ul class=\"kv\"><li><strong>SOAP<\/strong> — <a class=\"go\" href=\"https://drive.google.com/file/d/1S2EU9oz_vYk2xCQcj-8HqEDNgKhT1Avr/view\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть материал SOAP ↗<\/a><\/li><li><strong>API<\/strong> — <a class=\"go\" href=\"https://drive.google.com/file/d/1M3gHziYEaffrP7VcZqsK3EkPQkDTbJx2/view\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть материал API ↗<\/a><\/li><\/ul><\/section><section><h2>Инструкции и онлайн-заказы<\/h2><ul class=\"kv\"><li><strong>Работа в онлайн<\/strong> — <a class=\"go\" href=\"https://drive.google.com/file/d/14CZCzG1JokWo2PLH16qv-1nC9t3filWI/view\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть инструкцию ↗<\/a><\/li><li><strong>Онлайн-заказы: видеоурок<\/strong> — <a class=\"go\" href=\"https://dc2b.ru/files/onlzakaz.mp4\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть видео ↗<\/a><\/li><li><strong>Онлайн-заказы: Партнёр<\/strong> — <a class=\"go\" href=\"https://dc2b.ru/files/LK_partner_onl.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть PDF ↗<\/a><\/li><li><strong>Онлайн-заказы: УБЛ<\/strong> — <a class=\"go\" href=\"https://dc2b.ru/files/LK_UBL_onl.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть PDF ↗<\/a><\/li><\/ul><\/section><section><h2>Ограничения онлайн-сценария<\/h2><div class=\"note\"><ul><li>СМС-подписание — только для повторных клиентов.<\/li><li>КЕБ в онлайн отсутствует.<\/li><\/ul><\/div><\/section>", "payout-company": "<p class=\"lead\">От расчёта и сверки до подписанных документов на оплату в СБИС.<\/p><section><h2>Порядок действий<\/h2><ol><li>Расчётный отдел отправляет отчёт с расчётом в начале месяца в СБИС.<\/li><li>РРБ сверяет итог. При согласовании информирует расчётный отдел и отправляет отчёт на подпись партнёру.<\/li><li>Партнёр подписывает акт и счёт.<\/li><li>РРБ направляет подписанные акт, счёт и отчёт на оплату в СБИС.<\/li><\/ol><\/section><section><h2>Если КВ связано с СЖ или СМС<\/h2><p>После получения информации о возвратах предварительный отчёт корректируется.<\/p><p><strong>С 24-го по 27-е число ежемесячно.<\/strong> Направляется отчёт с новыми данными.<\/p><div class=\"note\"><p>Это период направления скорректированного отчёта, а не установленная дата выплаты.<\/p><\/div><\/section>", "payout-agent": "<p class=\"lead\">Выбери основание сотрудничества: порядок расчёта и документы отличаются.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"agent-pay-panel-offer\" aria-selected=\"true\" data-group=\"agent-pay\" data-tab=\"offer\" id=\"agent-pay-tab-offer\" role=\"tab\" tabindex=\"0\" type=\"button\">На оферте<\/button><button aria-controls=\"agent-pay-panel-individual\" aria-selected=\"false\" data-group=\"agent-pay\" data-tab=\"individual\" id=\"agent-pay-tab-individual\" role=\"tab\" tabindex=\"-1\" type=\"button\">На ИУ<\/button><\/div><section aria-labelledby=\"agent-pay-tab-offer\" id=\"agent-pay-panel-offer\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Централизованный расчёт<\/h2><p>Премия рассчитывается централизованно и направляется на оплату вместе с премией МРБ.<\/p><\/section><section><h2>Сверка и апелляция<\/h2><ul class=\"kv\"><li><strong>После 15-го числа каждого месяца<\/strong> — Премия рассчитывается и предварительно направляется для сверки.<\/li><li><strong>1 день для РРБ<\/strong> — На сверку и апелляцию.<\/li><\/ul><div class=\"note\"><p>После 15-го числа — срок подготовки и направления на сверку, не конкретная дата выплаты.<\/p><\/div><\/section><\/section><section aria-labelledby=\"agent-pay-tab-individual\" hidden=\"\" id=\"agent-pay-panel-individual\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Расчёт и документы<\/h2><ol><li>МРБ рассчитывает премию на основании НС и файла по отказам от дополнительных услуг.<\/li><li>В СБИС на оплату направляются акт и расчёт.<\/li><\/ol><\/section><section><h2>После оплаты<\/h2><p><strong>В течение 3 дней.<\/strong> Оригиналы актов необходимо отправить в офис.<\/p><\/section><\/section>", "nominal-account": "<p class=\"lead\">Движение денежных средств по кредитному договору: от банка через счёт ДК к юридическому лицу.<\/p><section><h2>Как движутся деньги<\/h2><ol class=\"steps\"><li><h3>Банк<\/h3><p>Перечисляет средства по кредитному договору.<\/p><\/li><li><h3>Счёт ДК<\/h3><p>Получает средства от банка.<\/p><\/li><li><h3>Юридическое лицо<\/h3><p>Получает перевод от ДК.<\/p><\/li><\/ol><\/section><section><h2>Сроки перевода<\/h2><ul class=\"kv\"><li><strong>3 рабочих дня<\/strong> — Срок перевода денежных средств.<\/li><li><strong>До 5 рабочих дней<\/strong> — Документальный срок при задержке средств от банка.<\/li><\/ul><\/section><section><h2>Сегмент «Туризм»<\/h2><div class=\"note\"><h3>Договор оформлен до 12:00<\/h3><p>Средства отправляются партнёру в тот же день.<\/p><\/div><\/section><section><h2>Не путай виды выплат<\/h2><p>Этот материал — о средствах по кредитному договору. Расчёты КВ и премий описаны отдельно.<\/p><p class=\"links\"><a class=\"go\" href=\"#/article/payout-company\">Выплаты ЮЛ →<\/a><a class=\"go\" href=\"#/article/payout-agent\">Выплаты агенту →<\/a><\/p><\/section>", "refund": "<p class=\"lead\">Возврат средств, перечисленных ТО за товар, если затем произошёл возврат товара или отмена авторизации.<\/p><section><h2>Когда приходит письмо<\/h2><p>На почту МРБ приходит автоматическое письмо для партнёра с требованием вернуть средства на счёт ДКЦ.<\/p><p><strong>Отправитель, указанный в инструкции.<\/strong> Милованова Ольга Викторовна (ДК).<\/p><p>Шаблон заявления — во вложении.<\/p><\/section><section><h2>Срок возврата<\/h2><div class=\"note\"><h3>5 рабочих дней с даты письма<\/h3><p>Партнёру необходимо вернуть денежные средства на счёт ДКЦ.<\/p><\/div><\/section><section><h2>Письмо партнёру<\/h2><p>Подставь номер кредитного договора и ИНН партнёра. Реквизиты возврата не заменяй предположениями.<\/p><button data-copy-id=\"refund-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"refund-template\" tabindex=\"0\">Тема: ИП на возврат ДС по договору № [КД] инн партнера № [ИНН]\n\nДобрый день.\nВо вложении ИП на возврат ДС по договору [номер договора].\nОбращаем внимание, что в случае, если по истечении 5 (пяти) рабочих дней с даты настоящего письма не будет осуществлен возврат ошибочно перечисленных денежных средств по указанным реквизитам, ООО «Директ Тех» оставляет за собой право удержать сумму, подлежащую возврату, из последующих платежей в соответствии с условиями заключенного Соглашения / Договора. В этом случае Стороны производят взаимозачет встречных требований.<\/pre><p><a class=\"go\" href=\"https://drive.google.com/file/d/1OCkojCLWsoCkX45oqv474SfDb-m1LSD-/view?usp=drive_link\" rel=\"noopener noreferrer\" target=\"_blank\">Шаблон заявления ↗<\/a><\/p><\/section><section><h2>Если возврат не выполнен<\/h2><p>В тексте письма указано: ООО «Директ Тех» оставляет за собой право удержать подлежащую возврату сумму из последующих платежей в соответствии с условиями заключённого Соглашения / Договора. В этом случае стороны производят взаимозачёт встречных требований.<\/p><div class=\"note\"><p>Это право по условиям Соглашения / Договора, а не описание автоматического удержания сразу после истечения срока.<\/p><\/div><\/section>", "offline-order": "<p class=\"lead\">От создания заказа до подписания договора, печати спецификации и выдачи товара.<\/p><section><h2>До оформления<\/h2><ul class=\"kv\"><li><strong>Что понадобится<\/strong> — Паспорт и номер телефона клиента.<\/li><li><strong>Фото и документы<\/strong> — Фото паспорта: страницы 2–3, страница с регистрацией; фото клиента. <a href=\"#/article/dzb\">Требования и замечания ДЗБ →<\/a><\/li><\/ul><\/section><section><h2>Оформление по шагам<\/h2><ol class=\"steps\"><li><h3>Товар<\/h3><p>В разделе «Создать заказ» введи тип товара, название, стоимость и количество. Нажми «Далее».<\/p><\/li><li><h3>Короткая анкета<\/h3><p>Укажи номер телефона клиента. Загрузи фото паспорта: страницы 2–3 и страницу с регистрацией. Нажми «Далее».<\/p><\/li><li><h3>Персональные данные и фото<\/h3><p>Персональные данные заполняются автоматически. Укажи ежемесячный доход и загрузи фото клиента. Нажми «Далее».<\/p><\/li><li><h3>Паспортные данные<\/h3><p>Сведения подтянутся автоматически. Проверь их и при необходимости скорректируй. Нажми «Далее».<\/p><\/li><li><h3>Предложение<\/h3><p>Появятся предложения банков и МФО. Выбери подходящее клиенту предложение и нажми «Выбрать».<\/p><\/li><li><h3>Подписание<\/h3><p>Отправь код клиенту на номер телефона из анкеты и введи его для подтверждения подписания договора.<\/p><\/li><li><h3>Выдача товара<\/h3><p>После успешного подписания появится сообщение о выдаче кредита. Распечатай спецификацию и выдай товар клиенту.<\/p><\/li><\/ol><\/section><section><h2>Параметры в инструкции — апрель 2026<\/h2><ul class=\"kv\"><li><strong>Возраст<\/strong> — От 18 до 70 лет.<\/li><li><strong>Срок<\/strong> — От 2 до 60 месяцев.<\/li><li><strong>Первоначальный взнос<\/strong> — Без первоначального взноса.<\/li><li><strong>Сумма покупки<\/strong> — От 1 000 до 1 000 000 рублей.<\/li><\/ul><div class=\"note\"><p>Актуальность параметров продукта не подтверждена. Не используй их как гарантию доступности конкретного предложения.<\/p><\/div><\/section><section><h2>Аннулирование заказа и возврат товара<\/h2><p>Для отказа от заказа и возврата товара предусмотрены отдельные памятки. Их переходы пока не подключены: адреса не подтверждены.<\/p><p>Если деньги уже перечислены ТО, возврат ДС описан отдельно — это не инструкция по отмене заказа.<\/p><a class=\"go\" href=\"#/article/refund\">Возврат перечисленных денежных средств →<\/a><\/section><section><h2>Нужна помощь?<\/h2><ul class=\"kv\"><li><strong>Чат технической поддержки<\/strong> — Доступен 24/7 в рабочем интерфейсе.<\/li><li><strong>Электронная почта<\/strong> — <a href=\"mailto:info@direkttech.ru\">info@direkttech.ru<\/a><\/li><li><strong>Горячая линия<\/strong> — <a href=\"tel:+74952155621\">+7 495 215-56-21<\/a> С 09:00 до 21:00.<\/li><\/ul><\/section>", "credit-dossiers": "<p class=\"lead\">Подготовка комплекта, заказ курьера и отметка по каждому КД.<\/p>\n<h2>Перед отправкой<\/h2>\n<ol><li>Проверь КД на ошибки и недостающие документы.<\/li><li>Сделай акт приёма-передачи КД и приложи его в пакет документов.<\/li><li>Закажи курьера через форму.<\/li><\/ol>\n<p>Поля формы (по приложенной таблице): дата приезда курьера, ФИО контактного лица, контактный телефон, адрес, содержимое документов, кол-во КД в посылке. Те же поля — в форме <a class=\"go\" href=\"#/article/couriers\">самостоятельного вызова курьера →<\/a>.<\/p>\n<p class=\"hint\">Куда отправлять форму, в этой инструкции не указано. Адресат описан только в материале «Самостоятельный вызов курьеров».<\/p>\n<h2>После отправки<\/h2>\n<p>В отчёте «Кредитные договоры» → вкладка «Непереданные КД» проставь статус МРБ: трек-номер + дата отправки — по каждому отправленному КД.<\/p>", "couriers": "<p class=\"lead\">Два варианта: централизованный сбор КД с ТТ и самостоятельный заказ курьера МРБ.<\/p>\n<h2>Централизованный вызов<\/h2>\n<ul>\n<li>Раз в месяц, с 1 по 5 число — инкассация кредитных договоров с ТТ, где зафиксированы продажи.<\/li>\n<li>Второй поток — с 16 по 20 число, если на ТТ к этому моменту оформлено более 14 КД.<\/li>\n<li>ТТ-исключениям, которым не нужен централизованный сбор, при заведении партнёра проставляется признак в <a class=\"go\" href=\"https://lk.dc2b.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">личном кабинете ↗<\/a>.<\/li>\n<\/ul>\n<p>Изменить централизованный сбор МРБ может в своём личном кабинете:<\/p>\n<ol><li>Найти ТТ и скорректировать адрес доставки (чек-бокс в адресе ТТ).<\/li><li>Исключить ТТ из централизованной доставки.<\/li><\/ol>\n<h2>Самостоятельный вызов<\/h2>\n<ol>\n<li>Заполни форму строго по шаблону и отправь Дарии Колесниковой: <a href=\"mailto:dkolesnikova@dc2b.ru\">dkolesnikova@dc2b.ru<\/a>. Без описания вложенных документов заказ не обрабатывается.<\/li>\n<li>Заказы обрабатываются по понедельникам и четвергам. В ответ придёт письмо с трек-номером и ссылкой на накладную.<\/li>\n<li>Статус заказа — на сайте <a class=\"go\" href=\"https://www.cse.ru/\" target=\"_blank\" rel=\"noopener noreferrer\">КСЕ ↗<\/a>.<\/li>\n<li>Если курьер не приехал — сообщи Дарии Колесниковой.<\/li>\n<\/ol>\n<div class=\"note\"><p>МРБ сам собирает документы у всех партнёров в городе проживания и отправляет их одной посылкой. Перед отправкой проверь документы на ошибки.<\/p><\/div>\n<h3>Форма заказа курьера<\/h3>\n<button type=\"button\" data-copy-id=\"courier-template\">Скопировать<\/button>\n<pre class=\"mail-template\" id=\"courier-template\" tabindex=\"0\">Дата приезда курьера: [ ]\nФИО контактного лица: [ ]\nКонтактный телефон: [ ]\nАдрес: [ ]\nСодержимое документов: [ ]\nКол-во КД в посылке: [ ]<\/pre>\n<p class=\"links\"><a class=\"go\" href=\"#/article/credit-dossiers\">Отправка кредитных досье →<\/a><\/p>", "dzb": "<p class=\"lead\">Ошибки, по которым ДЗБ запрашивает обратную связь, и инструктаж агента.<\/p>\n<h2>Замечания ДЗБ<\/h2>\n<ol>\n<li>В программе ДК нет цветного скана паспорта (нет скана регистрации, стр. 2–3).<\/li>\n<li>Кредитная заявка оформлена по копии паспорта — скан вместо оригинала.<\/li>\n<li>Нарушен регламент фотографирования клиента в ДК: для офлайн-кредита фото не в офисе; клиент в головном уборе; фото обрезано.<\/li>\n<\/ol>\n<h2>Инструктаж агента<\/h2>\n<p>Проводит МРБ при обучении. Акт о прохождении инструктажа заполняется:<\/p>\n<ul><li>при обучении агентов;<\/li><li>при выставленном замечании от ДЗБ.<\/li><\/ul>\n<h3>Форма акта<\/h3>\n<p>Адресат — Департамент защиты бизнеса. Поля: от кого, дата, город, МРБ (ФИО), подпись. В акте перечислены инструктажи:<\/p>\n<ol>\n<li>Проверка паспорта РФ. Частые вопросы (2023, январь).<\/li>\n<li>Процедура проверки подлинности паспорта РФ (2023, январь).<\/li>\n<li>1.1 Методика по проверке заёмщиков (МРБ).<\/li>\n<li>Регламент работы с банком Порублю / МКК Порублю: установка приложения, консультация по оплате ЕП через приложение.<\/li>\n<\/ol>\n<h3>Проверка клиента на ФССП<\/h3>\n<p>Если у клиента есть ИЛ в части задолженности по банкам — отказать в выдаче.<\/p>\n<p><a class=\"go\" href=\"https://fssp.gov.ru/iss/ip/?is%5Bvariant%5D=2\" target=\"_blank\" rel=\"noopener noreferrer\">Банк данных исполнительных производств ФССП ↗<\/a><\/p>\n<div class=\"note\"><p>Расхождение: в «Регламенте ДЗБ» темы 1–3 помечены «ЖДЕМ ОБНОВЛЕНИЯ ОТ ДЗБ», а в форме акта приложены файлы версии 2023 года. Какая версия действует, в материалах не указано. Сами файлы инструктажей в базу не переданы.<\/p><\/div>", "work-services": "<p class=\"lead\">Каталог рабочих ресурсов: назначение каждого сервиса и быстрый переход.<\/p><section><h2>Рабочие сервисы<\/h2><ul class=\"kv\"><li><strong>Power BI<\/strong> — Аналитика. <a class=\"go\" href=\"https://pbi.po-rubly.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>Корпоративный портал<\/strong> — Новости, обучающие материалы, обращения в ТП, расчётный лист и другие ресурсы. <a class=\"go\" href=\"https://portal.direct-credit.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>Outlook<\/strong> — Корпоративная почта. <a class=\"go\" href=\"https://mail.mvideo.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>Saby / СБИС<\/strong> — Кадровые документы, планы и задачи, новости, чат. <a class=\"go\" href=\"https://my.saby.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>ЛК Директ Кредит<\/strong> — Контроль заявок онлайн. <a class=\"go\" href=\"https://lk.direct-credit.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>Личный кабинет МРБ<\/strong> — Самостоятельная регистрация ЮЛ и приглашение ЮЛ на регистрацию. <a class=\"go\" href=\"https://lk.dc2b.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><li><strong>Сброс пароля<\/strong> — Отдельный сервис сброса пароля. <a class=\"go\" href=\"https://dps.mvideo.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть сервис ↗<\/a><\/li><\/ul><\/section><section><h2>Маркетинговые материалы<\/h2><p>Презентации и POS-материалы в электронном виде.<\/p><p><strong>Визитки.<\/strong> Консолидированный заказ от РД два раза в месяц.<\/p><\/section><section><h2>Заказ визиток<\/h2><div class=\"note\"><h3>Два описания порядка заказа<\/h3><p>В каталоге инструментов: консолидированный заказ от РД два раза в месяц.<\/p><p>В отдельной инструкции «Визитки»: РРРБ раз в месяц собирает информацию о наличии визиток у МРБ.<\/p><p>Актуальный единый порядок не установлен. Не объединяй эти варианты в один график.<\/p><\/div><ul class=\"kv\"><li><strong>МРБ, работающие не менее месяца<\/strong> — В инструкции указан заказ на 50 шт.<\/li><li><strong>«Для остальных МРБ»<\/strong> — 100 шт. на три месяца; заказ только по запросу. Категория сохранена в формулировке документа.<\/li><\/ul><p>Данные необходимо направлять Горбуновой Анастасии на <a href=\"mailto:agorbunova@dc2b.ru\">agorbunova@dc2b.ru<\/a> с файлом во вложении.<\/p><p>Поля файла (по приложенной таблице): ФИО, должность, e-mail, телефон — информация для визитки; адрес для доставки визиток.<\/p><\/section><p class=\"links\"><a class=\"go\" href=\"#/article/access\">Как получить доступ →<\/a><\/p>", "access": "<p class=\"lead\">Выбери ресурс. Для каждого сохранены свой канал запроса и необходимые данные.<\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"access-panel-accounts\" aria-selected=\"true\" data-group=\"access\" data-tab=\"accounts\" id=\"access-tab-accounts\" role=\"tab\" tabindex=\"0\" type=\"button\">Кабинеты<\/button><button aria-controls=\"access-panel-mail\" aria-selected=\"false\" data-group=\"access\" data-tab=\"mail\" id=\"access-tab-mail\" role=\"tab\" tabindex=\"-1\" type=\"button\">Почта и СБИС<\/button><button aria-controls=\"access-panel-pbi\" aria-selected=\"false\" data-group=\"access\" data-tab=\"pbi\" id=\"access-tab-pbi\" role=\"tab\" tabindex=\"-1\" type=\"button\">Power BI<\/button><\/div><section aria-labelledby=\"access-tab-accounts\" id=\"access-panel-accounts\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Личный кабинет МРБ<\/h2><ol><li>Для доступа к расширенной УЗ в ЛК и кабинету МРБ отправь запрос в ТП на портале lk.dc2b.ru.<\/li><\/ol><a class=\"go\" href=\"https://lk.dc2b.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть портал ↗<\/a><p>В каталоге инструментов этот доступ описан как запрос РРРБ через обращение в ТП на портале.<\/p><\/section><section><h2>Учётная запись ЛК Директ Кредит<\/h2><p>Создание учётной записи запрашивается на <a href=\"mailto:it@dc2b.ru\">it@dc2b.ru<\/a>. В каталоге инструментов указан запрос РРРБ через почту.<\/p><button data-copy-id=\"access-lk-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"access-lk-template\" tabindex=\"0\">Кому: it@dc2b.ru\nТема: ДОСТУП ДЛЯ НОВЫХ МРБ\n\nПрошу для новых сотрудников предоставить доступ в УЗ ПО ДК.\nДанные сотрудника:\nФИО: [указать]\nПочта: [указать]\nТелефон: [указать]<\/pre><\/section><\/section><section aria-labelledby=\"access-tab-mail\" hidden=\"\" id=\"access-panel-mail\" role=\"tabpanel\" tabindex=\"0\"><section><h2>СБИС<\/h2><p>Доступ предоставляется при оформлении сотрудника — направлением сообщения.<\/p><a class=\"go\" href=\"https://my.saby.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть Saby / СБИС ↗<\/a><\/section><section><h2>Корпоративная почта<\/h2><ol><li>Доступ приходит руководителю на почту через 1–2 дня после оформления кадровых документов.<\/li><li>Если письма нет — обратись к HR.<\/li><\/ol><p>В каталоге инструментов получение доступа к Outlook также указано через РРРБ.<\/p><a class=\"go\" href=\"https://mail.mvideo.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть Outlook ↗<\/a><\/section><\/section><section aria-labelledby=\"access-tab-pbi\" hidden=\"\" id=\"access-panel-pbi\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Запрос через создание доступов<\/h2><ol><li>Открой техподдержку через QR-код из инструкции.<\/li><li>В меню выбери «Создание доступов», затем «Доступ к другим ресурсам».<\/li><li>Напиши запрос к отчёту «Внешний бизнес» для нового МРБ. Укажи ФИО, почту и телефон.<\/li><li>Доступы придут на почту сотрудника (МРБ).<\/li><\/ol><button data-copy-id=\"access-pbi-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"access-pbi-template\" tabindex=\"0\">Нужен доступ к отчёту «Внешний бизнес» для нового МРБ.\nФИО: [указать]\nПочта: [указать]\nТелефон: [указать]<\/pre><div class=\"note\"><p>Подтверждённого адреса входа в канал техподдержки пока нет. QR-код не заменён вымышленной ссылкой.<\/p><\/div><\/section><section><h2>Два описания получения доступа<\/h2><ul class=\"kv\"><li><strong>Каталог инструментов<\/strong> — Power BI: доступ от РРРБ в чат-бот MAX.<\/li><li><strong>Отдельная инструкция по доступам<\/strong> — Запрос через «Создание доступов» → «Доступ к другим ресурсам».<\/li><\/ul><div class=\"note\"><p>Какое описание является актуальным, не установлено. Канал запроса нужно подтвердить; эти варианты не объединены в обязательную последовательность.<\/p><\/div><\/section><section><h2>Названия отчётов различаются<\/h2><p>Запрос доступа описан для «Внешнего бизнеса». Материал по аналитике описывает «Все сети». Их соответствие не подтверждено.<\/p><a class=\"go\" href=\"#/article/power-bi\">Работа с Power BI →<\/a><\/section><\/section>", "power-bi": "<p class=\"lead\">Навигация по отчёту «Все сети»: фильтры, вкладки и смысл показателей.<\/p><p class=\"links\"><a class=\"go\" href=\"https://pbi.po-rubly.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть Power BI ↗<\/a><a class=\"go\" href=\"#/article/access\">Получение доступа →<\/a><\/p><div class=\"note\"><p>Это справка по работе с отчётом, не встроенная аналитика. Запрос доступа к «Внешнему бизнесу» не подтверждает доступ к «Все сети».<\/p><\/div><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"pbi-panel-filters\" aria-selected=\"true\" data-group=\"pbi\" data-tab=\"filters\" id=\"pbi-tab-filters\" role=\"tab\" tabindex=\"0\" type=\"button\">Фильтры<\/button><button aria-controls=\"pbi-panel-reports\" aria-selected=\"false\" data-group=\"pbi\" data-tab=\"reports\" id=\"pbi-tab-reports\" role=\"tab\" tabindex=\"-1\" type=\"button\">Вкладки и показатели<\/button><\/div><section aria-labelledby=\"pbi-tab-filters\" id=\"pbi-panel-filters\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Сначала выбери параметры<\/h2><p>Начинай работу с выбора основных параметров в фильтрах. Если фильтр поддерживает несколько значений, в инструкции для компьютера указан выбор через Ctrl.<\/p><\/section><section><h2>Вертикальные фильтры<\/h2><ul class=\"kv\"><li><strong>Период<\/strong> — Месяц, неделя, день или другой временной отрезок по датам.<\/li><li><strong>Номинальный счёт<\/strong> — Да / нет.<\/li><li><strong>Тип продукта<\/strong> — POS, BNPL, CASH, Прочие.<\/li><li><strong>Ответственный по уровням<\/strong> — РРБ, РРР, МРБ.<\/li><\/ul><\/section><section><h2>Горизонтальные фильтры<\/h2><ul class=\"kv\"><li><strong>Тип партнёра<\/strong> — Региональный / Федеральный.<\/li><li><strong>Канал продаж<\/strong> — Offline / Online.<\/li><li><strong>Топ партнёры и Бренд<\/strong> — Ключевые партнёры, выведенные в отдельные кабинеты.<\/li><li><strong>ЮЛ<\/strong> — Наименование партнёра.<\/li><li><strong>Сотрудник<\/strong> — Выбор агента.<\/li><li><strong>Банк<\/strong> — Выбор финансового решения.<\/li><li><strong>Тип сотрудника<\/strong> — Продавец (Агент), КЦ, КС (Кредитный специалист).<\/li><\/ul><\/section><\/section><section aria-labelledby=\"pbi-tab-reports\" hidden=\"\" id=\"pbi-panel-reports\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Где находятся вкладки<\/h2><p>Вкладки отчёта расположены внизу страницы.<\/p><\/section><section><h2>Основные показатели<\/h2><ul><li>Дневная динамика по каналам продаж и продажам продуктов страхования с разбивкой.<\/li><li>Сумма и количество продаж, средний чек, средний срок.<\/li><li>Проникновение SMS и страхования, продажи по акциям — рассрочка или кредит.<\/li><li>Детализация по кабинетам, банкам и сегментам.<\/li><\/ul><\/section><section><h2>Воронка<\/h2><ol><li>Заказ создан<\/li><li>Отправлено в банк<\/li><li>Банк одобрил<\/li><li>Клиент подтвердил<\/li><li>Подписано<\/li><li>Кредит выдан<\/li><\/ol><ul class=\"kv\"><li><strong>Error rate<\/strong> — Доля заявок с ошибками.<\/li><li><strong>Arb<\/strong> — Уровень одобрения.<\/li><li><strong>TCR<\/strong> — Подхват заявок: отношение выданных кредитов к одобренным заявкам.<\/li><\/ul><\/section><section><h2>PushSMS и Наши Страховки<\/h2><ul><li>Графики продаж дополнительных услуг с детализацией.<\/li><li>Уровень возвратов в разрезе ДУ.<\/li><li>Количество и объём продаж ДУ.<\/li><li>Продажи ДУ по кабинетам.<\/li><\/ul><\/section><section><h2>МРБ<\/h2><p>Продажи с прогнозом, одобрение и подхват, ТО и ТТ с активностью, уровень и объём продаж ДУ.<\/p><p>Раскрытие таблицы по уровням: РРБ → РРР → МРБ → Партнёр → Номер КД.<\/p><\/section><section><h2>Показатели в таблице<\/h2><p>Основные показатели, количество отправленных заявок и детализация до ТТ.<\/p><\/section><section><h2>Входы в приложение Порублю<\/h2><ul class=\"kv\"><li><strong>Входы в приложение Порублю<\/strong> — Уровень входов по выданным КД у банков-партнёров.<\/li><li><strong>Порублю входы<\/strong> — Уровень входов по выданным КД через МКК «ДК Пэй» и «ПОРУБЛЮ».<\/li><\/ul><\/section><\/section>", "saby-plans": "<p class=\"lead\">Отдельные правила для нового МРБ на испытательном сроке и действующих сотрудников.<\/p><p class=\"links\"><a class=\"go\" href=\"https://my.saby.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Открыть Saby / СБИС ↗<\/a><\/p><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"plans-panel-trial\" aria-selected=\"true\" data-group=\"plans\" data-tab=\"trial\" id=\"plans-tab-trial\" role=\"tab\" tabindex=\"0\" type=\"button\">Испытательный срок<\/button><button aria-controls=\"plans-panel-monthly\" aria-selected=\"false\" data-group=\"plans\" data-tab=\"monthly\" id=\"plans-tab-monthly\" role=\"tab\" tabindex=\"-1\" type=\"button\">Ежемесячный план<\/button><\/div><section aria-labelledby=\"plans-tab-trial\" id=\"plans-panel-trial\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Постановка плана<\/h2><p>Новому МРБ ставится план на испытательный срок в СБИС.<\/p><div class=\"note\"><h3>Срок постановки требует уточнения<\/h3><p>Формулировка: «не позднее чем на 2 дней после ТУ». Сокращение ТУ и точка отсчёта здесь не уточнены.<\/p><\/div><\/section><section><h2>Оценка и защита<\/h2><ol><li>План разбивается на 3 промежутка.<\/li><li>Оценка проходит по каждому промежутку.<\/li><li>Последняя защита — не позднее чем за 2 недели до окончания ИС.<\/li><\/ol><\/section><section><h2>KPI<\/h2><p>План должен учитывать KPI из оффера сотрудника, если такой оффер имеется.<\/p><\/section><\/section><section aria-labelledby=\"plans-tab-monthly\" hidden=\"\" id=\"plans-panel-monthly\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Ежемесячный план<\/h2><p>План текущим сотрудникам включает основные и фокусные цели.<\/p><p><strong>Постановка в СБИС.<\/strong> Ежемесячно, не позднее 2 дней после согласования.<\/p><\/section><\/section>", "contact-directory": "<p class=\"lead\">Выбери вопрос — адрес и назначение отдела показаны рядом.<\/p><section><h2>Сервисные запросы<\/h2><p><a href=\"mailto:servicedesk@dc2b.ru\">servicedesk@dc2b.ru<\/a><\/p><ul><li>Аннулирование кредитного договора.<\/li><li>Возврат дополнительных услуг.<\/li><li>Статус договора в банке — если нужно узнать, активен ли КД.<\/li><\/ul><\/section><section><h2>ДЗБ<\/h2><p><a href=\"mailto:dsb_partners@dc2b.ru\">dsb_partners@dc2b.ru<\/a><\/p><ul><li>Вопросы по причинам доработки Агента / ЮЛ.<\/li><\/ul><\/section><section><h2>Бухгалтерия для сотрудников<\/h2><p><a href=\"mailto:salary@dc2b.ru\">salary@dc2b.ru<\/a><\/p><ul><li>Вопросы бухгалтерии для сотрудников.<\/li><\/ul><\/section><section><h2>Оплата КВ партнёрам<\/h2><p><a href=\"mailto:oplata@dc2b.ru\">oplata@dc2b.ru<\/a><\/p><ul><li>Информация по оплате КВ партнёрам.<\/li><\/ul><\/section><section><h2>Сверка КВ партнёрам<\/h2><p><a href=\"mailto:sverka@dc2b.ru\">sverka@dc2b.ru<\/a><\/p><ul><li>Расчёт некорректен или не предоставлен.<\/li><\/ul><\/section><section><h2>Отдел кадров<\/h2><p><a href=\"mailto:kdp@dc2b.ru\">kdp@dc2b.ru<\/a><\/p><ul><li>Кадровые вопросы.<\/li><\/ul><\/section><section><h2>Юридические вопросы: адрес нужно подтвердить<\/h2><p>Составление дополнительных соглашений или договоров с партнёром и согласование правок от партнёра — через РРРБ / РРБ.<\/p><div class=\"note\"><p>Во «Вспомогательных отделах» указан <code>parvo@dc2b.ru<\/code>. В «Структуре бизнеса» — <code>pravo@dc2b.ru<\/code>.<\/p><p>Подтверждённый вариант не установлен. Не отправляй документы на выбранный по догадке адрес.<\/p><\/div><\/section><section><h2>Адреса без описания назначения<\/h2><p>Есть только в памятке «Структура бизнеса»: <a href=\"mailto:dogovor@dc2b.ru\">dogovor@dc2b.ru<\/a>, <a href=\"mailto:fot@dc2b.ru\">fot@dc2b.ru<\/a>, <a href=\"mailto:buh_doc@dc2b.ru\">buh_doc@dc2b.ru<\/a>. Для чего они, в материалах не указано.<\/p><\/section><section><h2>Специализированные обращения<\/h2><p class=\"links\"><a class=\"go\" href=\"#/article/accreditation\">Аккредитация и настройки УБЛ →<\/a><a class=\"go\" href=\"#/article/operations\">Операционное сопровождение →<\/a><a class=\"go\" href=\"#/article/mailing\">Общая рассылка →<\/a><\/p><\/section>", "accreditation": "<p class=\"lead\">Отдел аккредитации и настроек доступов агентов: <a href=\"mailto:localsetup@direct-credit.ru\">localsetup@direct-credit.ru<\/a>.<\/p><section><h2>Когда обращаться<\/h2><ul><li>Подключение ТТ к агенту.<\/li><li>У партнёра или агента отсутствует аккредитация по банку-партнёру.<\/li><li>Партнёр переведён в другой кабинет, и агенту нужно изменить кабинет.<\/li><\/ul><\/section><section><h2>Общий формат письма<\/h2><ul class=\"kv\"><li><strong>Тема<\/strong> — Наименование партнёра | ИНН<\/li><li><strong>Тело<\/strong> — Описание проблемы и необходимых действий.<\/li><\/ul><\/section><div aria-label=\"Выбор сценария\" class=\"condition-tabs\" role=\"tablist\"><button aria-controls=\"accreditation-panel-tt\" aria-selected=\"true\" data-group=\"accreditation\" data-tab=\"tt\" id=\"accreditation-tab-tt\" role=\"tab\" tabindex=\"0\" type=\"button\">Подключить ТТ<\/button><button aria-controls=\"accreditation-panel-cabinet\" aria-selected=\"false\" data-group=\"accreditation\" data-tab=\"cabinet\" id=\"accreditation-tab-cabinet\" role=\"tab\" tabindex=\"-1\" type=\"button\">Сменить кабинет<\/button><button aria-controls=\"accreditation-panel-bank\" aria-selected=\"false\" data-group=\"accreditation\" data-tab=\"bank\" id=\"accreditation-tab-bank\" role=\"tab\" tabindex=\"-1\" type=\"button\">Аккредитация<\/button><\/div><section aria-labelledby=\"accreditation-tab-tt\" id=\"accreditation-panel-tt\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Подключение ТТ к агенту<\/h2><button data-copy-id=\"acc-tt\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"acc-tt\" tabindex=\"0\">Кому: localsetup@direct-credit.ru\nТема: [Наименование партнёра] | [ИНН]\n\nДобрый день, коллеги.\nПрошу подключить агенту [ФИО агента] ТТ [ID ТТ].<\/pre><\/section><\/section><section aria-labelledby=\"accreditation-tab-cabinet\" hidden=\"\" id=\"accreditation-panel-cabinet\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Подключение кабинета агенту<\/h2><p>В примере указан кабинет «Ритейл_ИК». В заготовке укажи необходимый кабинет.<\/p><button data-copy-id=\"acc-cabinet\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"acc-cabinet\" tabindex=\"0\">Кому: localsetup@direct-credit.ru\nТема: [Наименование партнёра] | [ИНН]\n\nДобрый день, коллеги!\nПрошу подключить кабинет [название кабинета] к агенту [ФИО агента].<\/pre><\/section><\/section><section aria-labelledby=\"accreditation-tab-bank\" hidden=\"\" id=\"accreditation-panel-bank\" role=\"tabpanel\" tabindex=\"0\"><section><h2>Статус аккредитации УБЛ или ТТ<\/h2><button data-copy-id=\"acc-bank\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"acc-bank\" tabindex=\"0\">Кому: localsetup@direct-credit.ru\nТема: [Наименование партнёра] | [ИНН]\n\nДобрый день, коллеги!\nПрошу уточнить в банке статус аккредитации [наименование банка] и предоставить сроки аккредитации.<\/pre><\/section><\/section>", "operations": "<p class=\"lead\">Отдел операционного сопровождения: <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru<\/a>.<\/p><section><h2>Обработка запросов<\/h2><p><strong>2 рабочих дня.<\/strong> Срок обработки запросов, указанный для отдела.<\/p><\/section><section><h2>Сроки оплаты КД<\/h2><p>Уточняющий запрос направляется только после самостоятельной проверки оплаты в отчёте 1С и если договорные сроки оплаты истекли.<\/p><\/section><section><h2>Настройки и изменения<\/h2><ul class=\"kv\"><li><strong>Настройки партнёра<\/strong> — По отправленной ФМ, предварительно согласованной с РРРБ / РРБ.<\/li><li><strong>Перевод в кабинет на оферте<\/strong> — Предварительно получить согласование РРРБ.<\/li><li><strong>Дополнительные продукты в ТО<\/strong> — Для настройки предоставить ФМ.<\/li><li><strong>Перезакрепление ТО и ТТ<\/strong> — До перезакрепления получить согласование РРРБ / РРБ.<\/li><\/ul><\/section><section><h2>Жалобы банков-партнёров<\/h2><p>МРБ обязан предоставить обратную связь не позднее следующего рабочего дня после поступления жалобы.<\/p><p>Обратная связь должна быть развёрнутой, с приложениями, опровергающими вопросы банков-партнёров.<\/p><div class=\"note\"><p>В отдельном материале по жалобам срок сформулирован иначе. Не распространяй общий срок обработки запросов «2 рабочих дня» на ответ МРБ по жалобе.<\/p><\/div><a class=\"go\" href=\"#/article/bank-complaints\">Состав ответа и расхождение сроков →<\/a><\/section>", "bank-complaints": "<p class=\"lead\">Сроки ответа, полный состав обратной связи и служебная записка МРБ.<\/p><section><h2>Сроки: две формулировки<\/h2><ul class=\"kv\"><li><strong>Операционное сопровождение<\/strong> — Не позднее следующего рабочего дня после поступления жалобы.<\/li><li><strong>Работа с жалобами от Банка<\/strong> — Ответ — в этот же день. Полная ОС — не позднее 18:00 следующего дня.<\/li><\/ul><div class=\"note\"><p>Вторая формулировка не уточняет, рабочий ли следующий день. Единый применимый срок не установлен — расхождение требует подтверждения.<\/p><\/div><\/section><section><h2>Что должно быть в письме<\/h2><ul><li>Ответы на все поставленные вопросы.<\/li><li>Сканы из Архива.<\/li><li>Информация о передаче оригиналов в банк.<\/li><li>Подписанный агентом скан о прохождении инструктажа.<\/li><li>Связался ли МРБ с клиентом для получения ОС и урегулирования претензии.<\/li><li>Связался ли МРБ с партнёром и агентом, каким способом, какой датой и какая ОС получена.<\/li><\/ul><\/section><section><h2>Служебная записка МРБ<\/h2><ul><li>Как осуществлялся поиск партнёра.<\/li><li>Как МРБ проводил предварительную проверку партнёра.<\/li><li>Как проводилось обучение агентов.<\/li><li>Как проводится сопровождение, с какой периодичностью и с кем ведётся коммуникация.<\/li><li>Контактные номера партнёра и агента.<\/li><\/ul><\/section><section><h2>Заготовка полного ответа<\/h2><p>Заполни поля и приложи перечисленные документы. Получатель и тема не подставлены — в инструкции они не заданы.<\/p><button data-copy-id=\"complaint-template\" type=\"button\">Скопировать шаблон<\/button><pre class=\"mail-template\" id=\"complaint-template\" tabindex=\"0\">Ответы на все вопросы жалобы:\n[вопрос → ответ]\n\nПриложения и документы:\n— Сканы из Архива: [указать]\n— Информация о передаче оригиналов в банк: [указать]\n— Подписанный агентом скан о прохождении инструктажа: [указать]\n\nКоммуникации:\n— Связался ли МРБ с клиентом для получения ОС и урегулирования претензии: [указать]\n— Связался ли МРБ с партнёром и агентом; способ, дата и полученная ОС: [указать]\n\nСлужебная записка МРБ:\n— Как осуществлялся поиск партнёра: [указать]\n— Как проводилась предварительная проверка партнёра: [указать]\n— Как проводилось обучение агентов: [указать]\n— Как проводится сопровождение, его периодичность и с кем ведётся коммуникация: [указать]\n— Контактные номера партнёра и агента: [указать]<\/pre><\/section><section><h2>Последствия неполной или несвоевременной ОС<\/h2><div class=\"note\"><p>В документе указаны «ПК 5%» и непроведение выплаты премии до урегулирования претензии / удовлетворительного ответа на жалобу.<\/p><p>Актуальность этих условий не подтверждена. Сокращение ПК не расшифровано; это не подтверждение текущей кадровой политики.<\/p><\/div><\/section>", "mailing": "<p class=\"lead\">Документы и уведомления на <a href=\"mailto:npnominal@dc2b.ru\">npnominal@dc2b.ru<\/a>.<\/p><div class=\"note\"><h2>Только отправляем письма — не задаём вопросы<\/h2><p>Этот адрес используется для перечисленных отправок, а не как универсальная линия поддержки.<\/p><\/div><section><h2>Увольнение агента<\/h2><p>Информация об увольнении агента — расторжение Оферты.<\/p><\/section><section><h2>Отправка ИУ договоров<\/h2><p>ИУ договоры Агента и ЮЛ с историей согласования с ДЦРБ.<\/p><\/section><section><h2>Переход с ИУ на оферту<\/h2><ol><li>Отправить расторжение ИУ договора.<\/li><li>Приложить подписанную оферту.<\/li><li>Приложить историю согласования ДЦРБ.<\/li><\/ol><p>Описано для Агента и ЮЛ.<\/p><\/section><section><h2>Смена реквизитов<\/h2><p>Смена реквизитов партнёра / агента.<\/p><\/section>", "banks-directory": "<p class=\"lead\">12 организаций из исходного справочника: 9 банков и 3 МФО. Раскрой карточку, чтобы посмотреть требования и контакты.<\/p><div class=\"note\"><h2>Условия требуют проверки<\/h2><p>Названия, требования и контакты сохранены по PDF. Их актуальность не подтверждена. Перед консультацией клиента проверь действующие условия.<\/p><p>Пустые поля не означают отсутствие ограничений. Этот справочник не подбирает кредитора и не гарантирует одобрение.<\/p><p>Перечни по внешним ссылкам здесь не пересказываются: содержимое этих документов не изучено, доступность переходов не проверена.<\/p><\/div><div class=\"bank-list\"><details class=\"bank-card\" id=\"bank-migcredit\"><summary><span class=\"bank-name\">ООО МФК «МИГКРЕДИТ»<\/span><span class=\"bank-kind\">МФО — МФК<\/span><\/summary><div class=\"bank-body\"><p><b>Возраст:<\/b> От 19 лет; верхнего порога нет.<\/p><p><b>Гражданство:<\/b> РФ.<\/p><p class=\"lbl\"><b>Категории клиентов: кредитует:<\/b><\/p><ul><li>При наличии постоянного источника дохода: трудоустроенные, пенсионеры, люди с ограниченными возможностями 1/2/3 групп, ИП, студенты, безработные, самозанятые.<\/li><\/ul><p class=\"lbl\"><b>Категории клиентов: не кредитует:<\/b><\/p><ul><li>Военные.<\/li><\/ul><p class=\"lbl\"><b>Некредитуемые регионы:<\/b><\/p><ul><li>Чукотский автономный округ<\/li><li>Республика Крым<\/li><li>г. Севастополь<\/li><li>г. Байконур<\/li><li>Республика Адыгея<\/li><li>Республика Дагестан<\/li><li>Республика Ингушетия<\/li><li>Кабардино-Балкарская республика<\/li><li>Карачаево-Черкесская республика<\/li><li>Северная Осетия<\/li><li>Чеченская республика<\/li><li>Камчатский край<\/li><\/ul><p class=\"lbl\"><b>Ограничения по сегментам:<\/b><\/p><ul><li>Ювелирные изделия<\/li><li>Оружие<\/li><li>Наркотики<\/li><li>Финансовое мошенничество<\/li><\/ul><p><b>Временная регистрация:<\/b> Нет.<\/p><p class=\"lbl\"><b>Центр клиентской поддержки:<\/b><\/p><ul><li><a href=\"tel:+78001000609\">8 (800) 100-06-09<\/a><\/li><li><a href=\"tel:+78007000908\">8 (800) 700-09-08<\/a><\/li><li><a href=\"tel:+74957857263\">8 (495) 785-72-63<\/a><\/li><\/ul><p><a href=\"https://www.migcredit.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Сайт организации ↗<\/a><\/p><\/div><\/details><details class=\"bank-card\" id=\"bank-dk-pay\"><summary><span class=\"bank-name\">ООО МКК «ДК Пэй»<\/span><span class=\"bank-kind\">МФО — МКК<\/span><\/summary><div class=\"bank-body\"><p><b>Возраст:<\/b> От 23 до 75 лет.<\/p><p><b>Гражданство:<\/b> РФ.<\/p><p><b>Категории клиентов: кредитует:<\/b> В предоставленных материалах не указано.<\/p><p><b>Категории клиентов: не кредитует:<\/b> В предоставленных материалах не указано.<\/p><p><b>Некредитуемые регионы:<\/b> В предоставленных материалах не указано.<\/p><p><b>Огранич
