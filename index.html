<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>База знаний — Direct Tech</title><style>:root{--bg:#fff;--soft:#f5f7f8;--ink:#172126;--muted:#5d6b71;--line:#e3e8eb;--accent:#ff3c00;--link:#174e65;--sel:#e8f4f9;--hh:56px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 16px);scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link);text-underline-offset:3px;text-decoration-thickness:1px}
a:hover{color:#0e3546}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}
[hidden]{display:none!important}
.skip{position:fixed;top:-60px;left:8px;z-index:50;background:#fff;padding:8px 12px;border:1px solid var(--line);border-radius:6px}.skip:focus{top:8px}
/* header */
header{position:sticky;top:0;z-index:20;height:var(--hh);display:flex;align-items:center;gap:16px;padding:0 20px;background:#fff;border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:17px;letter-spacing:-.4px;color:var(--ink);text-decoration:none;white-space:nowrap}
.brand b{color:var(--accent)}
#searchForm{flex:1;max-width:520px;margin-left:auto;position:relative}
#searchForm:before{content:"";position:absolute;left:11px;top:50%;width:12px;height:12px;margin-top:-8px;border:2px solid #8a979d;border-radius:50%}
#searchForm:after{content:"";position:absolute;left:23px;top:50%;width:6px;height:2px;margin-top:3px;background:#8a979d;transform:rotate(45deg)}
#searchInput{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--soft);padding:0 12px 0 34px;font-size:15px}
#searchInput:focus{background:#fff;border-color:#9fbfcc;outline:none;box-shadow:0 0 0 3px #e3f1f7}
#menu{display:none;width:36px;height:36px;border:0;background:none;border-radius:8px;font-size:20px;cursor:pointer;flex:none}
#menu:hover{background:var(--soft)}
/* layout */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);max-width:1280px;margin:0 auto}
aside{position:sticky;top:var(--hh);height:calc(100dvh - var(--hh));overflow:auto;padding:16px 10px 32px 16px;border-right:1px solid var(--line);font-size:14px;scrollbar-width:thin;background:#fff}
aside a{display:block;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;line-height:1.35}
aside a:hover{background:var(--soft)}
aside a[aria-current=page]{background:var(--sel);color:var(--link);font-weight:600}
aside .top{margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--line)}
aside details{margin:2px 0}
aside summary{list-style:none;cursor:pointer;padding:6px 8px;border-radius:6px;font-weight:600;color:var(--ink);display:flex;gap:6px;align-items:baseline}
aside summary::-webkit-details-marker{display:none}
aside summary:before{content:"›";display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
aside details[open]>summary:before{transform:rotate(90deg)}
aside summary:hover{background:var(--soft)}
aside details[data-dt-current=true]>summary{color:var(--link)}
aside details nav{padding-left:16px}
aside details nav a{color:#34434a}
main{padding:24px clamp(16px,4vw,48px) 48px;min-width:0}
.doc,.page{max-width:760px}
/* type */
h1{font-size:26px;line-height:1.25;letter-spacing:-.4px;margin:4px 0 8px}
h2{font-size:18px;line-height:1.35;margin:28px 0 8px}
h3{font-size:16px;line-height:1.4;margin:20px 0 6px}
h4{font-size:15px;margin:14px 0 4px}
p{margin:6px 0}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:3px 0}
li>p{margin:2px 0}
code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);padding:1px 4px;border-radius:4px;overflow-wrap:anywhere}
.lead{color:var(--muted);margin:0 0 4px}
.hint,.caption{color:var(--muted);font-size:14px}
.doc a{overflow-wrap:anywhere}
.crumb{font-size:13px;color:var(--muted);margin-bottom:6px}
.crumb a{color:var(--muted)}
.titlebar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.fav{flex:none;border:0;background:none;cursor:pointer;font-size:14px;color:var(--muted);padding:6px 8px;border-radius:6px;margin-top:4px;white-space:nowrap}
.fav:hover{background:var(--soft);color:var(--ink)}
.fav[aria-pressed=true]{color:var(--accent)}
.doc>section>h2:first-child,.doc>[role=tabpanel]>section:first-child>h2:first-child,.doc>[role=tabpanel]>section:first-child>h3:first-child{margin-top:20px}
/* content blocks: no containers */
.kv{list-style:none;padding:0}
.kv li{padding:3px 0}
.kv strong{font-weight:650}
.steps{padding-left:22px}
.steps>li{margin:10px 0}
.steps>li>h3{margin:0 0 2px;font-size:15px}
.steps>li::marker{font-weight:650;color:var(--accent)}
ol>li::marker{color:var(--muted)}
.sub{margin:10px 0}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0;font-size:14px;color:#3b4a51}
.note h2,.note h3{font-size:14px;margin:0 0 4px}
.note p,.note li{font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:4px 18px;margin:10px 0}
a.go{font-weight:500}
.mail-template{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:10px 12px;margin:6px 0 10px;max-height:340px;overflow:auto}
button[data-copy-id]{border:0;background:none;padding:2px 0;color:var(--link);cursor:pointer;font-size:14px;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.mails{columns:2;column-gap:24px;padding-left:20px}
.defs dt{font-weight:650;margin-top:12px}.defs dd{margin:2px 0 0}
.fn{display:grid;grid-template-columns:max-content 1fr;gap:6px 10px;font-size:14px}.fn dt{color:var(--accent);font-weight:650}.fn dd{margin:0}
.tbl{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;font-size:14px;min-width:100%}
th,td{text-align:left;padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:650;color:var(--muted);font-size:13px}
sup{color:var(--accent)}
/* tabs */
.condition-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:14px 0 4px;overflow-x:auto}
.condition-tabs button{border:0;background:none;padding:8px 0;margin-bottom:-1px;border-bottom:2px solid transparent;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap;font-size:15px}
.condition-tabs button:hover{color:var(--ink)}
.condition-tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
[role=tabpanel]{outline-offset:6px}
/* registration sms */
.reg-sms h4{margin:10px 0 2px;font-size:14px}.reg-sms blockquote{margin:0 0 6px;padding-left:12px;border-left:2px solid var(--line);color:#3b4a51;font-size:14px}
/* banks */
.bank-list{margin-top:12px;border-top:1px solid var(--line)}
.bank-card{border-bottom:1px solid var(--line)}
.bank-card>summary{cursor:pointer;padding:10px 0;list-style:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.bank-card>summary::-webkit-details-marker{display:none}
.bank-card>summary:before{content:"›";color:var(--muted);transition:transform .15s;display:inline-block;width:10px}
.bank-card[open]>summary:before{transform:rotate(90deg)}
.bank-name{font-weight:600}
.bank-kind{font-size:13px;color:var(--muted)}
.bank-body{padding:0 0 12px 20px;font-size:14px}
.bank-body p,.bank-body li{font-size:14px}
.bank-body .lbl{margin-top:8px}
.bank-body ul{columns:2;column-gap:24px}
.bank-body ul li{break-inside:avoid}
/* home & lists */
.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px;max-width:1000px}
.topic-tile{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none}
.topic-tile:hover{border-color:#9fbfcc;background:#fafcfd}
.topic-tile h2{font-size:16px;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.topic-tile h2 span{color:var(--accent);font-weight:700;width:14px;flex:none;text-align:center}
.topic-tile p{margin:0;color:var(--muted);font-size:14px}
.topic-tile small{display:block;margin-top:8px;color:var(--muted);font-size:13px}
.list{list-style:none;padding:0;margin:14px 0;border-top:1px solid var(--line)}
.list li{display:flex;align-items:flex-start;gap:8px;border-bottom:1px solid var(--line);margin:0}
.list a{flex:1;padding:10px 0;text-decoration:none;color:var(--ink);min-width:0}
.list a b{display:block;font-weight:600;color:var(--link)}
.list a:hover b{text-decoration:underline}
.list a span{display:block;color:var(--muted);font-size:14px}
.list .fav{margin-top:6px}
.result-count{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:16px;margin-top:36px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}
.pager a{text-decoration:none;max-width:48%}.pager a:hover{text-decoration:underline}
.pager .next{text-align:right;margin-left:auto}
.pager small{display:block;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 24px)}
#dt-menu-backdrop{display:none}
@media(max-width:1000px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{grid-template-columns:230px minmax(0,1fr)}}
@media(max-width:760px){
 :root{--hh:96px}
 header{height:auto;min-height:0;flex-wrap:wrap;gap:6px 8px;padding:8px 12px}
 #menu{display:inline-flex;align-items:center;justify-content:center}
 .brand{flex:1}
 #searchForm{flex:1 0 100%;max-width:none;margin:0}
 .shell{display:block}
 aside{display:none;position:fixed;top:var(--hh);left:0;bottom:0;height:auto;width:min(320px,calc(100% - 40px));z-index:15;box-shadow:8px 0 24px #17212626}
 body.menu aside{display:block}
 body.menu{overflow:hidden}
 #dt-menu-backdrop{position:fixed;inset:var(--hh) 0 0;background:rgb(23 33 38/35%);z-index:14}
 body.menu #dt-menu-backdrop{display:block}
 main{padding:16px 16px 40px}
 h1{font-size:22px}
 h2{font-size:17px;margin-top:24px}
 .topic-grid{grid-template-columns:1fr;gap:8px}
 .topic-tile{padding:12px 14px}
 .mails,.bank-body ul{columns:1}
 .bank-body{padding-left:12px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header,aside,.pager,.fav,.toast,.skip,.condition-tabs,button[data-copy-id]{display:none!important}.shell{display:block}[role=tabpanel][hidden]{display:block!important}}
main:focus,main:focus-visible,[tabindex="-1"]:focus{outline:none}
.fn dt{letter-spacing:-2px;white-space:nowrap}
@media(max-width:600px){.fn{grid-template-columns:1fr;gap:0}.fn dt{margin-top:8px}}

огин. Где взять идентификаторы ID и логин возьми из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ». Шаблон запроса Заполни реквизиты и опиши нужное действие. Скопировать шаблон ИП [ФИО] ID [ID из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ»] Агент [ФИО] логин [логин из отчёта «Настройки магазинов» в Power BI, вкладка «ТТ»] Запрос: [описать требуемое действие]", "source": "Правила отправки запросов по ТТ И Агентам.pdf, стр. 1", "limit": "Адресат для общих запросов и состав бумажного комплекта в предоставленном материале не указаны.", "section": "partner"}, {"id": "financial-model", "title": "Согласование ИУ и финансовой модели", "summary": "Вводные для расчёта, согласование документов и действия по ЮЛ и агенту.", "text": "Подготовь данные для расчёта и выбери дальнейший сценарий: юридическое лицо или агент. 1. Собери вводные для расчёта Условия конкурентов — Предложения конкурентов. Средний чек — Значение для расчёта. Планируемый оборот — Ожидаемый оборот. Условия — КВ агенту / КВ ЮЛ / ставки. Страхование — Уровень проникновения и стоимость. СМС — Уровень проникновения и стоимость. Скопировать список вводных Вводные данные для расчёта финансовой модели: 1. Условия конкурентов: [указать] 2. Средний чек: [указать] 3. Планируемый оборот: [указать] 4. Условия — КВ агенту / КВ ЮЛ / ставки: [указать] 5. Уровень проникновения страхования и стоимость страхования: [указать] 6. Уровень проникновения СМС и стоимость СМС: [указать] 2. Передай документы на согласование Если нужно согласовать договор, дополнительное соглашение или уведомление на изменение — направь документ руководителю. 3. Выбери сценарий ЮЛ Агент После согласования результата с партнёром Отправь письмо с реквизитами партнёра на partner_support@dc2b.ru . Укажи кредитный продукт — рассрочка / кредит, сроки кредита / рассрочки, скидки по продуктам и КВ/АВ. Скопировать шаблон Кому: partner_support@dc2b.ru Реквизиты партнёра: [указать] Кредитный продукт: [рассрочка / кредит] Сроки кредита / рассрочки: [указать] Скидки по продуктам: [указать] КВ/АВ: [указать] Состав письма по коммерции → Договор и подписание После согласования ответным письмом направляют договор с номером для подписи партнёром. При необходимости направляют уведомление для ознакомления партнёра. Подпиши договор в течение 3 дней и отправь скан обратным письмом. В этот же день закажи курьера через Bitrix — задачей. Отправь оригиналы в течение 3 дней. Сроки отправки документов Не смешивай два описания порядка отправки В сценарии финансовой модели: подписание в течение 3 дней → скан обратным письмом → заказ курьера через Bitrix в этот же день → оригиналы в течение 3 дней. В общей инструкции «Работа с партнёром»: скан в тот же день, оригинал в течение 3 дней; для удалённых партнёров заказывается курьер. Единая точка отсчёта и тип дней не установлены. Применимый порядок нужно уточнить, а не складывать эти сроки в один график. Подпиши договор и отправь комплект После согласования полученного результата с Агентом подпиши с ним договор и в тот же день отправь письмо. Формулировка срока Рядом с согласованием результата с Агентом указано «не более 3 дней». Точная точка отсчёта не уточнена — её нужно подтвердить. Кому — npnominal@dc2b.ru Копия — partner_support@dc2b.ru Тема и вложения Тема письма. ИУ ДОГОВОР АГЕНТ ГПХ ФИО ИУ договор Агента ГПХ. Паспорт: страницы 2–3 и прописка. ИНН. СНИЛС. Просьба в письме Принять в работу и перевести Агента в статус «Агент Без Оплаты ДКЦ». Скопировать шаблон Кому: npnominal@dc2b.ru Копия: partner_support@dc2b.ru Тема: ИУ ДОГОВОР АГЕНТ ГПХ [ФИО] Во вложении ИУ договор Агента ГПХ, паспорт 2–3 страница и прописка, ИНН и СНИЛС. Прошу принять в работу. Прошу перевести Агента в Статус \"Агент Без Оплаты ДКЦ\"", "source": "Процесс согласования ИУ с партнерами и агентами.pdf, стр. 1; Согласование финансовой модели для ЮЛ и Агента.pdf, стр. 1; Работа с партнером.pdf, стр. 2", "section": "partner", "limit": ""}, {"id": "partner-attraction", "title": "Правила привлечения и перезакрепления партнёров", "summary": "Территории поиска, пересечение переговоров и передача партнёра другому МРБ.", "text": "Где искать партнёров, как действовать при пересечении переговоров и когда партнёра передают другому МРБ. Привлечение Перезакрепление Поиск партнёров — без территориальных ограничений Менеджер может приводить партнёра с любой территории без согласования. Если партнёр уже ведёт переговоры с другим МРБ Предварительно договоритесь между собой, чтобы избежать разногласий в индивидуальных предложениях. Партнёр другого региона — Между собой договариваются РРБ. Партнёр одного региона — Между собой договариваются МРБ. Не путай поиск и пересечение переговоров Свободный поиск на любой территории не отменяет предварительной договорённости, если партнёр уже в переговорах с МРБ другого региона / территории. Нет продаж более 3 месяцев Партнёра передают другому МРБ. Есть продажи, но ниже потенциала Партнёр не является первым приоритетом. Ситуация подтверждена письмом партнёра по e-mail с долей продаж. Партнёра передают другому МРБ, если у него есть инструмент / связи для активации партнёра. По истечении 2 месяцев проводят срез результатов. Если прироста нет — партнёра возвращают обратно.", "source": "Правила в территории привлечения партнеров.pdf, стр. 1", "section": "partner", "limit": ""}, {"id": "online-stores", "title": "Работа с онлайн-магазинами", "summary": "Интеграция, QR-код / ссылка, КЦ и инструкции по онлайн-заказам.", "text": "Способы работы с онлайн-магазинами, технические материалы и инструкции по онлайн-заказам. Способы работы Интеграция на сайте партнёра — Интеграция выполняется самостоятельно партнёром. Материал по интеграции ↗ QR-код / ссылка — Работа без интеграции. Через КЦ — Ещё один способ работы с онлайн-магазинами. Технические материалы SOAP — Открыть материал SOAP ↗ API — Открыть материал API ↗ Инструкции и онлайн-заказы Работа в онлайн — Открыть инструкцию ↗ Онлайн-заказы: видеоурок — Открыть видео ↗ Онлайн-заказы: Партнёр — Открыть PDF ↗ Онлайн-заказы: УБЛ — Открыть PDF ↗ Ограничения онлайн-сценария СМС-подписание — только для повторных клиентов. КЕБ в онлайн отсутствует.", "source": "Работа с онлайн магазинами (ссылки).pdf, стр. 1", "section": "partner", "limit": "Внешние ссылки собраны по переносам PDF; доступность файлов не проверена."}, {"id": "payout-company", "title": "Порядок выплат ЮЛ", "summary": "Расчёт, сверка РРБ, подписание документов и направление на оплату.", "text": "От расчёта и сверки до подписанных документов на оплату в СБИС. Порядок действий Расчётный отдел отправляет отчёт с расчётом в начале месяца в СБИС. РРБ сверяет итог. При согласовании информирует расчётный отдел и отправляет отчёт на подпись партнёру. Партнёр подписывает акт и счёт. РРБ направляет подписанные акт, счёт и отчёт на оплату в СБИС. Если КВ связано с СЖ или СМС После получения информации о возвратах предварительный отчёт корректируется. С 24-го по 27-е число ежемесячно. Направляется отчёт с новыми данными. Это период направления скорректированного отчёта, а не установленная дата выплаты.", "source": "Порядок выплат ЮЛ.pdf, стр. 1", "section": "payments", "limit": "Точная дата фактической оплаты не установлена."}, {"id": "payout-agent", "title": "Порядок выплат агенту", "summary": "Отдельные сценарии для агентов на оферте и на ИУ.", "text": "Выбери основание сотрудничества: порядок расчёта и документы отличаются. На оферте На ИУ Централизованный расчёт Премия рассчитывается централизованно и направляется на оплату вместе с премией МРБ. Сверка и апелляция После 15-го числа каждого месяца — Премия рассчитывается и предварительно направляется для сверки. 1 день для РРБ — На сверку и апелляцию. После 15-го числа — срок подготовки и направления на сверку, не конкретная дата выплаты. Расчёт и документы МРБ рассчитывает премию на основании НС и файла по отказам от дополнительных услуг. В СБИС на оплату направляются акт и расчёт. После оплаты В течение 3 дней. Оригиналы актов необходимо отправить в офис.", "source": "Порядок выплат агенту.pdf, стр. 1", "section": "payments", "limit": "Тип дней, адрес офиса и точная дата выплаты не указаны."}, {"id": "nominal-account", "title": "Номинальный счёт", "summary": "Движение средств по КД, сроки перевода и условие для сегмента «Туризм».", "text": "Движение денежных средств по кредитному договору: от банка через счёт ДК к юридическому лицу. Как движутся деньги Банк Перечисляет средства по кредитному договору. Счёт ДК Получает средства от банка. Юридическое лицо Получает перевод от ДК. Сроки перевода 3 рабочих дня — Срок перевода денежных средств. До 5 рабочих дней — Документальный срок при задержке средств от банка. Сегмент «Туризм» Договор оформлен до 12:00 Средства отправляются партнёру в тот же день. Не путай виды выплат Этот материал — о средствах по кредитному договору. Расчёты КВ и премий описаны отдельно. Выплаты ЮЛ → Выплаты агенту →", "source": "Номинальный счёт.pdf, стр. 1", "section": "payments", "limit": "Общая точка отсчета 3/5 дней, часовой пояс, правило после 12:00 не установлены."}, {"id": "refund", "title": "Возврат денежных средств", "summary": "Автоматическое письмо, срок возврата и шаблон для партнёра.", "text": "Возврат средств, перечисленных ТО за товар, если затем произошёл возврат товара или отмена авторизации. Когда приходит письмо На почту МРБ приходит автоматическое письмо для партнёра с требованием вернуть средства на счёт ДКЦ. Отправитель, указанный в инструкции. Милованова Ольга Викторовна (ДК). Шаблон заявления — во вложении. Срок возврата 5 рабочих дней с даты письма Партнёру необходимо вернуть денежные средства на счёт ДКЦ. Письмо партнёру Подставь номер кредитного договора и ИНН партнёра. Реквизиты возврата не заменяй предположениями. Скопировать шаблон Тема: ИП на возврат ДС по договору № [КД] инн партнера № [ИНН] Добрый день. Во вложении ИП на возврат ДС по договору [номер договора]. Обращаем внимание, что в случае, если по истечении 5 (пяти) рабочих дней с даты настоящего письма не будет осуществлен возврат ошибочно перечисленных денежных средств по указанным реквизитам, ООО «Директ Тех» оставляет за собой право удержать сумму, подлежащую возврату, из последующих платежей в соответствии с условиями заключенного Соглашения / Договора. В этом случае Стороны производят взаимозачет встречных требований. Шаблон заявления ↗ Если возврат не выполнен В тексте письма указано: ООО «Директ Тех» оставляет за собой право удержать подлежащую возврату сумму из последующих платежей в соответствии с условиями заключённого Соглашения / Договора. В этом случае стороны производят взаимозачёт встречных требований. Это право по условиям Соглашения / Договора, а не описание автоматического удержания сразу после истечения срока.", "source": "Письмо на возврат ДС (ссылка).pdf, стр. 1", "section": "payments", "limit": "Реквизиты не указаны; доступность Google-ссылки и актуальность отправителя не проверены."}, {"id": "offline-order", "title": "Оформление заказа в ЛК ДК", "summary": "Товар, анкета, документы, выбор предложения, подписание и выдача.", "text": "От создания заказа до подписания договора, печати спецификации и выдачи товара. До оформления Что понадобится — Паспорт и номер телефона клиента. Фото и документы — Фото паспорта: страницы 2–3, страница с регистрацией; фото клиента. Требования и замечания ДЗБ → Оформление по шагам Товар В разделе «Создать заказ» введи тип товара, название, стоимость и количество. Нажми «Далее». Короткая анкета Укажи номер телефона клиента. Загрузи фото паспорта: страницы 2–3 и страницу с регистрацией. Нажми «Далее». Персональные данные и фото Персональные данные заполняются автоматически. Укажи ежемесячный доход и загрузи фото клиента. Нажми «Далее». Паспортные данные Сведения подтянутся автоматически. Проверь их и при необходимости скорректируй. Нажми «Далее». Предложение Появятся предложения банков и МФО. Выбери подходящее клиенту предложение и нажми «Выбрать». Подписание Отправь код клиенту на номер телефона из анкеты и введи его для подтверждения подписания договора. Выдача товара После успешного подписания появится сообщение о выдаче кредита. Распечатай спецификацию и выдай товар клиенту. Параметры в инструкции — апрель 2026 Возраст — От 18 до 70 лет. Срок — От 2 до 60 месяцев. Первоначальный взнос — Без первоначального взноса. Сумма покупки — От 1 000 до 1 000 000 рублей. Актуальность параметров продукта не подтверждена. Не используй их как гарантию доступности конкретного предложения. Аннулирование заказа и возврат товара Для отказа от заказа и возврата товара предусмотрены отдельные памятки. Их переходы пока не подключены: адреса не подтверждены. Если деньги уже перечислены ТО, возврат ДС описан отдельно — это не инструкция по отмене заказа. Возврат перечисленных денежных средств → Нужна помощь? Чат технической поддержки — Доступен 24/7 в рабочем интерфейсе. Электронная почта — info@direkttech.ru Горячая линия — +7 495 215-56-21 С 09:00 до 21:00.", "source": "Инструкция по оформлению КД в оффлайне по ДК.pdf, стр. 1–8, апрель 2026", "section": "documents", "limit": "Ссылки памяток, актуальность параметров и контактов не проверены; скриншоты не перенесены."}, {"id": "credit-dossiers", "title": "Отправка кредитных досье", "summary": "Проверка КД, акт приёма-передачи, курьер и отметки об отправке.", "text": "Подготовка комплекта, заказ курьера и отметка по каждому КД. Перед отправкой Проверь КД на ошибки и недостающие документы. Сделай акт приёма-передачи КД и приложи его в пакет документов. Закажи курьера через форму. Поля формы (по приложенной таблице): дата приезда курьера, ФИО контактного лица, контактный телефон, адрес, содержимое документов, кол-во КД в посылке. Те же поля — в форме самостоятельного вызова курьера → . Куда отправлять форму, в этой инструкции не указано. Адресат описан только в материале «Самостоятельный вызов курьеров». После отправки В отчёте «Кредитные договоры» → вкладка «Непереданные КД» проставь статус МРБ: трек-номер + дата отправки — по каждому отправленному КД.", "source": "Инструкция по отправке кредитных досье.pdf, стр. 1", "section": "documents", "limit": "Адрес формы курьера, шаблон акта и состав комплекта не извлечены."}, {"id": "couriers", "title": "Вызов курьеров", "summary": "Централизованный сбор КД с ТТ и самостоятельный заказ курьера.", "source": "Централизованный вызов курьеров.pdf, стр. 1; Самостоятельный вызов курьеров.pdf, стр. 1 и приложенная форма", "limit": "Адрес формы из «Инструкции по отправке КД» не указан.", "section": "documents", "text": "Два варианта: централизованный сбор КД с ТТ и самостоятельный заказ курьера МРБ. Централизованный вызов Раз в месяц, с 1 по 5 число — инкассация кредитных договоров с ТТ, где зафиксированы продажи. Второй поток — с 16 по 20 число, если на ТТ к этому моменту оформлено более 14 КД. ТТ-исключениям, которым не нужен централизованный сбор, при заведении партнёра проставляется признак в личном кабинете ↗ . Изменить централизованный сбор МРБ может в своём личном кабинете: Найти ТТ и скорректировать адрес доставки (чек-бокс в адресе ТТ). Исключить ТТ из централизованной доставки. Самостоятельный вызов Заполни форму строго по шаблону и отправь Дарии Колесниковой: dkolesnikova@dc2b.ru . Без описания вложенных документов заказ не обрабатывается. Заказы обрабатываются по понедельникам и четвергам. В ответ придёт письмо с трек-номером и ссылкой на накладную. Статус заказа — на сайте КСЕ ↗ . Если курьер не приехал — сообщи Дарии Колесниковой. МРБ сам собирает документы у всех партнёров в городе проживания и отправляет их одной посылкой. Перед отправкой проверь документы на ошибки. Форма заказа курьера Скопировать Дата приезда курьера: [ ] ФИО контактного лица: [ ] Контактный телефон: [ ] Адрес: [ ] Содержимое документов: [ ] Кол-во КД в посылке: [ ] Отправка кредитных досье →"}, {"id": "dzb", "title": "Замечания ДЗБ и инструктаж агента", "summary": "Ошибки в документах и фото, инструктаж МРБ и акт о его прохождении.", "text": "Ошибки, по которым ДЗБ запрашивает обратную связь, и инструктаж агента. Замечания ДЗБ В программе ДК нет цветного скана паспорта (нет скана регистрации, стр. 2–3). Кредитная заявка оформлена по копии паспорта — скан вместо оригинала. Нарушен регламент фотографирования клиента в ДК: для офлайн-кредита фото не в офисе; клиент в головном уборе; фото обрезано. Инструктаж агента Проводит МРБ при обучении. Акт о прохождении инструктажа заполняется: при обучении агентов; при выставленном замечании от ДЗБ. Форма акта Адресат — Департамент защиты бизнеса. Поля: от кого, дата, город, МРБ (ФИО), подпись. В акте перечислены инструктажи: Проверка паспорта РФ. Частые вопросы (2023, январь). Процедура проверки подлинности паспорта РФ (2023, январь). 1.1 Методика по проверке заёмщиков (МРБ). Регламент работы с банком Порублю / МКК Порублю: установка приложения, консультация по оплате ЕП через приложение. Проверка клиента на ФССП Если у клиента есть ИЛ в части задолженности по банкам — отказать в выдаче. Банк данных исполнительных производств ФССП ↗ Расхождение: в «Регламенте ДЗБ» темы 1–3 помечены «ЖДЕМ ОБНОВЛЕНИЯ ОТ ДЗБ», а в форме акта приложены файлы версии 2023 года. Какая версия действует, в материалах не указано. Сами файлы инструктажей в базу не переданы.", "source": "Регламент ДЗБ.pdf, стр. 1", "section": "documents", "limit": "Три темы ожидают обновления; цель ссылки на форму не извлечена."}, {"id": "work-services", "title": "Рабочие сервисы МРБ", "summary": "Назначение сервисов, корпоративные кабинеты, почта и сброс пароля.", "text": "Каталог рабочих ресурсов: назначение каждого сервиса и быстрый переход. Рабочие сервисы Power BI — Аналитика. Открыть сервис ↗ Корпоративный портал — Новости, обучающие материалы, обращения в ТП, расчётный лист и другие ресурсы. Открыть сервис ↗ Outlook — Корпоративная почта. Открыть сервис ↗ Saby / СБИС — Кадровые документы, планы и задачи, новости, чат. Открыть сервис ↗ ЛК Директ Кредит — Контроль заявок онлайн. Открыть сервис ↗ Личный кабинет МРБ — Самостоятельная регистрация ЮЛ и приглашение ЮЛ на регистрацию. Открыть сервис ↗ Сброс пароля — Отдельный сервис сброса пароля. Открыть сервис ↗ Маркетинговые материалы Презентации и POS-материалы в электронном виде. Визитки. Консолидированный заказ от РД два раза в месяц. Заказ визиток Два описания порядка заказа В каталоге инструментов: консолидированный заказ от РД два раза в месяц. В отдельной инструкции «Визитки»: РРРБ раз в месяц собирает информацию о наличии визиток у МРБ. Актуальный единый порядок не установлен. Не объединяй эти варианты в один график. МРБ, работающие не менее месяца — В инструкции указан заказ на 50 шт. «Для остальных МРБ» — 100 шт. на три месяца; заказ только по запросу. Категория сохранена в формулировке документа. Данные необходимо направлять Горбуновой Анастасии на agorbunova@dc2b.ru с файлом во вложении. Поля файла (по приложенной таблице): ФИО, должность, e-mail, телефон — информация для визитки; адрес для доставки визиток. Как получить доступ →", "source": "Инструменты для работы МРБ.pdf, стр. 1; Визитки.pdf, стр. 1", "section": "tools", "limit": "Ссылки собраны по переносам PDF; доступность ресурсов не проверена. Адрес маркетинговых материалов не указан. Порядок заказа визиток расходится: РД дважды в месяц против ежемесячного сбора РРРБ. Актуальность не выбрана. Количества 50/100 и формулировка «для остальных МРБ» сохранены. Формат вложенного файла не установлен."}, {"id": "access", "title": "Получение доступов", "summary": "Кабинеты, корпоративная почта, СБИС и отдельный запрос к Power BI.", "text": "Выбери ресурс. Для каждого сохранены свой канал запроса и необходимые данные. Кабинеты Почта и СБИС Power BI Личный кабинет МРБ Для доступа к расширенной УЗ в ЛК и кабинету МРБ отправь запрос в ТП на портале lk.dc2b.ru. Открыть портал ↗ В каталоге инструментов этот доступ описан как запрос РРРБ через обращение в ТП на портале. Учётная запись ЛК Директ Кредит Создание учётной записи запрашивается на it@dc2b.ru . В каталоге инструментов указан запрос РРРБ через почту. Скопировать шаблон Кому: it@dc2b.ru Тема: ДОСТУП ДЛЯ НОВЫХ МРБ Прошу для новых сотрудников предоставить доступ в УЗ ПО ДК. Данные сотрудника: ФИО: [указать] Почта: [указать] Телефон: [указать] СБИС Доступ предоставляется при оформлении сотрудника — направлением сообщения. Открыть Saby / СБИС ↗ Корпоративная почта Доступ приходит руководителю на почту через 1–2 дня после оформления кадровых документов. Если письма нет — обратись к HR. В каталоге инструментов получение доступа к Outlook также указано через РРРБ. Открыть Outlook ↗ Запрос через создание доступов Открой техподдержку через QR-код из инструкции. В меню выбери «Создание доступов», затем «Доступ к другим ресурсам». Напиши запрос к отчёту «Внешний бизнес» для нового МРБ. Укажи ФИО, почту и телефон. Доступы придут на почту сотрудника (МРБ). Скопировать шаблон Нужен доступ к отчёту «Внешний бизнес» для нового МРБ. ФИО: [указать] Почта: [указать] Телефон: [указать] Подтверждённого адреса входа в канал техподдержки пока нет. QR-код не заменён вымышленной ссылкой. Два описания получения доступа Каталог инструментов — Power BI: доступ от РРРБ в чат-бот MAX. Отдельная инструкция по доступам — Запрос через «Создание доступов» → «Доступ к другим ресурсам». Какое описание является актуальным, не установлено. Канал запроса нужно подтвердить; эти варианты не объединены в обязательную последовательность. Названия отчётов различаются Запрос доступа описан для «Внешнего бизнеса». Материал по аналитике описывает «Все сети». Их соответствие не подтверждено. Работа с Power BI →", "source": "Доступы для МРБ.pdf, стр. 1; Доступы к Power BI.pdf, стр. 1; Инструменты для работы МРБ.pdf, стр. 1", "section": "tools", "limit": "Текущая версия маршрута Power BI не определена. QR-код/ссылка техподдержки не извлечены. Указанные сроки не расширены до рабочих дней."}, {"id": "power-bi", "title": "Работа с Power BI", "summary": "Фильтры отчёта «Все сети», вкладки, воронка и показатели.", "text": "Навигация по отчёту «Все сети»: фильтры, вкладки и смысл показателей. От
