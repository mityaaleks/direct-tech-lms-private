</style></head><body><a class="btn skip" href="#main">К содержанию</a><header><button aria-expanded="false" aria-label="Открыть разделы" class="mobile" id="menu">☰</button><a class="brand" href="#/">DIRECT TECH<b> /</b> знания</a><form id="searchForm" role="search"><input aria-label="Поиск по базе знаний" id="searchInput" placeholder="Найти инструкцию или контакт" type="search"/><button aria-label="Найти">Найти</button></form></header><div class="shell"><aside aria-label="Разделы" id="side"></aside><main id="main" tabindex="-1"></main></div><nav aria-label="Основная навигация" class="bottom" id="bottom"></nav><div class="toast" hidden="" id="toast" role="status"></div><script id="content" type="application/json">{"modules":[{"id":"overview","title":"Этапы подключения нового партнёра","source":"Этапы подключения нового партнера.pdf, стр. 1","text":"Новый партнёр\n1. Определение условий\nФорма сотрудничества: офлайн, онлайн или смешанная схема.\nУсловия взаиморасчётов.\n2. Регистрация партнёра\n3. Обучение агентов\n4. Сопровождение партнёра","limit":"Подробные действия, сроки и ответственные в исходной схеме не указаны. Регистрация — второй этап, а не завершение всей схемы.","summary":"Общая схема из четырёх этапов: условия, регистрация, обучение агентов, сопровождение."},{"id":"conditions","title":"Работа с партнёром","source":"Работа с партнером.pdf, стр. 1–2","text":"СТРАНИЦА 1. Стандартные Условия (Партнёр работает по оферте)\nРегистрация партнёра → Согласование ДЗБ → Регистрация партнёра в ДК → Аккредитация → Обучение Агентов → Старт продаж.\nНесколько вариантов условий (магазинов) для партнеров, файл «Продукты ДК_Ритейл» (обновляется ежемесячно).\nДК Ритейл (высокодоходный кабинет). Рассрочки субсидированные.\nДК Ритейл Лайт (ставки ниже ДК Ритейл 1) +ОД.\nДК Универсальный (низкодоходные продукты) +ОД.\nДК Выгодный (услуга по подбору кредитных продуктов) — партнёрам, которые готовы делать скидку, но не оформляют доп.услуги.\nМТС Франчайзи.\nКАБИНЕТ 1 и 2 (для партнёров с Инд.условиями).\nПредусмотрено стандартное АВ для агентов, работающих с оплатой. Изменения не предусмотрены.\nДействует автоматическая настройка Доп. Услуг. Изменения не предусмотрены.\nОговорка источника: «В исключительных возможны изменения АВ и изменения тарифа ДУ с согласования ДЦРБ».\nСТРАНИЦА 2. Индивидуальные условия (С Партнёром заключается соглашение/агентский договор)\nМенеджер регистрирует партнёра, прикладывая Инд. Договор вместо Оферты.\nОбрыв извлечения: «Либо Партнёр регистрируется самостоятельно и далее МРБ». Продолжение не додумывается.\nОтправка вводных и согласования на partner_support@dc2b.ru для подготовки договора.\nВ карточку ТО вносятся изменения согласно уведомлению Договора.\nБлоки процесса: Обсуждение ИУ с партнёром → Расчет Фин. Модели РРРБ → Отправка вводных и согласования на partner_support@dc2b.ru для подготовки договора → Согласование договора в СБИС → Подписание партнёром 2 экз.\nЕсть возможность подписания по ЭДО.\nСкан в тот же день на partner_support@dc2b.ru.\nОригинал в течение 3 дней отправляется в ЦО (для удалённых партнёров необходимо заказать курьера).\nПри ИУ возможно изменение Продуктовой линейки и оплата расчетного КВ в пользу ЮЛ.\nПродукты, ставки, скидки и КВ указываются в уведомлении.\nПри изменении продуктов, коммерции уведомление меняется на стороне ДК и отправляется партнёру для ознакомления.","limit":"Актуальная продуктовая матрица не установлена. Тип дней, точка отсчёта срока и связь ЭДО с бумажными оригиналами явно не уточнены. Сокращения не расшифровываются предположением. «КАБИНЕТ 1 и 2» на странице стандартных условий подписан как вариант для ИУ.","summary":"Стандартные условия по оферте, варианты кабинетов, индивидуальные условия и порядок подготовки договора."},{"id":"registration","title":"Регистрация партнёра","source":"Регистрация партнера (ссылка google).pdf, стр. 1–2","text":"СТРАНИЦА 1. Регистрация партнёра\nЛичный кабинет МРБ: https://dc2b.ru/\nВ извлечении подписи «презентация» и «видео»: https://dc2b.ru/files/mrb.mp4\nМенеджер регистрирует партнёра в своём кабинете. Распечатывает формы Оферты и СОПД, подписывает с партнёром и загружает в Личный кабинет. Информация передаётся для проверки ДЗБ.\nЛичный кабинет партнёра: https://dc2b.ru/files/LK_partner.pdf\nПартнёр самостоятельно регистрируется по ссылке, полученной от МРБ, подписывает документы ЭЦП. Информация передаётся для проверки ДЗБ.\nДля отправки партнёру ссылки для регистрации используется вкладка «Пригласить партнера».\nНа площадках Google Play и App Store можно скачать мобильное приложение портала.\nGoogle Play: https://play.google.com/store/apps/details?id=ru.dc2b.lk\nApp Store: https://apps.apple.com/ru/app/%D0%B4%D0%BA%D1%86/id6473836779\nПри регистрации ЮЛ вносится ФИО и телефон агента. После чего Агенту приходит СМС со ссылкой для регистрации. Рядом в извлечении указан адрес https://dc2b.ru/files/LK_UBL.pdf\nСТРАНИЦА 2. СМС-напоминания\nЕсли партнёр начал регистрацию и не завершил её: «Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли в данных ошибка в регистрации ГД, ДЗБ направит партнёра «На доработку»: «Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли УБЛ была направлена ссылка, но регистрация не начата: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Заполните анкету по ссылке, чтобы начать продавать ссылка».\nЕсли УБЛ начал регистрацию и не завершил её: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЕсли ДЗБ нашёл замечания в регистрации УБЛ и отправил его «На доработку»: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЧастота отправки напоминаний:\nНе закончил регистрацию, не начал регистрацию: СМС отправляется на следующий день, через 3 дня, раз в неделю 3 недели.\nОтправлен на доработку: сразу после выставления статуса «На доработке», на следующий день, через 3 дня, раз в неделю 3 недели.","limit":"Ссылки и приложения не проверены. PDF LK_UBL не выдаётся за фактическую ссылку регистрации из СМС. Имя, телефон и ООО «КОМОДИНИ» — элементы шаблонов, не проверенные контакты. Расписание передано буквально. Для описанной регистрации менеджером на ИУ предыдущий документ указывает Инд. Договор вместо Оферты. Порядок СОПД для ИУ отдельно не установлен.","summary":"Регистрация менеджером и самостоятельно, регистрация агента, шаблоны и расписание СМС-напоминаний."}],"questions":[{"m":0,"t":"Что следует после регистрации в общей схеме?","a":["Старт продаж как последний этап.","Обучение агентов и сопровождение.","Повторная регистрация."],"c":1,"e":"Регистрация — второй этап из четырёх.","source":"Этапы подключения нового партнера.pdf, стр. 1"},{"m":0,"t":"Какие формы сотрудничества указаны?","a":["Только офлайн.","Только онлайн.","Офлайн, онлайн или смешанная схема."],"c":2,"e":"Перечислены три варианта.","source":"Этапы подключения нового партнера.pdf, стр. 1"},{"m":1,"t":"Основание стандартных условий?","a":["Оферта.","Всегда индивидуальный договор.","Без документов."],"c":0,"e":"Партнёр работает по оферте.","source":"Работа с партнером.pdf, стр. 1"},{"m":1,"t":"Что прикладывает менеджер при описанной регистрации на ИУ?","a":["Только оферту.","Ничего.","Инд. Договор вместо Оферты."],"c":2,"e":"Правило описанной регистрации менеджером.","source":"Работа с партнером.pdf, стр. 2"},{"m":1,"t":"Как описаны изменения АВ и тарифа ДУ?","a":["Без согласования.","Общее ограничение и исключение с согласованием ДЦРБ.","Без исключений запрещены."],"c":1,"e":"Оговорку об исключении нельзя опускать.","source":"Работа с партнером.pdf, стр. 1"},{"m":1,"t":"Срок отправки оригинала в ЦО?","a":["В течение 3 дней; тип дней не уточнён.","3 рабочих дня.","Месяц."],"c":0,"e":"Тип дней не уточнён.","source":"Работа с партнером.pdf, стр. 2"},{"m":1,"t":"Где указаны продукты, ставки, скидки и КВ?","a":["В СМС.","В личном конспекте.","В уведомлении."],"c":2,"e":"Уведомление меняется на стороне ДК и направляется партнёру.","source":"Работа с партнером.pdf, стр. 2"},{"m":2,"t":"Какие формы загружает менеджер по инструкции регистрации?","a":["Произвольное письмо.","Оферты и СОПД.","Акт и счёт."],"c":1,"e":"Для ИУ отдельно учитывай предыдущий документ.","source":"Регистрация партнера (ссылка google).pdf, стр. 1"},{"m":2,"t":"Как подписываются документы при самостоятельной регистрации?","a":["ЭЦП.","Не подписываются.","Устно."],"c":0,"e":"В источнике указана ЭЦП.","source":"Регистрация партнера (ссылка google).pdf, стр. 1"},{"m":2,"t":"Вкладка отправки ссылки?","a":["История выплат.","Архив.","Пригласить партнера."],"c":2,"e":"Так названа вкладка в документе.","source":"Регистрация партнера (ссылка google).pdf, стр. 1"},{"m":2,"t":"Какие данные агента вносятся при регистрации ЮЛ?","a":["Только email.","ФИО и телефон.","Только паспорт."],"c":1,"e":"Далее агенту приходит СМС со ссылкой.","source":"Регистрация партнера (ссылка google).pdf, стр. 1"},{"m":2,"t":"Когда начинается напоминание после статуса «На доработке»?","a":["Сразу, далее на следующий день, через 3 дня, раз в неделю 3 недели.","Через 3 недели.","После звонка."],"c":0,"e":"Расписание передано буквально.","source":"Регистрация партнера (ссылка google).pdf, стр. 2"}],"course":{"id":"partner","title":"Подключение партнёра","summary":"Три урока по документам базы знаний МРБ: общая схема подключения, стандартные и индивидуальные условия, регистрация партнёра. В конце — итоговая самопроверка из 12 вопросов."},"pending":["Аналитика POWER BI.pdf","Банки.pdf","Визитки.pdf","Вспомогательные отделы.pdf","Доступы для МРБ.pdf","Доступы к Power BI.pdf","Единый стандарт согласования коммерции.pdf","Инструкция по отправке кредитных досье.pdf","Инструкция по оформлению КД в оффлайне по ДК.pdf","Инструмент проверки партнера.pdf","Инструменты для работы МРБ.pdf","Мотивация.pptx","Настройки по САМЕ или дополнительных услуг.pdf","Номинальный счёт.pdf","Общая рассылка.pdf","Основные цели направления.pdf","Отдел аккредитации и настройки УБЛ.pdf","Отдел операционного сопровождения.pdf","Письмо на возврат ДС (ссылка).pdf","План работ в СБИС.pdf","Порядок выплат ЮЛ.pdf","Порядок выплат агенту.pdf","Правила в территории привлечения партнеров.pdf","Правила отправки запросов по ТТ И Агентам.pdf","Приём кандидата.pdf","Процесс согласования ИУ с партнерами и агентами.pdf","Работа с жалобами от Банков.pdf","Работа с онлайн магазинами (ссылки).pdf","Регламент ДЗБ.pdf","Рынок POS в локальных и региональных сетях.pdf","Самостоятельный вызов курьеров.pdf","Сетка эффективности МРБ.pdf","Согласование финансовой модели для ЮЛ и Агента.pdf","Структура бизнеса.pdf","Централизованный вызов курьеров.pdf"],"collection":"База знаний Менеджера по развитию бизнеса"}</script>

const $=s=>document.querySelector(s), E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let C=JSON.parse($('#content').textContent),state={},lms={quiz:{},attempts:[],last:null},filter='all',answers={},result=null,storageOK=true;
try{state=JSON.parse(localStorage.getItem('dt-two-modules-v1')||'{}')||{};lms={...lms,...JSON.parse(localStorage.getItem('dt-lms-v2')||'{}')};if(!C)C=JSON.parse(localStorage.getItem('dt-ux-content-v1')||'null')}catch{storageOK=false}
function valid(c){return c&&Array.isArray(c.modules)&&c.modules.length&&c.modules.every(m=>typeof m.id==='string'&&typeof m.title==='string'&&typeof m.text==='string')&&(!c.questions||Array.isArray(c.questions)&&c.questions.every(q=>typeof q.t==='string'&&Array.isArray(q.a)&&Number.isInteger(q.c)&&q.c>=0&&q.c<q.a.length&&Number.isInteger(q.m)&&q.m>=0&&q.m<c.modules.length))}
function init(){if(!valid(C)){C=null;return}C.questions=C.questions||[];C.modules.forEach(m=>state[m.id]={started:false,done:false,fav:false,...state[m.id]});if(!lms.quiz||typeof lms.quiz!=='object')lms.quiz={};if(!Array.isArray(lms.attempts))lms.attempts=[]}init();
function save(){try{localStorage.setItem('dt-two-modules-v1',JSON.stringify(state));localStorage.setItem('dt-lms-v2',JSON.stringify(lms));storageOK=true}catch{storageOK=false;toast('Хранилище недоступно. Скачай резервную копию до закрытия страницы.')}}
function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('#toast').hidden=true,4500)}
const navs=[['','База знаний'],['learning','Обучение'],['favorites','Избранное'],['progress','Прогресс']];
function route(){let parts=location.hash.replace(/^#\/?/,'').split('/');let v=parts[0]||'',id;try{id=decodeURIComponent(parts.slice(1).join('/'))}catch{id=''}return{v,id}}
function go(p){if(location.hash==='#/'+p)render();else location.hash='/'+p}
function link(p,t){return `<a href="#/${p}">${E(t)}</a>`}
const count=()=>C.modules.filter(m=>state[m.id].done).length;
const bar=p=>`<div class="bar" role="progressbar" aria-label="Прогресс изучения" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${p}"><span style="width:${p}%"></span></div>`;
function rows(ms,training=false,q=''){return ms.length?`<div class="cards">${ms.map(m=>{let text=q?(m.text+' '+(m.limit||'')):m.summary||'',i=text.toLocaleLowerCase('ru').indexOf(q.toLocaleLowerCase('ru')),snippet=q?text.slice(Math.max(0,i-65),Math.max(0,i-65)+210):text;return `<div class="material"><div><h2>${link((training?'lesson/':'article/')+encodeURIComponent(m.id),m.title)}</h2><p>${E(snippet)}</p><div class="caption">${training?(state[m.id].done?'Изучено':state[m.id].started?'В процессе':'Не начато')+' · ':''}${E(m.source||'Источник не указан')}</div></div><button class="star" data-fav="${E(m.id)}" aria-pressed="${!!state[m.id].fav}" aria-label="${state[m.id].fav?'Убрать из избранного':'Добавить в избранное'}: ${E(m.title)}">${state[m.id].fav?'★':'☆'}</button></div>`}).join('')}</div>`:`<div class="card empty">Здесь пока пусто. ${link('','Открыть базу знаний')}</div>`}
function upload(){return `<section class="card upload"><div class="eyebrow">Новая версия интерфейса</div><h1>Подключи материалы</h1><p>Выбери исходный <strong>index.html</strong>. Портал извлечёт из него материалы и вопросы, не запуская старый код и не отправляя файл в интернет.</p><input id="source" type="file" accept=".html,text/html"><p class="caption">После загрузки нажми «Скачать готовый HTML»: получишь самостоятельную версию со всеми материалами внутри. Текущий файл — оболочка, без встроенных корпоративных текстов.</p><p class="warning" id="importError" role="alert"></p></section>`}
function base(){const ms=C.modules.filter(m=>filter==='done'?state[m.id].done:filter==='todo'?!state[m.id].done:true);return `<div class="eyebrow">Рабочая справка</div><h1>База знаний</h1><p class="muted">Найди инструкцию и открой её без прохождения курса.</p><div class="row spread"><h2>Работа с партнёром</h2><span class="caption">${C.modules.length} материала</span></div><div class="pills">${[['all','Все'],['todo','Не изучено'],['done','Изучено']].map(([k,t])=>`<button data-filter="${k}" aria-pressed="${filter===k}">${t}</button>`).join('')}</div>${rows(ms)}<section class="card"><div class="row spread"><div><h2>Изучай последовательно</h2><span class="muted">Те же материалы — с самопроверкой и прогрессом.</span></div><a class="btn" href="#/learning">К обучению →</a></div></section>${C.pending?.length?`<details class="card"><summary>Ещё не перенесено: ${C.pending.length}</summary><p class="caption">Содержимое этих документов не включено в поиск.</p><ul>${C.pending.map(p=>`<li>${E(p)}</li>`).join('')}</ul></details>`:''}`}
function learning(){let n=count(),next=C.modules.find(m=>!state[m.id].done)||C.modules[0];return `<div class="eyebrow">Личное обучение</div><h1>Обучение</h1><section class="card hero"><h2>${E(C.course?.title||'Работа с партнёром')}</h2><p>${E(C.course?.summary||'Последовательно изучи материалы и проверь себя.')}</p>${bar(Math.round(n/C.modules.length*100))}<p>Изучено ${n} из ${C.modules.length}</p><a class="btn primary" href="#/lesson/${encodeURIComponent(next.id)}">${n===C.modules.length?'Повторить материалы':C.modules.some(m=>state[m.id].started)?'Продолжить обучение':'Начать обучение'} →</a></section><h2>Программа</h2>${rows(C.modules,true)}${C.questions.length?`<section class="card"><h2>Итоговая самопроверка</h2><p>${C.questions.length} вопросов. Без таймера, проходного балла и ограничений попыток.</p><a class="btn" href="#/test">Пройти тест</a></section>`:''}`}
function format(text){let n=0;return text.split('\n').filter(x=>x.trim()).map(t=>{let x=t.match(/^СТРАНИЦА (\d+)\.\s*(.*)$/);if(x)return `<h2 id="sec${++n}"><span class="caption">Стр. ${E(x[1])}</span><br>${E(x[2])}</h2>`;if(t.includes(' → '))return `<div class="note">${t.split(' → ').map(E).join('<br>↓<br>')}</div>`;return `<p>${E(t)}</p>`}).join('')}
function question(q,i,p){return `<fieldset><legend>${i+1}. ${E(q.t)}</legend>${q.a.map((a,j)=>`<label class="option"><input required type="radio" name="${p}${i}" value="${j}"><span>${E(a)}</span></label>`).join('')}</fieldset>`}
function article(id,training){let m=C.modules.find(m=>m.id===id);if(!m)return `<h1>Материал не найден</h1>${link('','К базе знаний')}`;let i=C.modules.indexOf(m),qs=C.questions.filter(q=>q.m===i);if(training){state[id].started=true;lms.last=id;save()}let res=[...new Set((m.text.match(/https?:\/\/[^\s«»"<>]+|[\w.+-]+@[\w.-]+\.[a-z]{2,}/gi)||[]).map(s=>s.replace(/[.,;]$/,'')))],heads=[...m.text.matchAll(/^СТРАНИЦА (\d+)\.\s*(.*)$/gm)];return `<div class="crumb">${link(training?'learning':'',training?'Обучение':'База знаний')} / ${training?'Урок '+(i+1):'Работа с партнёром'}</div><article class="doc"><div class="eyebrow">${training?'Урок '+(i+1)+' из '+C.modules.length:'Рабочий материал'}</div><h1>${E(m.title)}</h1><p class="caption">${E(m.source)}</p><div class="row actions"><button data-fav="${E(id)}" aria-pressed="${!!state[id].fav}">${state[id].fav?'★ В избранном':'☆ В избранное'}</button><button data-done="${E(id)}">${state[id].done?'Снять отметку «Изучено»':'Отметить изученным'}</button></div><p class="caption">По исходному документу. Актуальная редакция не подтверждена.</p>${heads.length?`<nav class="toc" aria-label="Содержание документа"><details><summary>Содержание</summary>${heads.map((h,n)=>`<a href="#sec${n+1}" data-anchor="sec${n+1}">${E(h[2])}</a>`).join('')}</details></nav>`:''}${format(m.text)}${res.length?`<section class="card"><h2>Адреса и контакты из документа</h2><p class="caption">Можно скопировать. Ссылки не проверены.</p><div class="tools">${res.map(r=>`<div class="resource"><code>${E(r)}</code><button data-copy="${E(r)}">Копировать</button></div>`).join('')}</div></section>`:''}<details class="note"><summary>Ограничения источника</summary><p>${E(m.limit||'В предоставленных материалах не указано.')}</p><p class="caption">Учебное представление, не новый утверждённый регламент.</p></details>${training&&qs.length?`<h2>Самопроверка</h2><form class="quiz" id="lessonQuiz">${qs.map((q,j)=>question(q,j,'q')).join('')}<button class="primary">Проверить ответы</button><div id="quizResult" aria-live="polite"></div></form><p class="caption">Отметка «Изучено» ставится вручную и не зависит от ответов.</p>`:''}<div class="card"><div class="row spread">${training?`<button data-done="${E(id)}">${state[id].done?'Снять отметку':'Отметить изученным'}</button>${C.modules[i+1]?`<a class="btn" href="#/lesson/${encodeURIComponent(C.modules[i+1].id)}">Следующий урок →</a>`:'<a class="btn" href="#/test">К итоговому тесту →</a>'}`:`<p>Для последовательного изучения:</p><a class="btn" href="#/lesson/${encodeURIComponent(id)}">Открыть как урок →</a>`}</div></div></article>`}
function test(){return `<div class="crumb">${link('learning','Обучение')} / Самопроверка</div><h1>Итоговая самопроверка</h1><p class="muted">${C.questions.length} вопросов. Ответь на каждый. Результат не меняет отметки изучения.</p><form class="quiz" id="finalQuiz">${C.questions.map((q,i)=>question(q,i,'t')).join('')}<button class="primary">Завершить тест</button><div id="quizResult" aria-live="polite"></div></form>`}
function feedback(qs,form,p){let score=0;let h=qs.map((q,i)=>{let v=Number(new FormData(form).get(p+i)),ok=v===q.c;if(ok)score++;return `<div class="feedback ${ok?'':'bad'}"><strong>${i+1}. ${ok?'Верно':'Ошибка'}</strong><p>Твой ответ: ${E(q.a[v])}</p>${ok?'':`<p>Правильный ответ: ${E(q.a[q.c])}</p>`}<p>${E(q.e||'')}</p><span class="caption">${E(q.source||'')}</span></div>`}).join('');$('#quizResult').innerHTML=`<h2 tabindex="-1" id="resultTitle">Результат: ${score} из ${qs.length}</h2>${h}`;$('#resultTitle').focus();return score}
function progress(){let n=count(),best=lms.attempts.reduce((b,a)=>Math.max(b,a.score),0);return `<h1>Мой прогресс</h1><p class="muted">Сохраняется в этом браузере. На другом устройстве загрузи резервную копию.</p><div class="stats"><div class="card"><div>Изучено</div><div class="value">${n}/${C.modules.length}</div></div><div class="card"><div>Лучший тест</div><div class="value">${lms.attempts.length?best+'/'+C.questions.length:'—'}</div></div><div class="card"><div>Попыток</div><div class="value">${lms.attempts.length}</div></div></div><div class="card tablewrap"><table><thead><tr><th>Материал</th><th>Статус</th><th>Самопроверка</th></tr></thead><tbody>${C.modules.map(m=>`<tr><td>${link('lesson/'+encodeURIComponent(m.id),m.title)}</td><td>${state[m.id].done?'Изучено':state[m.id].started?'В процессе':'Не начато'}</td><td>${lms.quiz[m.id]?E(lms.quiz[m.id].score)+'/'+E(lms.quiz[m.id].total):'—'}</td></tr>`).join('')}</tbody></table></div><details class="card"><summary>История тестирования</summary>${lms.attempts.length?lms.attempts.slice().reverse().map(a=>`<p>${E(new Date(a.date).toLocaleString('ru-RU'))} — ${E(a.score)}/${E(a.total)}</p>`).join(''):'Попыток пока нет.'}</details><section class="card"><h2>Резервная копия прогресса</h2><div class="row"><button id="backup">Скачать копию</button><label class="btn">Загрузить копию<input id="restore" type="file" accept=".json" style="max-width:190px"></label><button id="reset">Сбросить прогресс</button></div></section><section class="card"><h2>Самостоятельный HTML</h2><p class="muted">Материалы войдут в файл. Личный прогресс — только в отдельную резервную копию. Не публикуй внутренний контент без согласования.</p><button class="primary" id="download">Скачать готовый HTML</button></section>`}
function download(name,text,type){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function standalone(){let d=document.documentElement.cloneNode(true);d.querySelector('#content').textContent=JSON.stringify(C).replace(/</g,'\\u003c');d.querySelector('#main').innerHTML='';d.querySelector('#side').innerHTML='';d.querySelector('#bottom').innerHTML='';d.querySelector('#toast').hidden=true;download('direct-tech-knowledge.html','<!doctype html>\n'+d.outerHTML,'text/html')}
function render(){let{v,id}=route(),active=['article','search','section','library'].includes(v)?'':['lesson','course','test'].includes(v)?'learning':v;$('#side').innerHTML=navs.map(([p,t])=>`<a href="#/${p}" ${active===p?'aria-current="page"':''}>${t}</a>`).join('')+(C?`<details open><summary>Работа с партнёром</summary>${C.modules.map(m=>`<a href="#/article/${encodeURIComponent(m.id)}" ${id===m.id&&v==='article'?'aria-current="page"':''}>${E(m.title)}</a>`).join('')}</details><p class="caption">Внутренние материалы<br>Direct Tech</p>`:'');$('#bottom').innerHTML=navs.map(([p,t])=>`<a href="#/${p}" ${active===p?'aria-current="page"':''}>${t}</a>`).join('');$('#searchInput').value=v==='search'?id:'';let h;if(!C)h=upload();else if(v==='learning'||v==='course')h=learning();else if(v==='article'||v==='lesson')h=article(id,v==='lesson');else if(v==='favorites')h='<h1>Избранное</h1><p class="muted">Материалы для быстрого доступа.</p>'+rows(C.modules.filter(m=>state[m.id].fav));else if(v==='progress')h=progress();else if(v==='test')h=test();else if(v==='search'){let q=id.trim().toLocaleLowerCase('ru'),ms=q?C.modules.filter(m=>(m.title+' '+m.text+' '+(m.limit||'')).toLocaleLowerCase('ru').includes(q)):[];h=`<h1>Поиск</h1><p class="muted">${q?'Запрос: «'+E(id)+'». Найдено: '+ms.length:'Введи название, сокращение или фразу в строке сверху.'}</p>${q?rows(ms,false,id):''}`}else h=base();$('#main').innerHTML=h+(C?`<footer>Учебное представление исходных документов, не корпоративный регламент. ${!storageOK?'Хранилище недоступно. Скачай резервную копию.':'Прогресс хранится в этом браузере.'}</footer>`:'');document.title=($('#main h1')?.textContent||'База знаний')+' — Direct Tech';bind()}
function bind(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{state[b.dataset.fav].fav=!state[b.dataset.fav].fav;save();let y=scrollY;render();scrollTo(0,y)});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{let id=b.dataset.done;state[id].done=!state[id].done;save();let y=scrollY;render();scrollTo(0,y);toast('Отметка сохранена в этом браузере. Для переноса скачай резервную копию в разделе «Прогресс».')});document.querySelectorAll('[data-anchor]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.anchor)?.scrollIntoView({behavior:'instant'})});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast('Адрес скопирован')}catch{const ta=document.createElement('textarea');ta.value=b.dataset.copy;document.body.append(ta);ta.select();let ok=document.execCommand('copy');ta.remove();if(ok)toast('Адрес скопирован');else prompt('Скопируй адрес вручную:',b.dataset.copy)}});
if($('#source'))$('#source').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let doc=new DOMParser().parseFromString(await f.text(),'text/html'),node=doc.querySelector('script#content');if(!node)throw Error('В файле нет блока материалов #content.');let c=JSON.parse(node.textContent);if(!valid(c))throw Error('Структура материалов не подходит.');C=c;init();try{localStorage.setItem('dt-ux-content-v1',JSON.stringify(C))}catch{storageOK=false}go('progress');toast('Материалы подключены. Скачай готовый HTML внизу страницы.')}catch(err){$('#importError').textContent='Не удалось загрузить: '+err.message}};
if($('#lessonQuiz'))$('#lessonQuiz').onsubmit=e=>{e.preventDefault();let {id}=route(),i=C.modules.findIndex(m=>m.id===id),qs=C.questions.filter(q=>q.m===i),s=feedback(qs,e.target,'q');lms.quiz[id]={score:s,total:qs.length,date:new Date().toISOString()};save()};if($('#finalQuiz'))$('#finalQuiz').onsubmit=e=>{e.preventDefault();let s=feedback(C.questions,e.target,'t');lms.attempts.push({version:1,score:s,total:C.questions.length,date:new Date().toISOString()});lms.attempts=lms.attempts.slice(-20);save()};if($('#download'))$('#download').onclick=standalone;if($('#backup'))$('#backup').onclick=()=>download('direct-tech-progress.json',JSON.stringify({app:'dt-lms',version:2,state,lms},null,2),'application/json');if($('#restore'))$('#restore').onchange=async e=>{try{let f=e.target.files[0];if(!f)return;let d=JSON.parse(await f.text());if(d.app!=='dt-lms'||!d.state)throw Error();if(!confirm('Заменить текущий прогресс данными из копии?'))return;let ns={};C.modules.forEach(m=>{let s=d.state[m.id]||{};ns[m.id]={done:s.done===true,started:s.started===true,fav:s.fav===true}});let l=d.lms||{};state=ns;lms={last:typeof l.last==='string'?l.last:null,quiz:{},attempts:Array.isArray(l.attempts)?l.attempts.filter(a=>a&&a.total===C.questions.length&&Number.isInteger(a.score)&&a.score>=0&&a.score<=a.total&&!isNaN(Date.parse(a.date))).slice(-20):[]};C.modules.forEach(m=>{let q=l.quiz?.[m.id];if(q&&Number.isInteger(q.score)&&Number.isInteger(q.total)&&q.total>0&&q.score>=0&&q.score<=q.total)lms.quiz[m.id]=q});save();render();toast('Резервная копия загружена')}catch{toast('Не удалось прочитать копию прогресса')}};if($('#reset'))$('#reset').onclick=()=>{if(!confirm('Удалить отметки, избранное и результаты тестов?'))return;state={};lms={quiz:{},attempts:[],last:null};init();save();render()}}

function practical(id){if(id==='overview')return '<h3>Собери последовательность</h3><p>Выбирай этапы в правильном порядке.</p><div class="row learn-pick">'+['Сопровождение партнёра','Регистрация партнёра','Определение условий','Обучение агентов'].map(t=>`<button data-order="${E(t)}">${E(t)}</button>`).join('')+'</div><div id="orderResult" class="feedback" role="status">Выбрано 0 из 4</div><button id="orderReset">Начать заново</button>';if(id==='conditions')return '<h3>Проследи путь ИУ</h3><p>Обсуждение ИУ → Расчет Фин. Модели РРРБ → Отправка вводных и согласования для подготовки договора → Согласование договора в СБИС → Подписание партнёром 2 экз.</p><label for="learningDetail">Разбери часть процесса</label><br><select id="learningDetail"><option value="prepare">Подготовка договора</option><option value="sign">Подписание и отправка</option></select><div id="learningDetailResult" class="feedback" role="status"></div>';return '<h3>Сравни два сценария</h3><label for="learningDetail">Кто регистрирует партнёра?</label><br><select id="learningDetail"><option value="manager">Менеджер</option><option value="partner">Партнёр самостоятельно</option><option value="sms">СМС-напоминания</option></select><div id="learningDetailResult" class="feedback" role="status"></div>'}
const referenceArticle=article;article=function(id,training){if(!training)return referenceArticle(id,false);const m=C.modules.find(x=>x.id===id),p=lessonDesign[id];if(!m||!p)return referenceArticle(id,true);const i=C.modules.indexOf(m),qs=C.questions.filter(q=>q.m===i);state[id].started=true;lms.last=id;save();return `<div class="crumb"><a href="#/learning">Обучение</a> / Урок ${i+1} из ${C.modules.length}</div><article class="doc"><h1>${E(m.title)}</h1><section class="learn-block learn-goal"><h2>Цель урока</h2><p>${E(p.goal)}</p></section><nav class="learn-nav" aria-label="Части урока"><a href="#concepts" data-learn-anchor="concepts">Главное</a><a href="#practice" data-learn-anchor="practice">Практика</a><a href="#selfcheck" data-learn-anchor="selfcheck">Проверка</a></nav><section id="concepts" class="learn-section">${p.blocks.map(([t,d])=>`<div class="learn-block"><h3>${E(t)}</h3><p>${E(d)}</p></div>`).join('')}</section><section id="practice" class="learn-block learn-practice learn-section">${practical(id)}</section><section class="learn-block learn-task"><span class="eyebrow">Учебная ситуация · вымышленный пример</span><h2>Как поступишь?</h2><p>${E(p.prompt)}</p>${p.answers.map((t,j)=>`<button class="option" data-case-answer="${j}">${E(t)}</button>`).join('')}<div id="caseFeedback" class="feedback" role="status" hidden></div></section><section id="selfcheck" class="learn-section"><h2>Проверь себя</h2><form class="quiz" id="lessonQuiz">${qs.map((q,j)=>question(q,j,'q')).join('')}<button class="primary">Проверить ответы</button><div id="quizResult" aria-live="polite"></div></form></section><section class="learn-block learn-end"><h2>Запомни</h2><p>${E(p.recap)}</p><div class="row"><button data-done="${E(id)}">${state[id].done?'Снять отметку «Изучено»':'Отметить урок изученным'}</button>${C.modules[i+1]?`<a class="btn" href="#/lesson/${C.modules[i+1].id}">Следующий урок →</a>`:'<a class="btn" href="#/test">Итоговая самопроверка →</a>'}</div><p class="learn-tip">Отметку ставишь сам; ответы не блокируют переход дальше.</p></section></article>`};
let orderChosen=[];
function bindPractice(){const id=route().id,p=lessonDesign[id];if(!p)return;document.querySelectorAll('[data-case-answer]').forEach(b=>b.onclick=()=>{let correct=+b.dataset.caseAnswer===p.correct;let el=document.getElementById('caseFeedback');el.hidden=false;el.className='feedback '+(correct?'':'bad');el.textContent=(correct?'Верно. ':'Не совсем. ')+p.explain;document.querySelectorAll('[data-case-answer]').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'))});document.querySelectorAll('[data-learn-anchor]').forEach(a=>a.onclick=e=>{e.preventDefault();document.getElementById(a.dataset.learnAnchor)?.scrollIntoView({block:'start'})});if(id==='overview'){orderChosen=[];const sequence=['Определение условий','Регистрация партнёра','Обучение агентов','Сопровождение партнёра'];document.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{if(b.dataset.order!==sequence[orderChosen.length]){$('#orderResult').textContent='Пока нет: подумай, что предшествует этому этапу.';return}orderChosen.push(b.dataset.order);b.disabled=true;$('#orderResult').textContent=orderChosen.length===4?'Верно: '+sequence.join(' → '):'Выбрано '+orderChosen.length+' из 4: '+orderChosen.join(' → ')});$('#orderReset').onclick=()=>{orderChosen=[];document.querySelectorAll('[data-order]').forEach(b=>b.disabled=false);$('#orderResult').textContent='Выбрано 0 из 4'}}let select=$('#learningDetail');if(select){const descriptions=id==='conditions'?{prepare:'Вводные и согласования направляются на partner_support@dc2b.ru для подготовки договора. Затем — согласование договора в СБИС.',sign:'Подписание партнёром 2 экз.; есть возможность ЭДО. Скан в тот же день — на partner_support@dc2b.ru. Оригинал в течение 3 дней — в ЦО, для удалённых партнёров заказывают курьера. Тип дней, точка отсчёта срока и связь ЭДО с бумажными оригиналами не уточнены.'}:{manager:'Менеджер регистрирует в своём кабинете, распечатывает Оферту и СОПД, подписывает с партнёром и загружает в Личный кабинет. Информация передаётся для проверки ДЗБ.',partner:'МРБ отправляет ссылку через «Пригласить партнера». Партнёр регистрируется по ссылке и подписывает документы ЭЦП. Информация передаётся для проверки ДЗБ.',sms:'Не начал / не закончил: на следующий день, через 3 дня, раз в неделю 3 недели. На доработке: дополнительно сразу после выставления статуса. Дополнительные точки отсчёта не уточнены.'};select.onchange=()=>$('#learningDetailResult').textContent=descriptions[select.value];select.onchange()}}
function cleanSources(){let main=$('#main');main.querySelectorAll('.source-mini,.clean-source,.source-fold,.feedback .caption').forEach(e=>e.remove());main.querySelectorAll('.material .caption').forEach(e=>{let t=e.textContent;if(/\.pdf|стр\.\s*\d/.test(t)){let status=t.match(/^(Изучено|В процессе|Не начато)/);if(status)e.textContent=status[1];else e.remove()}});let d=main.querySelector('.doc');if(d&&route().v!=='lesson')d.querySelectorAll(':scope>.eyebrow,:scope>p.caption,:scope>.toc,:scope>details.note').forEach(e=>e.remove());let footer=main.querySelector('footer');if(footer&&footer.textContent!=='Личный портал Direct Tech')footer.textContent='Личный портал Direct Tech'}
const previousLearningRender=render;render=function(){previousLearningRender();if(route().v==='lesson')bindPractice();cleanSources()};let queue=false;new MutationObserver(()=>{if(queue)return;queue=true;queueMicrotask(()=>{queue=false;cleanSources()})}).observe($('#main'),{childList:true,subtree:true});render();
</script></body></html>
