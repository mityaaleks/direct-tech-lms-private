</style></head><body><a class="btn skip" href="#main">К содержанию</a><header><button aria-controls="side" aria-expanded="false" aria-label="Открыть разделы" class="mobile" id="menu">☰</button><a class="brand" href="#/library">DIRECT TECH<b> /</b> знания</a><form id="searchForm" role="search"><input aria-label="Поиск по базе знаний" id="searchInput" placeholder="Найти инструкцию или контакт" type="search"/><button type="submit">Найти</button></form></header><div class="shell"><aside aria-label="Разделы" id="side"></aside><main id="main" tabindex="-1"></main></div><div class="toast" hidden="" id="toast" role="status"></div><script id="content" type="application/json">{"modules": [{"id": "overview", "title": "Этапы подключения нового партнёра", "source": "Этапы подключения нового партнера.pdf, стр. 1", "text": "Новый партнёр\n1. Определение условий\nФорма сотрудничества: офлайн, онлайн или смешанная схема.\nУсловия взаиморасчётов.\n2. Регистрация партнёра\n3. Обучение агентов\n4. Сопровождение партнёра", "limit": "Подробные действия, сроки и ответственные в исходной схеме не указаны. Регистрация — второй этап, а не завершение всей схемы.", "summary": "Общая схема: условия, регистрация, обучение агентов и сопровождение."}, {"id": "conditions", "title": "Работа с партнёром", "source": "Работа с партнером.pdf, стр. 1–2", "text": "СТРАНИЦА 1. Стандартные Условия (Партнёр работает по оферте)\nРегистрация партнёра → Согласование ДЗБ → Регистрация партнёра в ДК → Аккредитация → Обучение Агентов → Старт продаж.\nНесколько вариантов условий (магазинов) для партнеров, файл «Продукты ДК_Ритейл» (обновляется ежемесячно).\nДК Ритейл (высокодоходный кабинет). Рассрочки субсидированные.\nДК Ритейл Лайт (ставки ниже ДК Ритейл 1) +ОД.\nДК Универсальный (низкодоходные продукты) +ОД.\nДК Выгодный (услуга по подбору кредитных продуктов) — партнёрам, которые готовы делать скидку, но не оформляют доп.услуги.\nМТС Франчайзи.\nКАБИНЕТ 1 и 2 (для партнёров с Инд.условиями).\nПредусмотрено стандартное АВ для агентов, работающих с оплатой. Изменения не предусмотрены.\nДействует автоматическая настройка Доп. Услуг. Изменения не предусмотрены.\nОговорка источника: «В исключительных возможны изменения АВ и изменения тарифа ДУ с согласования ДЦРБ».\nСТРАНИЦА 2. Индивидуальные условия (С Партнёром заключается соглашение/агентский договор)\nМенеджер регистрирует партнёра, прикладывая Инд. Договор вместо Оферты.\nОбрыв извлечения: «Либо Партнёр регистрируется самостоятельно и далее МРБ». Продолжение не додумывается.\nОтправка вводных и согласования на partner_support@dc2b.ru для подготовки договора.\nВ карточку ТО вносятся изменения согласно уведомлению Договора.\nБлоки процесса: Обсуждение ИУ с партнёром → Расчет Фин. Модели РРРБ → Отправка вводных и согласования на partner_support@dc2b.ru для подготовки договора → Согласование договора в СБИС → Подписание партнёром 2 экз.\nЕсть возможность подписания по ЭДО.\nСкан в тот же день на partner_support@dc2b.ru.\nОригинал в течение 3 дней отправляется в ЦО (для удалённых партнёров необходимо заказать курьера).\nПри ИУ возможно изменение Продуктовой линейки и оплата расчетного КВ в пользу ЮЛ.\nПродукты, ставки, скидки и КВ указываются в уведомлении.\nПри изменении продуктов, коммерции уведомление меняется на стороне ДК и отправляется партнёру для ознакомления.", "limit": "Актуальная продуктовая матрица не установлена. Тип дней, точка отсчёта срока и связь ЭДО с бумажными оригиналами явно не уточнены. Сокращения не расшифровываются предположением. «КАБИНЕТ 1 и 2» на странице стандартных условий подписан как вариант для ИУ.", "summary": "Оферта и индивидуальные условия: кабинеты, согласования и документы."}, {"id": "registration", "title": "Регистрация партнёра", "source": "Регистрация партнера (ссылка google).pdf, стр. 1–2", "text": "СТРАНИЦА 1. Регистрация партнёра\nЛичный кабинет МРБ: https://dc2b.ru/\nВ извлечении подписи «презентация» и «видео»: https://dc2b.ru/files/mrb.mp4\nМенеджер регистрирует партнёра в своём кабинете. Распечатывает формы Оферты и СОПД, подписывает с партнёром и загружает в Личный кабинет. Информация передаётся для проверки ДЗБ.\nЛичный кабинет партнёра: https://dc2b.ru/files/LK_partner.pdf\nПартнёр самостоятельно регистрируется по ссылке, полученной от МРБ, подписывает документы ЭЦП. Информация передаётся для проверки ДЗБ.\nДля отправки партнёру ссылки для регистрации используется вкладка «Пригласить партнера».\nНа площадках Google Play и App Store можно скачать мобильное приложение портала.\nGoogle Play: https://play.google.com/store/apps/details?id=ru.dc2b.lk\nApp Store: https://apps.apple.com/ru/app/%D0%B4%D0%BA%D1%86/id6473836779\nПри регистрации ЮЛ вносится ФИО и телефон агента. После чего Агенту приходит СМС со ссылкой для регистрации. Рядом в извлечении указан адрес https://dc2b.ru/files/LK_UBL.pdf\nСТРАНИЦА 2. СМС-напоминания\nЕсли партнёр начал регистрацию и не завершил её: «Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли в данных ошибка в регистрации ГД, ДЗБ направит партнёра «На доработку»: «Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11».\nЕсли УБЛ была направлена ссылка, но регистрация не начата: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Заполните анкету по ссылке, чтобы начать продавать ссылка».\nЕсли УБЛ начал регистрацию и не завершил её: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЕсли ДЗБ нашёл замечания в регистрации УБЛ и отправил его «На доработку»: «Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка».\nЧастота отправки напоминаний:\nНе закончил регистрацию, не начал регистрацию: СМС отправляется на следующий день, через 3 дня, раз в неделю 3 недели.\nОтправлен на доработку: сразу после выставления статуса «На доработке», на следующий день, через 3 дня, раз в неделю 3 недели.", "limit": "Ссылки и приложения не проверены. PDF LK_UBL не выдаётся за фактическую ссылку регистрации из СМС. Имя, телефон и ООО «КОМОДИНИ» — элементы шаблонов, не проверенные контакты. Расписание передано буквально. Для описанной регистрации менеджером на ИУ предыдущий документ указывает Инд. Договор вместо Оферты. Порядок СОПД для ИУ отдельно не установлен.", "summary": "Два способа регистрации, данные агента и СМС-напоминания."}]}</script><script>

const C=JSON.parse($('#content').textContent),bodies={"overview": "<p class=\"muted\">Общая схема подключения. Подробные инструкции по условиям и регистрации доступны по ссылкам ниже.</p><ol class=\"stage-grid\"><li><h2>Определение условий</h2><p>Форма сотрудничества: офлайн, онлайн или смешанная схема.</p><p>Условия взаиморасчётов.</p><a class=\"btn\" href=\"#/article/conditions\">Условия сотрудничества →</a></li><li><h2>Регистрация партнёра</h2><p>Второй этап подключения, а не завершение всей схемы.</p><a class=\"btn\" href=\"#/article/registration\">Инструкция по регистрации →</a></li><li><h2>Обучение агентов</h2><p>Подробный порядок действий в предоставленном материале не указан.</p></li><li><h2>Сопровождение партнёра</h2><p>Подробный порядок действий в предоставленном материале не указан.</p></li></ol>", "conditions": "<p class=\"muted\">Выбери условия сотрудничества: по оферте или по соглашению / агентскому договору.</p><div class=\"condition-tabs\" role=\"tablist\" aria-label=\"Условия сотрудничества\"><button type=\"button\" role=\"tab\" id=\"tab-standard\" data-condition=\"standard\" aria-controls=\"panel-standard\" aria-selected=\"true\" tabindex=\"0\">Стандартные условия</button><button type=\"button\" role=\"tab\" id=\"tab-individual\" data-condition=\"individual\" aria-controls=\"panel-individual\" aria-selected=\"false\" tabindex=\"-1\">Индивидуальные условия</button></div><section aria-labelledby=\"tab-standard\" id=\"panel-standard\" role=\"tabpanel\" tabindex=\"0\"><section class=\"work-panel\"><h3>Порядок подключения по оферте</h3><ol class=\"work-steps\"><li>Регистрация партнёра</li><li>Согласование ДЗБ</li><li>Регистрация партнёра в ДК</li><li>Аккредитация</li><li>Обучение Агентов</li><li>Старт продаж</li></ol></section><section class=\"work-panel\"><h3>Варианты условий и кабинетов</h3><div class=\"cabinet-grid\"><div class=\"cabinet\"><h4>ДК Ритейл</h4>Высокодоходный кабинет. Рассрочки субсидированные.</div><div class=\"cabinet\"><h4>ДК Ритейл Лайт</h4>Ставки ниже ДК Ритейл 1. +ОД.</div><div class=\"cabinet\"><h4>ДК Универсальный</h4>Низкодоходные продукты. +ОД.</div><div class=\"cabinet\"><h4>ДК Выгодный</h4>Услуга по подбору кредитных продуктов. Для партнёров, которые готовы делать скидку, но не оформляют доп.услуги.</div><div class=\"cabinet\"><h4>МТС Франчайзи</h4></div><div class=\"cabinet\"><h4>КАБИНЕТ 1 и 2</h4>Для партнёров с Инд.условиями. </div></div></section><section class=\"work-panel\"><h3>АВ, дополнительные услуги и исключения</h3><p>Предусмотрено стандартное АВ для агентов, работающих с оплатой. Изменения не предусмотрены.</p><p>Действует автоматическая настройка Доп. Услуг. Изменения не предусмотрены.</p><div class=\"note\">Исключение: В исключительных возможны изменения АВ и изменения тарифа ДУ с согласования ДЦРБ.</div></section></section><section id=\"panel-individual\" role=\"tabpanel\" aria-labelledby=\"tab-individual\" tabindex=\"0\" hidden><section class=\"work-panel\"><h3>Основа сотрудничества</h3><p>С партнёром заключается соглашение / агентский договор.</p></section><section class=\"work-panel\"><h3>Подготовка и согласование</h3><ol class=\"work-steps\"><li>Обсуждение ИУ с партнёром.</li><li>Расчет Фин. Модели РРРБ.</li><li>Отправка вводных и согласования на <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru</a> для подготовки договора.</li><li>Согласование договора в СБИС.</li></ol></section><section class=\"work-panel\"><h3>Регистрация партнёра</h3><p>Менеджер регистрирует партнёра, прикладывая Инд. Договор вместо Оферты.</p><a class=\"btn\" href=\"#/article/registration\">Инструкция по регистрации →</a></section><section class=\"work-panel\"><h3>Подписание и отправка документов</h3><p>Партнёр подписывает 2 экземпляра. Есть возможность подписания по ЭДО.</p><div class=\"cabinet-grid\"><div class=\"cabinet\"><h4>Скан — в тот же день</h4><p>Отправить на <a href=\"mailto:partner_support@dc2b.ru\">partner_support@dc2b.ru</a>.</p></div><div class=\"cabinet\"><h4>Оригинал — в течение 3 дней</h4><p>Отправить в ЦО. Для удалённых партнёров необходимо заказать курьера.</p></div></div></section><section class=\"work-panel\"><h3>Продукты, коммерция и уведомление</h3><ul><li>При ИУ возможно изменение Продуктовой линейки и оплата расчетного КВ в пользу ЮЛ.</li><li>Продукты, ставки, скидки и КВ указываются в уведомлении.</li><li>В карточку ТО вносятся изменения согласно уведомлению Договора.</li><li>При изменении продуктов, коммерции уведомление меняется на стороне ДК и отправляется партнёру для ознакомления.</li></ul></section></section>", "registration": "<p class=\"muted\">Регистрация партнёра, данные агента и напоминания — отдельно по каждой задаче.</p><section class=\"reg-section\"><h2>1. Регистрация партнёра</h2><div class=\"reg-scenarios\"><section class=\"reg-scenario\"><h3>Регистрирует менеджер</h3><ol class=\"reg-steps\"><li>Открой личный кабинет МРБ и зарегистрируй партнёра.</li><li>Распечатай формы Оферты и СОПД.</li><li>Подпиши документы с партнёром и загрузи их в Личный кабинет.</li><li>Информация передаётся для проверки ДЗБ.</li></ol><div class=\"row\"><a class=\"btn\" href=\"https://dc2b.ru/\" rel=\"noopener noreferrer\" target=\"_blank\">Личный кабинет МРБ</a><a class=\"btn\" href=\"https://dc2b.ru/files/mrb.mp4\" rel=\"noopener noreferrer\" target=\"_blank\">Видео для МРБ</a></div></section><section class=\"reg-scenario\"><h3>Партнёр регистрируется самостоятельно</h3><ol class=\"reg-steps\"><li>Во вкладке «Пригласить партнера» отправь партнёру ссылку.</li><li>Партнёр самостоятельно регистрируется по полученной от МРБ ссылке.</li><li>Партнёр подписывает документы ЭЦП.</li><li>Информация передаётся для проверки ДЗБ.</li></ol><div class=\"row\"><a class=\"btn\" href=\"https://dc2b.ru/files/LK_partner.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Личный кабинет партнёра · PDF</a></div></section></div></section><section class=\"reg-section\"><h2>2. Данные агента при регистрации ЮЛ</h2><ol class=\"reg-steps\"><li>При регистрации ЮЛ внеси ФИО и телефон агента.</li><li>После этого агенту приходит СМС со ссылкой для регистрации.</li></ol><div class=\"row\"><a class=\"btn\" href=\"https://dc2b.ru/files/LK_UBL.pdf\" rel=\"noopener noreferrer\" target=\"_blank\">Материал по УБЛ · PDF</a></div></section><section class=\"reg-section\"><h2>3. СМС-напоминания</h2><p class=\"caption\">Тексты примеров: имя, телефон и ООО «КОМОДИНИ» не являются действующими контактами для обращения.</p><section class=\"reg-sms-group\"><h3>Партнёр</h3><div class=\"reg-sms\"><h4>Регистрация не завершена</h4><blockquote>Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11</blockquote></div><div class=\"reg-sms\"><h4>Ошибки в регистрации ГД — возврат на доработку</h4><blockquote>Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка. Если у Вас есть вопросы, менеджер в ООО «Директ Тех» Васильев Василий тел +7(111) 111 111 11</blockquote></div></section><section class=\"reg-sms-group\"><h3>УБЛ</h3><div class=\"reg-sms\"><h4>Ссылка отправлена, регистрация не начата</h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Заполните анкету по ссылке, чтобы начать продавать ссылка</blockquote></div><div class=\"reg-sms\"><h4>Регистрация не завершена</h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Закончите заполнение анкеты по ссылке, чтобы начать продавать ссылка</blockquote></div><div class=\"reg-sms\"><h4>Замечания ДЗБ — возврат на доработку</h4><blockquote>Напоминаем, Вам предоставлен ООО \"КОМОДИНИ\" доступ для оформления кредитов. Исправьте ошибки допущенные при заполнение анкеты по ссылке, чтобы начать продавать ссылка</blockquote></div></section><h3>Когда отправляются напоминания</h3><div class=\"reg-scenarios\"><div class=\"reg-scenario\"><h4>Не начал / не закончил регистрацию</h4><ul>
